<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><title>Join Example Club</title></head>
<body>
<h1>Create your account</h1>
<form id="f" onsubmit="event.preventDefault(); window.__submitted = (window.__submitted || 0) + 1;">
  <section id="s1">
    <label for="fn">First name</label> <input id="fn" name="firstName" required>
    <label for="ln">Last name</label> <input id="ln" name="lastName" required>
    <label for="mn">Middle name</label> <input id="mn" name="middleName">
    <label for="em">Email address</label> <input id="em" type="email" name="email" required>
    <button type="button" id="next1" onclick="go(2)">Next</button>
  </section>
  <section id="s2" hidden>
    <label>Street address <input name="addr1" autocomplete="address-line1"></label>
    <label>Apt / Suite <input name="addr2"></label>
    <label>City <input name="city"></label>
    <label>State
      <select name="state"><option value="">Select a state</option><option value="AZ">Arizona</option><option value="CA">California</option><option value="NY">New York</option></select>
    </label>
    <label>ZIP code <input name="zip" maxlength="10"></label>
    <label>Country
      <select name="country"><option value="">Choose…</option><option value="CA">Canada</option><option value="US">United States</option><option value="MX">Mexico</option></select>
    </label>
    <label>How did you hear about us? <input name="referral"></label>
    <button type="button" id="next2" onclick="go(3)">Continue</button>
  </section>
  <section id="s3" hidden>
    <label>Username <input name="username" autocomplete="username"></label>
    <label>Create password <input type="password" name="pw" autocomplete="new-password" minlength="12" passwordrules="minlength: 20; required: lower; required: upper; required: digit; required: [-_!]"></label>
    <label>Confirm password <input type="password" name="pw2"></label>
    <label><input type="checkbox" name="terms"> I agree to the Terms of Service</label>
    <button type="submit" id="create">Create account</button>
  </section>
</form>
<script>
function go(n) { for (var i = 1; i <= 3; i++) document.getElementById('s' + i).hidden = i !== n; window.__step = n; }
window.__step = 1;
</script>
</body></html>
