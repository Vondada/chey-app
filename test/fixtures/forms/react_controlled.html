<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><title>Profile settings</title></head>
<body>
<h1>Edit profile</h1>
<form id="f" onsubmit="event.preventDefault();">
  <label>First name <input id="first" name="first"></label>
  <label>Email <input id="email" type="email" name="email"></label>
  <label>Password <input id="pw" type="password" name="password" autocomplete="current-password"></label>
  <button type="submit">Save</button>
</form>
<script>
// A small emulation of React's controlled inputs (inputValueTracking): an
// instance-level value setter updates the tracker, so a plain `el.value = x`
// is invisible to the component and its state is NOT updated; on blur the
// component re-renders from state, wiping such a value. Only the native
// prototype setter + input event reaches state.
window.__state = { first: '', email: '', password: '' };
['first', 'email', 'pw'].forEach(function (id) {
  var el = document.getElementById(id), key = id === 'pw' ? 'password' : id;
  var proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  var tracker = '';
  Object.defineProperty(el, 'value', {
    configurable: true,
    get: function () { return proto.get.call(this); },
    set: function (v) { tracker = String(v); proto.set.call(this, v); },
  });
  el.addEventListener('input', function () {
    var now = proto.get.call(el);
    if (now !== tracker) { tracker = now; window.__state[key] = now; }
  });
  el.addEventListener('blur', function () { proto.set.call(el, window.__state[key]); tracker = window.__state[key]; });
});
</script>
</body></html>
