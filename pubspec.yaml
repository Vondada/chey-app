name: chey
description: CHE — Cognitive Horizon Engine.
publish_to: none
version: 1.4.7+16

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  flutter_webrtc: ^1.6.2+hotfix.3
  porcupine_flutter: ^4.0.0
  shorebird_code_push: ^2.0.0
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.6
  archive: ^4.3.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/office3d/
    - assets/avatars/
    - shorebird.yaml

flutter_launcher_icons:
  # Regenerates ios/Runner/Assets.xcassets/AppIcon.appiconset from this one
  # 1024x1024 source. Run automatically by tool/bootstrap.sh on every build.
  ios: true
  android: false
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
