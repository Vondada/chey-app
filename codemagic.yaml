# CHE mobile-only iPhone delivery.
# Normal owner flow: merge to main -> Codemagic decides fast Shorebird patch vs
# full IPA -> successful full IPA is published to GitHub Releases -> CHE Worker
# exposes stable SideStore URLs. No Codemagic/GitHub dashboard is needed for
# normal installs after the one-time secret setup.
#
# One-time Codemagic group `che_ship`:
#   SHOREBIRD_TOKEN  (Secret) — optional but required for fast OTA updates
#   GITHUB_TOKEN     (Secret) — fine-grained token for Vondada/chey-app,
#                              Contents: read/write + Commit statuses: read/write.
#                              Used only to publish Releases and report build status
#   CHE_AGENT_URL    (optional) — defaults to CHE production Worker
#
# The token never enters Flutter or a release asset.

workflows:
  chey-mobile:
    name: CHE iPhone full SideStore release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - che_ship
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
    scripts:
      - name: Bootstrap native projects
        script: bash ./tool/bootstrap.sh
      - name: Enable local AI + voice tuning bridge
        script: python3 ./tool/patch_local_runtime.py
      - name: Flutter analyze
        script: |
          set -eu
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Build, verify and publish full iPhone update
        script: bash ./tool/che_mobile_release.sh full
      - name: Mark mobile pipeline successful
        script: touch "$HOME/CHE_MOBILE_SUCCESS"
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/CHE-unsigned.ipa
      - build/ios/ipa/CHE-update.json
    publishing:
      scripts:
        - name: Report CHE mobile build result
          script: bash ./tool/report_mobile_build_status.sh

  chey-shorebird:
    name: CHE automatic mobile update
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - che_ship
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        excludes:
          - 'server/**'
          - 'docs/**'
          - '**/*.md'
    scripts:
      - name: Bootstrap native projects
        script: bash ./tool/bootstrap.sh
      - name: Enable local AI + voice tuning bridge
        script: python3 ./tool/patch_local_runtime.py
      - name: Flutter analyze
        script: |
          set -eu
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Choose fast patch or full iPhone release
        script: bash ./tool/che_mobile_release.sh auto
      - name: Mark mobile pipeline successful
        script: touch "$HOME/CHE_MOBILE_SUCCESS"
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/CHE-unsigned.ipa
      - build/ios/ipa/CHE-update.json
    publishing:
      scripts:
        - name: Report CHE mobile build result
          script: bash ./tool/report_mobile_build_status.sh
