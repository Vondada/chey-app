workflows:
  che-ios-native:
    name: CHE Native iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build iPhone app without signing
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          rm -rf Payload CHE-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          /usr/bin/zip -qry CHE-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/CHE-unsigned.ipa
      - build/ios/iphoneos/Runner.app
