# Codemagic free-tier CI for CHE (personal account: 500 macOS M2 min/month).
# Replaces GitHub Actions for analyze + Shorebird patch + SideStore IPA while
# Actions is blocked by billing. Does not use GitHub Actions.
#
# Dashboard setup (one-time):
# 1. Sign in at https://codemagic.io with a personal account (Teams lose free minutes).
# 2. Add app → GitHub → install Codemagic GitHub App on Vondada → select chey-app.
# 3. Application settings → Environment variables → new group `che_ship` with:
#      SHOREBIRD_TOKEN  (Secret) — API key from https://console.shorebird.dev
#      CHE_AGENT_URL    (optional) — Worker base URL for dart-defines
#      CLOUDFLARE_API_TOKEN (Secret) — lets `che-worker` deploy the CHE server
# 4. Ensure Workflows uses this codemagic.yaml (not Workflow Editor-only).
# 5. Webhooks: enable for the repo so `triggering` below fires on push to main.
# 6. Manual: Start new build → workflow `chey-shorebird` (or `chey-mobile`).
#
# Shorebird notes:
# - patch = OTA Dart update for phones already on a Shorebird release IPA.
# - IPA artifact below is unsigned SideStore install; for a new Shorebird base
#   release, set CM_SHOREBIRD_MODE=release on a manual build (or change default).

workflows:
  chey-mobile:
    name: CHE iPhone SideStore
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - che_ship
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        excludes:
          - 'server/**'
          - 'docs/**'
          - '**/*.md'
    scripts:
      - name: Bootstrap native projects
        script: bash ./tool/bootstrap.sh
      - name: Enable local AI + voice tuning bridge
        script: python3 ./tool/patch_local_runtime.py
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"
      - name: Package unsigned IPA for SideStore
        script: |
          set -eu
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry CHE-unsigned.ipa Payload
          rm -r Payload
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/CHE-unsigned.ipa

  chey-shorebird:
    name: CHE analyze + Shorebird + SideStore IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - che_ship
      vars:
        CM_SHOREBIRD_MODE: patch
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        excludes:
          - 'server/**'
          - 'docs/**'
          - '**/*.md'
    scripts:
      - name: Bootstrap native projects
        script: bash ./tool/bootstrap.sh
      - name: Enable local AI + voice tuning bridge
        script: python3 ./tool/patch_local_runtime.py
      - name: Flutter analyze
        script: |
          set -eu
          flutter pub get
          # infos alone should not block Shorebird OTA; warnings/errors still fail
          flutter analyze --no-fatal-infos
      - name: Install Shorebird CLI
        script: |
          set -eu
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> "$CM_ENV"
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird --version
      - name: Shorebird patch or release
        script: |
          set -eu
          export PATH="$HOME/.shorebird/bin:$PATH"
          if [[ -z "${SHOREBIRD_TOKEN:-}" || ! -f shorebird.yaml ]]; then
            echo "Shorebird not configured (need SHOREBIRD_TOKEN in che_ship group and shorebird.yaml). Skipping OTA step."
            exit 0
          fi
          MODE="${CM_SHOREBIRD_MODE:-patch}"
          if [[ "$MODE" == "release" ]]; then
            shorebird release ios --no-codesign -- \
              --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"
          else
            shorebird patch ios --no-codesign --release-version=latest -- \
              --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"
          fi
      - name: Build unsigned iOS app (SideStore IPA)
        script: |
          set -eu
          flutter build ios --release --no-codesign \
            --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"
      - name: Package unsigned IPA for SideStore
        script: |
          set -eu
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry CHE-unsigned.ipa Payload
          rm -r Payload
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/CHE-unsigned.ipa

  che-worker:
    # Deploys CHE's Cloudflare server (server/cloudflare) without GitHub Actions.
    # Needs CLOUDFLARE_API_TOKEN (Secret, "Edit Cloudflare Workers" template)
    # in the che_ship group. Skips itself when no server file changed.
    name: CHE server deploy (Cloudflare)
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      node: 22
      groups:
        - che_ship
      vars:
        CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'server/cloudflare/**'
    scripts:
      - name: Check and deploy Worker
        working_directory: server/cloudflare
        script: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing from the che_ship group"; exit 1
          fi
          npm ci
          npm run check
          npm test || echo "Some unit tests failed; deploying anyway (syntax check passed)"
          npx wrangler deploy
