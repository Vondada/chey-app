name: CHE golden refresh (temporary)

# Temporary, for PR #431 only: renders the changed goldens with the CI Flutter version and prints them as base64,
# so the new reference images can be committed from a machine without Flutter. Removed before merge.
on:
  push:
    branches: [claude/che-home-2]

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
      - name: render goldens
        run: |
          set +e
          flutter test --update-goldens test/che_palette_screens_test.dart test/che_home_2_golden_test.dart
          echo "exit $?"
      - name: print goldens
        run: |
          for f in test/goldens/appearance_*.png test/goldens/home2_*.png; do
            [ -f "$f" ] || continue
            echo "GOLDEN-BEGIN $f $(sha256sum "$f" | cut -c1-64)"
            base64 -w 3000 "$f"
            echo "GOLDEN-END $f"
          done
