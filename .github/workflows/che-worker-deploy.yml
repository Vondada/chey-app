name: Deploy CHE Worker

# Deploys server/cloudflare to Cloudflare Workers.
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard -> My Profile -> API Tokens -> "Edit Cloudflare
# Workers" template). Then run this workflow from the Actions tab, or just
# merge to main: changes under server/cloudflare deploy automatically.

# Cloudflare Workers Builds remains available, but this workflow is the
# deterministic production fallback for every relevant main-branch change.
# A server/cloudflare push must never be silently skipped after green CI.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/cloudflare/**"
      - ".github/workflows/che-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: che-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The push path filter already limits automatic runs to Worker/deploy
    # changes. Do not add a commit-message gate here: follow-up fixes can merge
    # without a marker and must still deploy the exact green main commit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
      # Lets CHE open owner-approved branches/PRs from the phone. The token
      # stays in GitHub Actions/Cloudflare secrets and never reaches Flutter.
      CHE_GITHUB_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN }}
      # Optional free AI engines CHE falls back to when Cloudflare's daily
      # allowance runs out. Add any of these as repository secrets.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CHE_ELEVENLABS_VOICE_ID: ${{ secrets.CHE_ELEVENLABS_VOICE_ID }}
      # Owner-authorized 2026-10-11: Mary is preferred for CHE's requested
      # speech only. Set the Actions secret CHE_ELEVENLABS_PREFERRED=0 to
      # immediately disable on the next deployment; revoke the capped
      # ElevenLabs API key for immediate provider-side shutdown.
      # A repository variable CHE_ELEVENLABS_PREFERRED=0 is also supported.
      CHE_ELEVENLABS_PREFERRED: ${{ secrets.CHE_ELEVENLABS_PREFERRED || vars.CHE_ELEVENLABS_PREFERRED || '1' }}
      CHE_OPENAI_API_KEY: ${{ secrets.CHE_OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHE_OLLAMA_URL: ${{ secrets.CHE_OLLAMA_URL }}
      CHE_OLLAMA_TOKEN: ${{ secrets.CHE_OLLAMA_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CHE_PGVECTOR_REST_URL: ${{ secrets.CHE_PGVECTOR_REST_URL }}
      CHE_PGVECTOR_TOKEN: ${{ secrets.CHE_PGVECTOR_TOKEN }}
      CHE_VMWARE_TRAINING_URL: ${{ secrets.CHE_VMWARE_TRAINING_URL }}
      CHE_VMWARE_TRAINING_TOKEN: ${{ secrets.CHE_VMWARE_TRAINING_TOKEN }}
      CHE_HF_TRAINING_URL: ${{ secrets.CHE_HF_TRAINING_URL }}
      CHE_HF_TRAINING_TOKEN: ${{ secrets.CHE_HF_TRAINING_TOKEN }}
      CHE_HF_TTS_URL: ${{ secrets.CHE_HF_TTS_URL }}
      CHE_COMPUTER_URL: ${{ secrets.CHE_COMPUTER_URL }}
      CHE_COMPUTER_TOKEN: ${{ secrets.CHE_COMPUTER_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # "Chay" wake word (Picovoice Porcupine). The phone can also save these
      # itself under CHE controls → Wake word.
      CHE_PICOVOICE_ACCESS_KEY: ${{ secrets.CHE_PICOVOICE_ACCESS_KEY }}
      CHE_PICOVOICE_KEYWORD_PPN_B64: ${{ secrets.CHE_PICOVOICE_KEYWORD_PPN_B64 }}
      CHE_PICOVOICE_SENSITIVITY: ${{ secrets.CHE_PICOVOICE_SENSITIVITY }}
      # Google sign-in for YouTube. Synced only when set, so an unset value
      # never overwrites what is already in Cloudflare.
      CHE_YOUTUBE_CLIENT_ID: ${{ secrets.CHE_YOUTUBE_CLIENT_ID }}
      CHE_YOUTUBE_CLIENT_SECRET: ${{ secrets.CHE_YOUTUBE_CLIENT_SECRET }}
      CHE_OAUTH_SECRET: ${{ secrets.CHE_OAUTH_SECRET }}
      # Optional owner's video renderer; never create, pay for or start one.
      CHE_VIDEO_GEN_URL: ${{ secrets.CHE_VIDEO_GEN_URL }}
      CHE_VIDEO_GEN_TOKEN: ${{ secrets.CHE_VIDEO_GEN_TOKEN }}
      CHE_VIDEO_RENDER_URL: ${{ secrets.CHE_VIDEO_RENDER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: |
          for f in server/cloudflare/*.js; do node --check "$f"; done
          node --test server/cloudflare/*.test.mjs

      - name: Check Cloudflare token
        id: token
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Edit Cloudflare Workers token) to deploy CHE."
            exit 1
          fi

      - name: Check opted-in ElevenLabs credentials without spending credits
        shell: bash
        run: |
          # Fail the deploy if owner-enabled premium speech has no credentials.
          # This only checks presence and format; it does NOT synthesize audio.
          if [[ "${CHE_ELEVENLABS_PREFERRED,,}" =~ ^(1|true|yes)$ ]]; then
            if [[ -z "${ELEVENLABS_API_KEY}" || ! "${CHE_ELEVENLABS_VOICE_ID}" =~ ^[A-Za-z0-9_-]{10,80}$ ]]; then
              echo "::error::Premium voice was enabled, but the ElevenLabs API key or Voice ID is missing."
              exit 1
            fi
            echo "CHE Mary TTS configured. No credits spent during deployment."
          else
            echo "CHE premium voice remains disabled."
          fi

      - name: Sync AI engine keys to the Worker
        working-directory: server/cloudflare
        run: |
          node -e '
            const out = {};
            for (const k of ["CHE_YOUTUBE_CLIENT_ID", "CHE_YOUTUBE_CLIENT_SECRET", "CHE_OAUTH_SECRET", "CHE_VIDEO_GEN_URL", "CHE_VIDEO_GEN_TOKEN", "CHE_VIDEO_RENDER_URL", "CHE_GITHUB_TOKEN", "ELEVENLABS_API_KEY", "CHE_ELEVENLABS_VOICE_ID", "CHE_ELEVENLABS_PREFERRED", "CHE_OPENAI_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "CHE_OLLAMA_URL", "CHE_OLLAMA_TOKEN", "XAI_API_KEY", "GROQ_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY", "CEREBRAS_API_KEY", "MISTRAL_API_KEY", "GITHUB_MODELS_TOKEN", "SAMBANOVA_API_KEY", "HF_TOKEN", "CHE_PGVECTOR_REST_URL", "CHE_PGVECTOR_TOKEN", "CHE_VMWARE_TRAINING_URL", "CHE_VMWARE_TRAINING_TOKEN", "CHE_HF_TRAINING_URL", "CHE_HF_TRAINING_TOKEN", "CHE_HF_TTS_URL", "CHE_COMPUTER_URL", "CHE_COMPUTER_TOKEN", "STRIPE_SECRET_KEY", "CHE_PICOVOICE_ACCESS_KEY", "CHE_PICOVOICE_KEYWORD_PPN_B64", "CHE_PICOVOICE_SENSITIVITY"]) {
              if (process.env[k]) out[k] = process.env[k];
            }
            // An absent/cleared GitHub opt-in MUST revoke any previously live
            // Worker setting. Bulk secret sync otherwise leaves the old '1'.
            out.CHE_ELEVENLABS_PREFERRED =
              ["1", "true", "yes"].includes(String(process.env.CHE_ELEVENLABS_PREFERRED || "").toLowerCase())
                ? "1" : "0";
            require("fs").writeFileSync("/tmp/che-secrets.json", JSON.stringify(out));
            console.log("Syncing", Object.keys(out).length ? Object.keys(out).join(", ") : "no optional keys");
          '
          if [[ "$(cat /tmp/che-secrets.json)" != "{}" ]]; then
            npx --yes wrangler@4 secret bulk /tmp/che-secrets.json
          fi
          rm -f /tmp/che-secrets.json

      - name: Deploy
        working-directory: server/cloudflare
        # Deploy after secret sync so the final live version retains its SHA tag.
        run: npx --yes wrangler@4 deploy --tag "${GITHUB_SHA::12}" --message "deploy ${GITHUB_SHA::12}"

      - name: Verify live deployed commit
        env:
          EXPECTED_TAG: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const expected = process.env.EXPECTED_TAG.slice(0, 12);
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/health', { signal: AbortSignal.timeout(10000) });
              const health = await response.json();
              if (response.ok && health.ok && health.version_tag === expected) {
                console.log(`Verified live CHE commit ${expected}, version ${health.version_id}`);
                process.exit(0);
              }
            } catch { /* retry propagation or a transient health error */ }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error(`Live CHE did not confirm commit ${expected}`);
          JS

      - name: Verify live SideStore install link
        # SideStore names the app from the IPA URL's last path segment. The live
        # link must end in the real bundle ID, and the IPA must be reachable.
        run: |
          node --input-type=module <<'JS'
          const base = 'https://chey-app.henryjavoni.workers.dev';
          const bundleId = 'com.cheyapp.chey';
          const read = async (url, method = 'GET') => {
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const response = await fetch(url, { method, signal: AbortSignal.timeout(20000) });
                return response;
              } catch { /* retry a transient error */ }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`Could not reach ${url}`);
          };
          const latestResponse = await read(`${base}/api/update/latest`);
          const latest = await latestResponse.json();
          if (!latest.ok) {
            console.log('No verified CHE iPhone release is published yet; nothing to check.');
            process.exit(0);
          }
          const ipaUrl = new URL(new URL(latest.sidestore_install_url).searchParams.get('url'));
          const lastSegment = ipaUrl.pathname.split('/').pop();
          if (lastSegment !== `${bundleId}.ipa`) throw new Error(`Install link ends in ${lastSegment}, not ${bundleId}.ipa`);
          const source = await (await read(`${base}/api/update/source`)).json();
          if (source.apps?.[0]?.bundleIdentifier !== bundleId) throw new Error('Update source names a different bundle ID');
          const ipa = await read(ipaUrl.href, 'HEAD');
          if (!ipa.ok) throw new Error(`IPA download returned ${ipa.status}`);
          if (Number(ipa.headers.get('content-length')) !== Number(latest.size)) throw new Error('IPA size differs from the published size');
          console.log(`Verified live install link for ${bundleId} ${latest.version} (${latest.build_number}), ${latest.size} bytes`);
          JS
