name: Deploy CHE Worker

# Deploys server/cloudflare to Cloudflare Workers.
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard -> My Profile -> API Tokens -> "Edit Cloudflare
# Workers" template). Then run this workflow from the Actions tab, or just
# merge to main: changes under server/cloudflare deploy automatically.

# Cloudflare Workers Builds remains available, but this workflow is the
# deterministic production fallback for every relevant main-branch change.
# A server/cloudflare push must never be silently skipped after green CI.
on:
  workflow_dispatch:
    inputs:
      video_check:
        description: Also render one real 15-second video through the free GitHub renderer and verify it
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "server/cloudflare/**"
      - ".github/workflows/che-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: che-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The push path filter already limits automatic runs to Worker/deploy
    # changes. Do not add a commit-message gate here: follow-up fixes can merge
    # without a marker and must still deploy the exact green main commit.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.video_check && 30 || 15 }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
      # Lets CHE open owner-approved branches/PRs from the phone. The token
      # stays in GitHub Actions/Cloudflare secrets and never reaches Flutter.
      CHE_GITHUB_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN }}
      # Optional free AI engines CHE falls back to when Cloudflare's daily
      # allowance runs out. Add any of these as repository secrets.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CHE_ELEVENLABS_VOICE_ID: ${{ secrets.CHE_ELEVENLABS_VOICE_ID }}
      # Owner-authorized 2026-10-11: Mary is preferred for CHE's requested
      # speech only. Set the Actions secret CHE_ELEVENLABS_PREFERRED=0 to
      # immediately disable on the next deployment; revoke the capped
      # ElevenLabs API key for immediate provider-side shutdown.
      # A repository variable CHE_ELEVENLABS_PREFERRED=0 is also supported.
      CHE_ELEVENLABS_PREFERRED: ${{ secrets.CHE_ELEVENLABS_PREFERRED || vars.CHE_ELEVENLABS_PREFERRED || '1' }}
      # CHE's own voice (Fish Audio). Owner-requested 2026-10-14. Fish speaks
      # only when FISH_API_KEY and CHE_FISH_VOICE_ID are both set; the existing
      # voices stay as the fallback. Set CHE_FISH_PREFERRED=0 (secret or
      # variable) to switch Fish off on the next deploy. Model names are plain
      # settings: a repository variable overrides the defaults in the Worker
      # (s2.1-pro-free for everyday speech, drama-3 for stories and narration).
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      CHE_FISH_VOICE_ID: ${{ secrets.CHE_FISH_VOICE_ID || vars.CHE_FISH_VOICE_ID }}
      CHE_FISH_PREFERRED: ${{ secrets.CHE_FISH_PREFERRED || vars.CHE_FISH_PREFERRED || '1' }}
      CHE_FISH_MODEL: ${{ vars.CHE_FISH_MODEL || secrets.CHE_FISH_MODEL }}
      CHE_FISH_EXPRESSIVE_MODEL: ${{ vars.CHE_FISH_EXPRESSIVE_MODEL || secrets.CHE_FISH_EXPRESSIVE_MODEL }}
      CHE_FISH_SPEED: ${{ vars.CHE_FISH_SPEED || secrets.CHE_FISH_SPEED }}
      CHE_FISH_CHARACTER_VOICES: ${{ secrets.CHE_FISH_CHARACTER_VOICES || vars.CHE_FISH_CHARACTER_VOICES }}
      CHE_FISH_MAX_RTF: ${{ vars.CHE_FISH_MAX_RTF || secrets.CHE_FISH_MAX_RTF }}
      CHE_FISH_EXPRESSIVE_DAILY_CHARS: ${{ vars.CHE_FISH_EXPRESSIVE_DAILY_CHARS || secrets.CHE_FISH_EXPRESSIVE_DAILY_CHARS }}
      CHE_OPENAI_API_KEY: ${{ secrets.CHE_OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHE_OLLAMA_URL: ${{ secrets.CHE_OLLAMA_URL }}
      CHE_OLLAMA_TOKEN: ${{ secrets.CHE_OLLAMA_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CHE_PGVECTOR_REST_URL: ${{ secrets.CHE_PGVECTOR_REST_URL }}
      CHE_PGVECTOR_TOKEN: ${{ secrets.CHE_PGVECTOR_TOKEN }}
      CHE_VMWARE_TRAINING_URL: ${{ secrets.CHE_VMWARE_TRAINING_URL }}
      CHE_VMWARE_TRAINING_TOKEN: ${{ secrets.CHE_VMWARE_TRAINING_TOKEN }}
      CHE_HF_TRAINING_URL: ${{ secrets.CHE_HF_TRAINING_URL }}
      CHE_HF_TRAINING_TOKEN: ${{ secrets.CHE_HF_TRAINING_TOKEN }}
      CHE_HF_TTS_URL: ${{ secrets.CHE_HF_TTS_URL }}
      CHE_COMPUTER_URL: ${{ secrets.CHE_COMPUTER_URL }}
      CHE_COMPUTER_TOKEN: ${{ secrets.CHE_COMPUTER_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # "Chay" wake word (Picovoice Porcupine). The phone can also save these
      # itself under CHE controls → Wake word.
      CHE_PICOVOICE_ACCESS_KEY: ${{ secrets.CHE_PICOVOICE_ACCESS_KEY }}
      CHE_PICOVOICE_KEYWORD_PPN_B64: ${{ secrets.CHE_PICOVOICE_KEYWORD_PPN_B64 }}
      CHE_PICOVOICE_SENSITIVITY: ${{ secrets.CHE_PICOVOICE_SENSITIVITY }}
      # Google sign-in for YouTube. Synced only when set, so an unset value
      # never overwrites what is already in Cloudflare.
      CHE_YOUTUBE_CLIENT_ID: ${{ secrets.CHE_YOUTUBE_CLIENT_ID }}
      CHE_YOUTUBE_CLIENT_SECRET: ${{ secrets.CHE_YOUTUBE_CLIENT_SECRET }}
      CHE_OAUTH_SECRET: ${{ secrets.CHE_OAUTH_SECRET }}
      # Optional owner's video renderer; never create, pay for or start one.
      CHE_VIDEO_GEN_URL: ${{ secrets.CHE_VIDEO_GEN_URL }}
      CHE_VIDEO_GEN_TOKEN: ${{ secrets.CHE_VIDEO_GEN_TOKEN }}
      CHE_VIDEO_RENDER_URL: ${{ secrets.CHE_VIDEO_RENDER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: |
          for f in server/cloudflare/*.js; do node --check "$f"; done
          node --test server/cloudflare/*.test.mjs

      - name: Check Cloudflare token
        id: token
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Edit Cloudflare Workers token) to deploy CHE."
            exit 1
          fi

      - name: Check opted-in ElevenLabs credentials without spending credits
        shell: bash
        run: |
          # Fail the deploy if owner-enabled premium speech has no credentials.
          # This only checks presence and format; it does NOT synthesize audio.
          if [[ "${CHE_ELEVENLABS_PREFERRED,,}" =~ ^(1|true|yes)$ ]]; then
            if [[ -z "${ELEVENLABS_API_KEY}" || ! "${CHE_ELEVENLABS_VOICE_ID}" =~ ^[A-Za-z0-9_-]{10,80}$ ]]; then
              echo "::error::Premium voice was enabled, but the ElevenLabs API key or Voice ID is missing."
              exit 1
            fi
            echo "CHE Mary TTS configured. No credits spent during deployment."
          else
            echo "CHE premium voice remains disabled."
          fi

      - name: Make this deploy's voice check token
        run: |
          # A fresh random token for this deploy only, set as a Worker secret
          # below. The voice check after the deploy uses it; the next deploy
          # replaces it, and without it the check route does not exist.
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "CHE_VOICE_PROBE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sync AI engine keys to the Worker
        working-directory: server/cloudflare
        run: |
          node -e '
            const out = {};
            for (const k of ["CHE_YOUTUBE_CLIENT_ID", "CHE_YOUTUBE_CLIENT_SECRET", "CHE_OAUTH_SECRET", "CHE_VIDEO_GEN_URL", "CHE_VIDEO_GEN_TOKEN", "CHE_VIDEO_RENDER_URL", "CHE_GITHUB_TOKEN", "CHE_VOICE_PROBE_TOKEN", "ELEVENLABS_API_KEY", "CHE_ELEVENLABS_VOICE_ID", "CHE_ELEVENLABS_PREFERRED", "FISH_API_KEY", "CHE_FISH_VOICE_ID", "CHE_FISH_MODEL", "CHE_FISH_EXPRESSIVE_MODEL", "CHE_FISH_SPEED", "CHE_FISH_CHARACTER_VOICES", "CHE_FISH_MAX_RTF", "CHE_FISH_EXPRESSIVE_DAILY_CHARS", "CHE_OPENAI_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "CHE_OLLAMA_URL", "CHE_OLLAMA_TOKEN", "XAI_API_KEY", "GROQ_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY", "CEREBRAS_API_KEY", "MISTRAL_API_KEY", "GITHUB_MODELS_TOKEN", "SAMBANOVA_API_KEY", "HF_TOKEN", "CHE_PGVECTOR_REST_URL", "CHE_PGVECTOR_TOKEN", "CHE_VMWARE_TRAINING_URL", "CHE_VMWARE_TRAINING_TOKEN", "CHE_HF_TRAINING_URL", "CHE_HF_TRAINING_TOKEN", "CHE_HF_TTS_URL", "CHE_COMPUTER_URL", "CHE_COMPUTER_TOKEN", "STRIPE_SECRET_KEY", "CHE_PICOVOICE_ACCESS_KEY", "CHE_PICOVOICE_KEYWORD_PPN_B64", "CHE_PICOVOICE_SENSITIVITY"]) {
              if (process.env[k]) out[k] = process.env[k];
            }
            // An absent/cleared GitHub opt-in MUST revoke any previously live
            // Worker setting. Bulk secret sync otherwise leaves the old '1'.
            out.CHE_ELEVENLABS_PREFERRED =
              ["1", "true", "yes"].includes(String(process.env.CHE_ELEVENLABS_PREFERRED || "").toLowerCase())
                ? "1" : "0";
            out.CHE_FISH_PREFERRED =
              ["1", "true", "yes"].includes(String(process.env.CHE_FISH_PREFERRED || "").toLowerCase())
                ? "1" : "0";
            require("fs").writeFileSync("/tmp/che-secrets.json", JSON.stringify(out));
            console.log("Syncing", Object.keys(out).length ? Object.keys(out).join(", ") : "no optional keys");
          '
          if [[ "$(cat /tmp/che-secrets.json)" != "{}" ]]; then
            npx --yes wrangler@4 secret bulk /tmp/che-secrets.json
          fi
          rm -f /tmp/che-secrets.json

      - name: Deploy
        working-directory: server/cloudflare
        # Deploy after secret sync so the final live version retains its SHA tag.
        run: npx --yes wrangler@4 deploy --tag "${GITHUB_SHA::12}" --message "deploy ${GITHUB_SHA::12}"

      - name: Verify live deployed commit
        env:
          EXPECTED_TAG: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const expected = process.env.EXPECTED_TAG.slice(0, 12);
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/health', { signal: AbortSignal.timeout(10000) });
              const health = await response.json();
              if (response.ok && health.ok && health.version_tag === expected) {
                console.log(`Verified live CHE commit ${expected}, version ${health.version_id}`);
                // A notice is readable from the check-run API without the log.
                console.log(`::notice title=Live CHE commit::${expected} is live (Worker version ${health.version_id})`);
                process.exit(0);
              }
            } catch { /* retry propagation or a transient health error */ }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error(`Live CHE did not confirm commit ${expected}`);
          JS

      - name: Verify live SideStore install link
        # SideStore names the app from the IPA URL's last path segment. The live
        # link must end in the real bundle ID, and both download paths must
        # deliver the published bytes. A HEAD or a length check is not enough.
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const base = 'https://chey-app.henryjavoni.workers.dev';
          const bundleId = 'com.cheyapp.chey';
          const read = async (url, timeoutMs = 20000) => {
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                return await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
              } catch { /* retry a transient error */ }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`Could not reach ${url}`);
          };
          const latest = await (await read(`${base}/api/update/latest`)).json();
          if (!latest.ok) {
            console.log('No verified CHE iPhone release is published yet; nothing to check.');
            process.exit(0);
          }
          const installUrl = new URL(new URL(latest.sidestore_install_url).searchParams.get('url'));
          const lastSegment = installUrl.pathname.split('/').pop();
          if (lastSegment !== `${bundleId}.ipa`) throw new Error(`Install link ends in ${lastSegment}, not ${bundleId}.ipa`);
          const source = await (await read(`${base}/api/update/source`)).json();
          if (source.apps?.[0]?.bundleIdentifier !== bundleId) throw new Error('Update source names a different bundle ID');
          const verifyIpa = async (url, label) => {
            const response = await read(url, 240000);
            if (!response.ok) throw new Error(`${label} returned ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length !== Number(latest.size)) throw new Error(`${label} is ${bytes.length} bytes, published ${latest.size}`);
            if (createHash('sha256').update(bytes).digest('hex') !== latest.sha256) throw new Error(`${label} SHA-256 differs from the published release`);
            if (bytes.subarray(0, 4).toString('hex') !== '504b0304') throw new Error(`${label} is not a ZIP archive`);
            console.log(`${label}: verified ${bytes.length} bytes`);
          };
          await verifyIpa(installUrl.href, 'SideStore install download');
          await verifyIpa(`${base}/api/update/download/${encodeURIComponent(latest.id)}/${bundleId}.ipa`, 'Worker relay download');
          console.log(`Verified live install link for ${bundleId} ${latest.version} (${latest.build_number}), ${latest.size} bytes`);
          JS

      - name: Verify live Mary voice settings
        env:
          EXPECTED_TAG: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          // Public probe: booleans and status words only, never a key or a voice ID.
          // It fails when the live Worker cannot see the Mary settings this deploy
          // just synced. Mary is not tested here: no speech is generated, so no
          // ElevenLabs credits are spent.
          const enabled = ['1', 'true', 'yes'].includes(String(process.env.CHE_ELEVENLABS_PREFERRED || '').toLowerCase());
          let probe = null;
          for (let attempt = 0; attempt < 6 && !probe; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/voice/status', { signal: AbortSignal.timeout(10000) });
              const body = await response.json();
              if (response.ok && body.ok) probe = body;
            } catch { /* retry a transient error */ }
            if (!probe) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!probe) throw new Error('Live voice status did not answer');
          console.log(`Live voice settings: ${JSON.stringify({ top_level: probe.top_level, live: probe.live, captured: probe.captured })}`);
          if (!enabled) {
            if (probe.live.preferred) throw new Error('Mary is on in the live Worker, but the owner setting is off.');
            console.log('Mary is off by the owner setting; the free voice is used.');
            process.exit(0);
          }
          if (!probe.top_level.ready || !probe.live.ready) {
            throw new Error(`Mary is enabled, but the live Worker reports not ready (key present: ${probe.live.key_present}, voice ID format ok: ${probe.live.voice_id_format_ok}).`);
          }
          if (!probe.captured.ready) {
            console.log('::notice::The Durable Object had an older env; the live Mary settings were passed in for this request.');
          }
          console.log(`Mary live: ready, last status "${probe.live.status}".`);
          JS

      - name: Verify live Fish voice settings
        run: |
          node --input-type=module <<'JS'
          // Public probe: booleans, model names and status words only. It fails
          // only when Fish is configured here but the live Worker cannot see it.
          const on = ['1', 'true', 'yes'].includes(String(process.env.CHE_FISH_PREFERRED || '').toLowerCase());
          const configured = Boolean(process.env.FISH_API_KEY) && /^[A-Za-z0-9_-]{8,80}$/.test(process.env.CHE_FISH_VOICE_ID || '');
          let probe = null;
          for (let attempt = 0; attempt < 6 && !probe; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/voice/status', { signal: AbortSignal.timeout(10000) });
              const body = await response.json();
              if (response.ok && body.ok && body.fish) probe = body.fish;
            } catch { /* retry a transient error */ }
            if (!probe) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!probe) throw new Error('Live voice status did not report Fish');
          console.log(`Live Fish settings: ${JSON.stringify(probe)}`);
          if (!configured) {
            console.log('::notice::Fish Audio is not set up: add the FISH_API_KEY and CHE_FISH_VOICE_ID secrets. CHE keeps her existing voices.');
            process.exit(0);
          }
          if (on && (!probe.top_level.ready || !probe.live.ready)) {
            throw new Error(`Fish is configured, but the live Worker reports not ready (key present: ${probe.live.key_present}, voice ID format ok: ${probe.live.voice_id_format_ok}).`);
          }
          console.log(on ? `Fish live: ready, everyday ${probe.live.everyday_model}, expressive ${probe.live.expressive_model}.` : 'Fish is switched off by CHE_FISH_PREFERRED.');
          JS

      - name: Check CHE's ElevenLabs voice through the live Worker (one real call)
        run: |
          node --input-type=module <<'JS'
          // One real ElevenLabs call made by the deployed Worker with its live
          // settings, the same code the phone's replies use. It prints
          // ElevenLabs' reason when no audio comes back (key and voice ID
          // removed), keeps the clip for the owner, and prints the recent voice
          // log: what each phone reply got from the Worker and what the phone
          // reported hearing. About 60 characters of ElevenLabs credit.
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const enabled = ['1', 'true', 'yes'].includes(String(process.env.CHE_ELEVENLABS_PREFERRED || '').toLowerCase());
          if (!enabled) {
            console.log('ElevenLabs is off by the owner setting (CHE_ELEVENLABS_PREFERRED); no call made.');
            process.exit(0);
          }
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          let result = null;
          let lastError = '';
          // A 404 or no answer means no call was made yet (the new secret can
          // take a moment to reach every edge); retry those only.
          for (let attempt = 0; attempt < 5 && !result; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/voice/probe', {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` },
                signal: AbortSignal.timeout(30000),
              });
              if (response.ok) result = await response.json();
              else lastError = `HTTP ${response.status}`;
            } catch (error) {
              lastError = error?.name === 'TimeoutError' ? 'no answer within 30 s' : 'network error';
            }
            if (!result) await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          if (!result) {
            console.log(`::error title=ElevenLabs voice check did not run::The live Worker did not answer the voice check (${lastError}).`);
            summary(`**ElevenLabs voice check did not run:** the live Worker did not answer (${lastError}).`);
            process.exit(0);
          }
          const audio = Buffer.from(result.audio_base64 || '', 'base64');
          const validMp3 = audio.length > 3 && ((audio[0] === 0x49 && audio[1] === 0x44 && audio[2] === 0x33) || (audio[0] === 0xff && (audio[1] & 0xe0) === 0xe0));
          const { audio_base64, voice_log: log = [], ...row } = result;
          console.log(`ElevenLabs through the live Worker: ${JSON.stringify({ ...row, valid_mp3: validMp3 })}`);
          console.log(`Recent voice attempts, oldest first (${log.length}):`);
          for (const entry of log) console.log(`  ${JSON.stringify(entry)}`);
          if (result.ok && validMp3) {
            mkdirSync('che-voice-check', { recursive: true });
            writeFileSync('che-voice-check/elevenlabs.mp3', audio);
            console.log(`ElevenLabs spoke: ${audio.length} bytes in ${result.ms} ms (model ${result.model}).`);
            console.log(`::notice title=CHE voice::ElevenLabs spoke through the live Worker: ${audio.length} bytes in ${result.ms} ms`);
            summary(`**ElevenLabs voice works through the live Worker:** ${audio.length} bytes in ${result.ms} ms. The clip is in the \`che-voice-check\` artifact.`);
          } else {
            const why = `${result.status || 'no status'}${result.http ? ` (HTTP ${result.http})` : ''}${result.reason ? `: ${String(result.reason).replace(/[.\s]+$/, '')}` : ''}`;
            console.log(`::error title=ElevenLabs gave no audio::ElevenLabs gave no audio through the live Worker: ${why}. CHE speaks with Fish until this is fixed.`);
            summary(`**ElevenLabs gave no audio through the live Worker:** ${why}. CHE speaks with Fish (backup) until this is fixed.`);
          }
          JS

      - name: Keep the ElevenLabs check clip for the owner
        uses: actions/upload-artifact@v4
        with:
          name: che-voice-check
          path: che-voice-check/*.mp3
          if-no-files-found: ignore
          retention-days: 14

      - name: Check CHE's memory truth through the live Worker (real chat test)
        run: |
          node --input-type=module <<'JS'
          // A real, authenticated chat test of the deployed /api/chat route.
          // It runs against a separate, isolated CHE (never the owner's memory)
          // and asks the owner's exact questions: something he personally
          // confirmed, "How do you know that's correct?", "The last one we
          // were just talking about. What evidence do you have?", a correction,
          // and one real model answer. A memory step that fails fails this job.
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          let report = null;
          let lastError = '';
          for (let attempt = 0; attempt < 5 && !report; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/memory/probe', {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` },
                signal: AbortSignal.timeout(90000),
              });
              if (response.ok) report = await response.json();
              else lastError = `HTTP ${response.status}`;
            } catch (error) {
              lastError = error?.name === 'TimeoutError' ? 'no answer within 90 s' : 'network error';
            }
            if (!report) await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          if (!report) {
            console.log(`::error title=Memory truth check did not run::The live Worker did not answer the memory check (${lastError}).`);
            summary(`**Memory truth check did not run:** the live Worker did not answer (${lastError}).`);
            process.exit(1);
          }
          summary(`**CHE memory truth (live Worker, isolated test CHE):** ${report.passed}/${report.total} steps passed; memory answers used ${report.memory_route_model_calls} model calls; slowest memory answer ${report.slowest_memory_ms} ms.`);
          console.log(`::notice title=Memory truth::${report.passed}/${report.total} steps passed; memory answers used ${report.memory_route_model_calls} model calls; slowest ${report.slowest_memory_ms} ms`);
          summary('');
          summary('| Step | Result | Route | Model calls | ms |');
          summary('|---|---|---|---|---|');
          for (const step of report.steps || []) {
            console.log(`${step.pass ? 'PASS' : 'FAIL'} ${step.name} [${step.route || 'model'} | model_calls=${step.model_calls ?? '?'} | ${step.ms} ms]`);
            console.log(`     ${String(step.reply || '').replace(/\s+/g, ' ')}`);
            summary(`| ${step.name} | ${step.pass ? 'pass' : '**FAIL**'} | ${step.route || 'model'} | ${step.model_calls ?? '?'} | ${step.ms} |`);
          }
          // Only the step the Worker marks optional (a live model's own words)
          // may warn instead of fail; an errored or unrouted memory step fails.
          const failedMemory = (report.steps || []).filter((step) => !step.pass && step.optional !== true);
          const failedModel = (report.steps || []).filter((step) => !step.pass && step.optional === true);
          for (const step of failedModel) console.log(`::warning title=Model answer check::${step.name}: ${String(step.reply).slice(0, 200)}`);
          if (failedMemory.length || (!report.ok && !failedModel.length)) {
            console.log(`::error title=Memory truth check failed::${failedMemory.map((step) => step.name).join('; ') || report.error || 'see log'}`);
            process.exit(1);
          }
          JS

      - name: Check CHE's Command Center through the live Worker
        run: |
          node --input-type=module <<'JS'
          // Live checks on the same isolated test CHE as the memory check (never
          // the owner's): the catalog, an unknown command, a slash command
          // reaching its handler, an approval hold, and a suggestion card. Then
          // which commands the owner's CHE can run now (connector states only).
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          let report = null;
          let lastError = '';
          for (let attempt = 0; attempt < 5 && !report; attempt++) {
            try {
              const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/commands/probe', {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` },
                signal: AbortSignal.timeout(90000),
              });
              if (response.ok) report = await response.json();
              else lastError = `HTTP ${response.status}`;
            } catch (error) {
              lastError = error?.name === 'TimeoutError' ? 'no answer within 90 s' : 'network error';
            }
            if (!report) await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          if (!report) {
            console.log(`::error title=Command Center check did not run::The live Worker did not answer (${lastError}).`);
            process.exit(1);
          }
          for (const step of report.steps || []) {
            console.log(`${step.pass ? 'PASS' : step.optional ? 'WARN' : 'FAIL'} ${step.name} [${step.route || '-'} | model_calls=${step.model_calls ?? '?'} | ${step.ms} ms] ${String(step.reply || '').replace(/\s+/g, ' ').slice(0, 160)}`);
          }
          const r = report.readiness || {};
          const setup = (r.setup_required || []).map((c) => `/${c.id} (${c.missing.join(', ')})`);
          console.log(`::notice title=Command Center::${report.passed}/${report.total} live checks passed; owner CHE: ${r.available ?? '?'} commands ready, ${setup.length} need setup, ${(r.unsupported || []).length} unsupported, ${(r.temporarily_unavailable || []).length} temporarily unavailable`);
          if (setup.length) console.log(`Needs setup: ${setup.join('; ')}`);
          summary(`**Command Center (live Worker):** ${report.passed}/${report.total} live checks passed; ${r.available ?? '?'} commands ready on the owner's CHE; needs setup: ${setup.join('; ') || 'none'}.`);
          for (const step of (report.steps || []).filter((s) => !s.pass && s.optional)) console.log(`::warning title=Command Center check::${step.name}: ${String(step.reply).slice(0, 200)}`);
          if (!report.ok) {
            console.log(`::error title=Command Center check failed::${(report.steps || []).filter((s) => !s.pass && !s.optional).map((s) => s.name).join('; ') || (report.readiness && report.readiness.error) || report.error || 'see log'}`);
            process.exit(1);
          }
          JS

      - name: Render and verify one real video through the live Worker (opt-in)
        if: inputs.video_check
        run: |
          node --input-type=module <<'JS'
          // The live Worker queues a render on the free GitHub renderer with its
          // own token, then checks the finished files itself (MP4 length and
          // codecs, thumbnail size, manifest). Free narration; nothing uploaded.
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          const ask = async (body) => {
            const response = await fetch('https://chey-app.henryjavoni.workers.dev/api/video/probe', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(body), signal: AbortSignal.timeout(60000),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          };
          const started = await ask({});
          console.log(`start: ${JSON.stringify(started)}`);
          if (started.stage !== 'queued' || !started.task_id) {
            console.log(`::error title=Video check: not queued::${started.detail || started.code || 'no task'}`);
            process.exit(1);
          }
          let last = started;
          const until = Date.now() + 20 * 60_000;
          while (Date.now() < until) {
            await new Promise((resolve) => setTimeout(resolve, 20000));
            try { last = await ask({ task_id: started.task_id }); } catch (error) { console.log(`poll: ${error.message}`); continue; }
            console.log(`poll: ${last.stage}${last.run_id ? ` (run ${last.run_id})` : ''}`);
            if (!['queued', 'running', 'checking'].includes(last.stage)) break;
          }
          console.log(`result: ${JSON.stringify(last)}`);
          if (last.stage !== 'complete') {
            console.log(`::error title=Video check: ${last.stage}::${last.detail || 'no verified video'}`);
            process.exit(1);
          }
          const line = `task ${last.task_id}, run ${last.github_run_id}, "${last.title}", ${last.duration_seconds} s, ${last.video_bytes} bytes ${last.video_codec}/${last.audio_codec}, ${last.width}x${last.height}, thumbnail ${last.thumbnail_media_id ? 'saved' : 'missing'}, voice ${last.voice_provider}, paid ${last.paid_media}, uploaded ${last.youtube_uploaded}`;
          console.log(`::notice title=Video check passed::${line}`);
          summary(`**Free video (live Worker):** ${line}.`);
          JS

      - name: Fish measurement key
        id: fishkey
        if: env.FISH_API_KEY != '' && env.CHE_FISH_VOICE_ID != ''
        run: |
          node -e '
            const { createHash } = require("crypto");
            // CHE_FISH_PREFERRED=0 is the owner switch-off: no Fish call at all,
            // not even this measurement.
            if (!["1", "true", "yes"].includes(String(process.env.CHE_FISH_PREFERRED || "").toLowerCase())) {
              console.log("Fish is switched off by CHE_FISH_PREFERRED; no measurement.");
              process.exit(0);
            }
            // Same voice, models and sample text → same measurement, reused
            // from the cache instead of paying for it again on every deploy.
            const key = createHash("sha256").update(JSON.stringify(["v3", process.env.CHE_FISH_VOICE_ID, process.env.CHE_FISH_MODEL || "s2.1-pro-free", process.env.CHE_FISH_EXPRESSIVE_MODEL || "drama-3", process.env.CHE_FISH_SPEED || ""])).digest("hex").slice(0, 24);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `key=che-fish-probe-${key}\n`);
          '

      - name: Reuse an earlier Fish measurement
        if: steps.fishkey.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: che-fish-samples
          key: ${{ steps.fishkey.outputs.key }}

      - name: Measure Fish Audio voice (real call, short and long)
        id: fishmeasure
        if: steps.fishkey.outputs.key != ''
        run: |
          node --input-type=module <<'JS'
          // A real synthesis of one short reply (everyday model) and one longer
          // narration (expressive model), built by the Worker's own request code
          // (MessagePack, like Fish's SDKs). It measures latency and checks the
          // audio, prints Fish's reason for a refusal with the key and voice
          // removed, and never fails the deploy: Fish falls back to CHE's other
          // voices on its own. The clips are kept as a private artifact so the
          // owner can listen to them.
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const lib = (file) => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/server/cloudflare/${file}`).href);
          const { encodeMsgpack } = await lib('msgpack_encode.js');
          const { fishRequestBody, fishRefusalReason } = await lib('fish_audio_voice.js');
          const env = { FISH_API_KEY: process.env.FISH_API_KEY, CHE_FISH_VOICE_ID: process.env.CHE_FISH_VOICE_ID };
          // In the workspace (the artifact upload does not expand "~"), and not
          // a hidden folder (upload-artifact v4 skips those).
          const dir = `${process.env.GITHUB_WORKSPACE}/che-fish-samples`;
          const reportFile = `${dir}/report.json`;
          if (existsSync(reportFile)) {
            console.log(`Fish measurement reused from cache (no new Fish charge): ${readFileSync(reportFile, 'utf8')}`);
            process.exit(0);
          }
          mkdirSync(dir, { recursive: true });
          const call = async ({ model, text, bitrate, expressive, voice = env.CHE_FISH_VOICE_ID, timeoutMs = 90000 }) => {
            const started = Date.now();
            const row = { model, chars: text.length, voice: voice ? 'CHE voice' : 'none' };
            try {
              const body = fishRequestBody({ text, voice, bitrate, expressive });
              if (!voice) delete body.reference_id;
              const response = await fetch('https://api.fish.audio/v1/tts', {
                method: 'POST',
                headers: { Authorization: `Bearer ${env.FISH_API_KEY}`, 'Content-Type': 'application/msgpack', model },
                body: encodeMsgpack(body),
                signal: AbortSignal.timeout(timeoutMs),
              });
              const bytes = new Uint8Array(await response.arrayBuffer());
              row.http = response.status;
              row.ms = Date.now() - started;
              if (response.ok) {
                row.bytes = bytes.length;
                row.valid_mp3 = (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) || (bytes[0] === 0xff && (bytes[1] & 0xe0) === 0xe0);
                row.approx_seconds = Math.round((bytes.length * 8) / (bitrate * 1000) * 10) / 10;
                // Seconds of work per second of audio; below 1 keeps ahead of playback.
                row.rtf = row.approx_seconds > 0 ? Math.round(row.ms / (row.approx_seconds * 1000) * 100) / 100 : null;
                row.audio = bytes;
              } else {
                row.reason = fishRefusalReason(new TextDecoder().decode(bytes), env);
              }
            } catch (error) {
              row.ms = Date.now() - started;
              row.reason = error?.name === 'TimeoutError' ? 'timed out' : 'network error';
            }
            return row;
          };
          const show = ({ audio, ...row }) => JSON.stringify(row);
          const everyday = process.env.CHE_FISH_MODEL || 's2.1-pro-free';
          const expressive = process.env.CHE_FISH_EXPRESSIVE_MODEL || 'drama-3';
          const samples = [
            { name: 'conversation', model: everyday, bitrate: 64, expressive: false,
              text: "Morning, sir. Chay here. Your ten o'clock moved to Thursday, and I've already let everyone know." },
            { name: 'narration', model: expressive, bitrate: 128, expressive: true,
              text: 'Three hundred miles off the coast, the lighthouse keeper heard a knock at the door. Nobody had visited the island in eleven years. She set down her tea, picked up the lantern, and listened. The knock came again, slower this time, as if whoever stood outside had all the time in the world.' },
          ];
          const report = [];
          for (const sample of samples) {
            const row = await call(sample);
            if (row.valid_mp3) writeFileSync(`${dir}/${sample.name}.mp3`, row.audio);
            report.push({ name: sample.name, ...JSON.parse(show(row)) });
            console.log(`Fish ${sample.name}: ${show(row)}`);
            if (!row.valid_mp3) console.log(`::warning::Fish ${sample.name} (${sample.model}) gave no playable audio: HTTP ${row.http ?? '-'} ${row.reason || 'not an MP3'}. CHE keeps her other voices for this.`);
          }
          if (report.every((row) => row.valid_mp3)) {
            writeFileSync(reportFile, JSON.stringify(report));
            writeFileSync(process.env.GITHUB_OUTPUT, 'save=1\n', { flag: 'a' });
            process.exit(0);
          }
          // Something was refused. A few short calls show which part: the model
          // name, the voice ID, or the request itself. About 16 characters each.
          // Only when Fish answered at all: an unreachable Fish is not diagnosed
          // here, and each check is bounded so the deploy job keeps its time.
          if (!report.some((row) => Number.isInteger(row.http))) {
            console.log('Fish did not answer; no further checks this deploy.');
            process.exit(0);
          }
          const probe = "Hello, I'm Chay.";
          const variants = [
            { model: everyday }, { model: 's2-pro' }, { model: 's1' }, { model: 's1', voice: '' },
            { model: expressive }, { model: 'drama-3-preview' },
          ].filter((v, i, all) => all.findIndex((o) => o.model === v.model && o.voice === v.voice) === i);
          for (const variant of variants) {
            const row = await call({ text: probe, bitrate: 64, expressive: false, timeoutMs: 15000, ...variant });
            console.log(`Fish check ${variant.model}${variant.voice === '' ? ' without the CHE voice' : ''}: ${show(row)}`);
            if (!Number.isInteger(row.http)) break;
          }
          JS

      - name: Save the Fish measurement
        if: steps.fishmeasure.outputs.save == '1'
        uses: actions/cache/save@v4
        with:
          path: che-fish-samples
          key: ${{ steps.fishkey.outputs.key }}

      - name: Keep the Fish sample clips for the owner
        if: steps.fishkey.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: che-fish-voice-samples
          path: che-fish-samples/*.mp3
          if-no-files-found: ignore
          retention-days: 14
