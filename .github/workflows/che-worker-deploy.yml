name: Deploy CHE Worker

# Deploys server/cloudflare to Cloudflare Workers.
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard -> My Profile -> API Tokens -> "Edit Cloudflare
# Workers" template). Then run this workflow from the Actions tab, or just
# merge to main: changes under server/cloudflare deploy automatically.

# Cloudflare Workers Builds remains available, but this workflow is the
# deterministic production fallback for every relevant main-branch change.
# A server/cloudflare push must never be silently skipped after green CI.
on:
  workflow_dispatch:
    inputs:
      video_check:
        description: Also render one real 15-second video through the free GitHub renderer and verify it
        type: boolean
        default: false
      creation_check:
        description: Also run the Creation Engine end to end on the live Worker (Generate, CHE starts the free cloud worker, Blender builds a full-body GLB, CHE's viewport opens it)
        type: boolean
        default: false
      character_accept:
        description: Also run the character acceptance test on the live Worker (three styles, a synthetic reference face, hair/clothing/height/build edits, reopen) and publish the outputs to the che-character-samples branch
        type: boolean
        default: false
      rea_check:
        description: Also run the REA acceptance investigations (public repository, web page, CHE comparison, private iOS app) on the live Worker
        type: boolean
        default: false
      rea_repo:
        description: Public GitHub repository (owner/name) for the REA repository test
        type: string
        default: vercel/commerce
      rea_feature:
        description: The repository feature whose source the REA test must cite
        type: string
        default: search
      rea_site:
        description: Public web page for the REA website test
        type: string
        default: https://www.python.org/
      rea_build_feature:
        description: Owner-authorized REA build test only. A feature id from the comparison (for example f3); CHE opens a draft pull request and never merges it. Empty = no build.
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - "server/cloudflare/**"
      - ".github/workflows/che-worker-deploy.yml"
      - ".github/scripts/che_live_probes.mjs"

permissions:
  contents: read

concurrency:
  group: che-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The push path filter already limits automatic runs to Worker/deploy
    # changes. Do not add a commit-message gate here: follow-up fixes can merge
    # without a marker and must still deploy the exact green main commit.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.character_accept && 100 || (inputs.creation_check || contains(github.event.head_commit.message, '[creation-check]')) && 75 || (inputs.video_check || inputs.rea_check) && 30 || 15 }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
      # The Worker every live check probes. Production by default; the staging
      # gate can point the same checks at chey-app-staging.
      CHE_LIVE_BASE: https://chey-app.henryjavoni.workers.dev
      # Lets CHE open owner-approved branches/PRs from the phone. The token
      # stays in GitHub Actions/Cloudflare secrets and never reaches Flutter.
      CHE_GITHUB_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN }}
      # Optional free AI engines CHE falls back to when Cloudflare's daily
      # allowance runs out. Add any of these as repository secrets.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CHE_ELEVENLABS_VOICE_ID: ${{ secrets.CHE_ELEVENLABS_VOICE_ID }}
      # Owner-authorized 2026-10-11: Mary is preferred for CHE's requested
      # speech only. Set the Actions secret CHE_ELEVENLABS_PREFERRED=0 to
      # immediately disable on the next deployment; revoke the capped
      # ElevenLabs API key for immediate provider-side shutdown.
      # A repository variable CHE_ELEVENLABS_PREFERRED=0 is also supported.
      CHE_ELEVENLABS_PREFERRED: ${{ secrets.CHE_ELEVENLABS_PREFERRED || vars.CHE_ELEVENLABS_PREFERRED || '1' }}
      # CHE's own voice (Fish Audio). Owner-requested 2026-10-14. Fish speaks
      # only when FISH_API_KEY and CHE_FISH_VOICE_ID are both set; the existing
      # voices stay as the fallback. Set CHE_FISH_PREFERRED=0 (secret or
      # variable) to switch Fish off on the next deploy. Model names are plain
      # settings: a repository variable overrides the defaults in the Worker
      # (s2.1-pro-free for everyday speech, drama-3 for stories and narration).
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      CHE_FISH_VOICE_ID: ${{ secrets.CHE_FISH_VOICE_ID || vars.CHE_FISH_VOICE_ID }}
      CHE_FISH_PREFERRED: ${{ secrets.CHE_FISH_PREFERRED || vars.CHE_FISH_PREFERRED || '1' }}
      CHE_FISH_MODEL: ${{ vars.CHE_FISH_MODEL || secrets.CHE_FISH_MODEL }}
      CHE_FISH_EXPRESSIVE_MODEL: ${{ vars.CHE_FISH_EXPRESSIVE_MODEL || secrets.CHE_FISH_EXPRESSIVE_MODEL }}
      CHE_FISH_SPEED: ${{ vars.CHE_FISH_SPEED || secrets.CHE_FISH_SPEED }}
      CHE_FISH_CHARACTER_VOICES: ${{ secrets.CHE_FISH_CHARACTER_VOICES || vars.CHE_FISH_CHARACTER_VOICES }}
      CHE_FISH_MAX_RTF: ${{ vars.CHE_FISH_MAX_RTF || secrets.CHE_FISH_MAX_RTF }}
      CHE_FISH_EXPRESSIVE_DAILY_CHARS: ${{ vars.CHE_FISH_EXPRESSIVE_DAILY_CHARS || secrets.CHE_FISH_EXPRESSIVE_DAILY_CHARS }}
      CHE_OPENAI_API_KEY: ${{ secrets.CHE_OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHE_OLLAMA_URL: ${{ secrets.CHE_OLLAMA_URL }}
      CHE_OLLAMA_TOKEN: ${{ secrets.CHE_OLLAMA_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CHE_PGVECTOR_REST_URL: ${{ secrets.CHE_PGVECTOR_REST_URL }}
      CHE_PGVECTOR_TOKEN: ${{ secrets.CHE_PGVECTOR_TOKEN }}
      CHE_VMWARE_TRAINING_URL: ${{ secrets.CHE_VMWARE_TRAINING_URL }}
      CHE_VMWARE_TRAINING_TOKEN: ${{ secrets.CHE_VMWARE_TRAINING_TOKEN }}
      CHE_HF_TRAINING_URL: ${{ secrets.CHE_HF_TRAINING_URL }}
      CHE_HF_TRAINING_TOKEN: ${{ secrets.CHE_HF_TRAINING_TOKEN }}
      CHE_HF_TTS_URL: ${{ secrets.CHE_HF_TTS_URL }}
      CHE_COMPUTER_URL: ${{ secrets.CHE_COMPUTER_URL }}
      CHE_COMPUTER_TOKEN: ${{ secrets.CHE_COMPUTER_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # "Chay" wake word (Picovoice Porcupine). The phone can also save these
      # itself under CHE controls → Wake word.
      CHE_PICOVOICE_ACCESS_KEY: ${{ secrets.CHE_PICOVOICE_ACCESS_KEY }}
      CHE_PICOVOICE_KEYWORD_PPN_B64: ${{ secrets.CHE_PICOVOICE_KEYWORD_PPN_B64 }}
      CHE_PICOVOICE_SENSITIVITY: ${{ secrets.CHE_PICOVOICE_SENSITIVITY }}
      # Google sign-in for YouTube. Synced only when set, so an unset value
      # never overwrites what is already in Cloudflare.
      CHE_YOUTUBE_CLIENT_ID: ${{ secrets.CHE_YOUTUBE_CLIENT_ID }}
      CHE_YOUTUBE_CLIENT_SECRET: ${{ secrets.CHE_YOUTUBE_CLIENT_SECRET }}
      CHE_OAUTH_SECRET: ${{ secrets.CHE_OAUTH_SECRET }}
      # NinjaTrader (Tradovate) OAuth app. Register CHE's callback first; the app
      # reports "need setup" until these two secrets reach the Worker.
      CHE_TRADOVATE_OAUTH_CLIENT_ID: ${{ secrets.CHE_TRADOVATE_OAUTH_CLIENT_ID }}
      CHE_TRADOVATE_OAUTH_CLIENT_SECRET: ${{ secrets.CHE_TRADOVATE_OAUTH_CLIENT_SECRET }}
      # Optional owner's video renderer; never create, pay for or start one.
      CHE_VIDEO_GEN_URL: ${{ secrets.CHE_VIDEO_GEN_URL }}
      CHE_VIDEO_GEN_TOKEN: ${{ secrets.CHE_VIDEO_GEN_TOKEN }}
      CHE_VIDEO_RENDER_URL: ${{ secrets.CHE_VIDEO_RENDER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: |
          for f in server/cloudflare/*.js; do node --check "$f"; done
          node --test server/cloudflare/*.test.mjs

      - name: Check Cloudflare token
        id: token
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Edit Cloudflare Workers token) to deploy CHE."
            exit 1
          fi

      - name: Check opted-in ElevenLabs credentials without spending credits
        shell: bash
        run: |
          # Fail the deploy if owner-enabled premium speech has no credentials.
          # This only checks presence and format; it does NOT synthesize audio.
          if [[ "${CHE_ELEVENLABS_PREFERRED,,}" =~ ^(1|true|yes)$ ]]; then
            if [[ -z "${ELEVENLABS_API_KEY}" || ! "${CHE_ELEVENLABS_VOICE_ID}" =~ ^[A-Za-z0-9_-]{10,80}$ ]]; then
              echo "::error::Premium voice was enabled, but the ElevenLabs API key or Voice ID is missing."
              exit 1
            fi
            echo "CHE Mary TTS configured. No credits spent during deployment."
          else
            echo "CHE premium voice remains disabled."
          fi

      - name: Make this deploy's voice check token
        run: |
          # A fresh random token for this deploy only, set as a Worker secret
          # below. The voice check after the deploy uses it; the next deploy
          # replaces it, and without it the check route does not exist.
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "CHE_VOICE_PROBE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sync AI engine keys to the Worker
        working-directory: server/cloudflare
        run: |
          node -e '
            const out = {};
            for (const k of ["CHE_YOUTUBE_CLIENT_ID", "CHE_YOUTUBE_CLIENT_SECRET", "CHE_OAUTH_SECRET", "CHE_TRADOVATE_OAUTH_CLIENT_ID", "CHE_TRADOVATE_OAUTH_CLIENT_SECRET", "CHE_VIDEO_GEN_URL", "CHE_VIDEO_GEN_TOKEN", "CHE_VIDEO_RENDER_URL", "CHE_GITHUB_TOKEN", "CHE_VOICE_PROBE_TOKEN", "ELEVENLABS_API_KEY", "CHE_ELEVENLABS_VOICE_ID", "CHE_ELEVENLABS_PREFERRED", "FISH_API_KEY", "CHE_FISH_VOICE_ID", "CHE_FISH_MODEL", "CHE_FISH_EXPRESSIVE_MODEL", "CHE_FISH_SPEED", "CHE_FISH_CHARACTER_VOICES", "CHE_FISH_MAX_RTF", "CHE_FISH_EXPRESSIVE_DAILY_CHARS", "CHE_OPENAI_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "CHE_OLLAMA_URL", "CHE_OLLAMA_TOKEN", "XAI_API_KEY", "GROQ_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY", "CEREBRAS_API_KEY", "MISTRAL_API_KEY", "GITHUB_MODELS_TOKEN", "SAMBANOVA_API_KEY", "HF_TOKEN", "CHE_PGVECTOR_REST_URL", "CHE_PGVECTOR_TOKEN", "CHE_VMWARE_TRAINING_URL", "CHE_VMWARE_TRAINING_TOKEN", "CHE_HF_TRAINING_URL", "CHE_HF_TRAINING_TOKEN", "CHE_HF_TTS_URL", "CHE_COMPUTER_URL", "CHE_COMPUTER_TOKEN", "STRIPE_SECRET_KEY", "CHE_PICOVOICE_ACCESS_KEY", "CHE_PICOVOICE_KEYWORD_PPN_B64", "CHE_PICOVOICE_SENSITIVITY"]) {
              if (process.env[k]) out[k] = process.env[k];
            }
            // An absent/cleared GitHub opt-in MUST revoke any previously live
            // Worker setting. Bulk secret sync otherwise leaves the old '1'.
            out.CHE_ELEVENLABS_PREFERRED =
              ["1", "true", "yes"].includes(String(process.env.CHE_ELEVENLABS_PREFERRED || "").toLowerCase())
                ? "1" : "0";
            out.CHE_FISH_PREFERRED =
              ["1", "true", "yes"].includes(String(process.env.CHE_FISH_PREFERRED || "").toLowerCase())
                ? "1" : "0";
            require("fs").writeFileSync("/tmp/che-secrets.json", JSON.stringify(out));
            console.log("Syncing", Object.keys(out).length ? Object.keys(out).join(", ") : "no optional keys");
          '
          if [[ "$(cat /tmp/che-secrets.json)" != "{}" ]]; then
            npx --yes wrangler@4 secret bulk /tmp/che-secrets.json
          fi
          rm -f /tmp/che-secrets.json

      - name: Deploy
        working-directory: server/cloudflare
        # Deploy after secret sync so the final live version retains its SHA tag.
        run: npx --yes wrangler@4 deploy --tag "${GITHUB_SHA::12}" --message "deploy ${GITHUB_SHA::12}" --var "CHE_POOL_COMMIT:${GITHUB_SHA}"

      # Every live probe below is one function in .github/scripts/che_live_probes.mjs. The pre-merge
      # gate (che-worker-staging.yml, job "live (staging)") runs the same file against chey-app-staging,
      # so production and staging run identical probes. Change a probe there, never here.
      - name: Verify live deployed commit
        env:
          EXPECTED_TAG: ${{ github.sha }}
        run: node .github/scripts/che_live_probes.mjs health

      - name: Report which AI engines the live Worker can use (no keys printed)
        run: node .github/scripts/che_live_probes.mjs engines

      - name: Verify live SideStore install link
        # SideStore names the app from the IPA URL's last path segment. The live
        # link must end in the real bundle ID, and both download paths must
        # deliver the published bytes. A HEAD or a length check is not enough.
        run: node .github/scripts/che_live_probes.mjs sidestore

      - name: Verify live Mary voice settings
        run: node .github/scripts/che_live_probes.mjs mary-settings

      - name: Verify live Fish voice settings
        run: node .github/scripts/che_live_probes.mjs fish-settings

      - name: Check CHE's ElevenLabs voice through the live Worker (one real call)
        run: node .github/scripts/che_live_probes.mjs voice

      - name: Keep the ElevenLabs check clip for the owner
        uses: actions/upload-artifact@v4
        with:
          name: che-voice-check
          path: che-voice-check/*.mp3
          if-no-files-found: ignore
          retention-days: 14

      - name: Check CHE's forward paper trading on the live Worker
        run: node .github/scripts/che_live_probes.mjs trading

      - name: Audit CHE's stored trade records on the live Worker (read only)
        run: node .github/scripts/che_live_probes.mjs trading-audit

      - name: Check CHE's memory truth through the live Worker (real chat test)
        run: node .github/scripts/che_live_probes.mjs memory

      - name: Creation Engine end to end on the live Worker (Generate, free cloud worker, Blender, GLB)
        if: (inputs.creation_check || contains(github.event.head_commit.message, '[creation-check]'))
        timeout-minutes: 55
        run: node .github/scripts/che_live_probes.mjs creation

      - name: Open the generated GLB in CHE's Live Studio viewport
        if: (inputs.creation_check || contains(github.event.head_commit.message, '[creation-check]'))
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          out=$(node tools/creation_open_in_studio.mjs che-creation-check/model.glb che-creation-check/studio.png walk) && ok=1 || ok=0
          echo "$out"
          echo "$out" > che-creation-check/studio.json
          msg=$(node -e 'const o=JSON.parse(process.argv[1]);const m=o.model||{};console.log(`studio.html loaded ${m.meshes} meshes, ${m.vertices} vertices, clips ${(m.clips||[]).join("/")}; walk: ${o.animate?.note||"no answer"}${o.errors.length?`; errors: ${o.errors.join(" | ")}`:""}`)' "$out")
          if [ "$ok" = 1 ]; then echo "::notice title=Creation Engine viewport::$msg"; else echo "::error title=Creation Engine viewport::$msg"; exit 1; fi

      - name: Keep the Creation Engine check files
        if: always() && (inputs.creation_check || contains(github.event.head_commit.message, '[creation-check]'))
        uses: actions/upload-artifact@v4
        with:
          name: che-creation-check
          path: che-creation-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Character acceptance on the live Worker (three styles, reference face, edits, reopen)
        if: inputs.character_accept
        timeout-minutes: 80
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          set +e
          mkdir -p che-character-accept
          node tools/creation_accept.mjs che-character-accept --minutes 75 | tee che-character-accept/run.log
          code=${PIPESTATUS[0]}
          # Each saved GLB opened in CHE's own Live Studio viewport with its walk playing (the app's viewer page).
          for glb in che-character-accept/*.glb; do
            [ -e "$glb" ] || continue
            node tools/creation_open_in_studio.mjs "$glb" "${glb%.glb}__studio.png" walk > "${glb%.glb}__studio.json" || code=1
          done
          node -e 'const s=require("./che-character-accept/summary.json");for(const c of s.checks){console.log(`${c.ok?"PASS":"FAIL"} ${c.name}: ${c.detail}`)}' | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit $code

      - name: Keep the character acceptance files
        if: always() && inputs.character_accept
        uses: actions/upload-artifact@v4
        with:
          name: che-character-accept
          path: che-character-accept/
          if-no-files-found: ignore
          retention-days: 30

      - name: Check CHE's Command Center through the live Worker
        run: node .github/scripts/che_live_probes.mjs commands

      - name: Check CHE's Modal GPU connection through the live Worker (authenticated /health, no GPU)
        run: |
          node --input-type=module <<'JS'
          // The same authenticated GET /health as Flagstaff's Check Connection, run by the live Worker with its own
          // MODAL_TOKEN. One short CPU call on Modal; no GPU starts. The reply holds a category, a check ID, the host,
          // the app version and the GPU name, never a token. Informational: Modal is optional, so this never fails
          // the deploy; a failure is a warning with its category and check ID.
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          let r = null; let err = '';
          for (let attempt = 0; attempt < 3 && !r; attempt++) {
            try {
              const response = await fetch(`${process.env.CHE_LIVE_BASE}/api/probe/modal`, { method: 'POST', headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` }, signal: AbortSignal.timeout(60000) });
              if (response.ok) r = await response.json(); else err = `HTTP ${response.status}`;
            } catch (error) { err = error?.name === 'TimeoutError' ? 'no answer within 60 s' : 'network error'; }
            if (!r) await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          if (!r) { console.log(`::warning title=Modal check did not run::The live Worker did not answer (${err}).`); process.exit(0); }
          const line = `at ${r.at}, check ID ${r.request_id}, HTTP ${r.http_status ?? '-'}, category ${r.category}, credential ${r.credential || '-'}, host ${r.host || '-'}${r.ok ? `, app ${r.version}, GPU ${r.gpu}` : ''}${r.upstream_id ? `, Modal call ${r.upstream_id}` : ''}`;
          console.log(r.ok ? `::notice title=Modal connected::${line}` : `::warning title=Modal not connected::${line}`);
          summary(`**Modal (live Worker, authenticated /health):** ${r.ok ? 'connected' : 'NOT connected'}: ${line}.`);
          JS

      - name: Ask CHE why her coding agent failed through the live Worker
        run: |
          node --input-type=module <<'JS'
          // Reliability Test 2, live: the isolated test CHE (never the owner's) is asked the question she
          // failed, and a run id with no record, through the real /api/chat. The answer must come from the
          // runner's records on che-mailbox (route che_coding_audit, 0 model calls), never claim a missing
          // telemetry, plugin or connection, and say plainly that ocr-00000000 has no record.
          // Probe logic: server/cloudflare/coding_audit.js codingAuditProbe.
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          const MISSING = /telemetry|plug-?ins?\b|audit[- ]?logs?\b|\bconnectors?\b|\bauthori[sz]ed\s+(?:\w+\s+){0,3}(?:connection|integration)\b/i;
          let report = null;
          let lastError = '';
          for (let attempt = 0; attempt < 5 && !report; attempt++) {
            try {
              const response = await fetch(`${process.env.CHE_LIVE_BASE}/api/coding-audit/probe`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` },
                signal: AbortSignal.timeout(90000),
              });
              if (response.ok) report = await response.json();
              else lastError = `HTTP ${response.status}`;
            } catch (error) {
              lastError = error?.name === 'TimeoutError' ? 'no answer within 90 s' : 'network error';
            }
            if (!report) await new Promise((resolve) => setTimeout(resolve, 4000));
          }
          if (!report) {
            console.log(`::error title=Coding audit check did not run::The live Worker did not answer (${lastError}).`);
            process.exit(1);
          }
          let bad = report.ok !== true || !(report.steps || []).length;
          for (const step of report.steps || []) {
            // Checked here too, so the step fails even if the Worker's own check were wrong.
            const pass = step.pass && step.route === 'che_coding_audit' && step.model_calls === 0 && !MISSING.test(step.reply || '');
            if (!pass) bad = true;
            console.log(`${pass ? 'PASS' : 'FAIL'} ${step.name} [route=${step.route || '-'} | model_calls=${step.model_calls ?? '?'} | outcome=${step.outcome || '-'} | ${step.ms} ms]`);
            console.log(`  reply: ${String(step.reply || '').replace(/\s+/g, ' ')}`);
          }
          summary(`**Coding audit (live Worker, isolated test CHE):** ${report.passed ?? 0}/${report.total ?? 0} checks passed.`);
          if (bad) {
            console.log(`::error title=Coding audit check failed::${(report.steps || []).filter((s) => !s.pass).map((s) => s.name).join('; ') || report.error || 'see log'}`);
            process.exit(1);
          }
          JS

      - name: Check CHE's conversation history and past mistakes through the live Worker
        run: node .github/scripts/che_live_probes.mjs history

      - name: Check CHE's Knowledge Atlas through the live Worker
        run: node .github/scripts/che_live_probes.mjs atlas

      - name: Audit the owner's stored projects (counts only)
        continue-on-error: true
        run: node .github/scripts/che_live_probes.mjs projects-audit

      - name: Render and verify one real video through the live Worker (opt-in)
        if: inputs.video_check
        run: node .github/scripts/che_live_probes.mjs video

      - name: Run the REA acceptance investigations through the live Worker (opt-in)
        if: inputs.rea_check
        env:
          REA_REPO: ${{ inputs.rea_repo }}
          REA_FEATURE: ${{ inputs.rea_feature }}
          REA_SITE: ${{ inputs.rea_site }}
          REA_BUILD_FEATURE: ${{ inputs.rea_build_feature }}
        run: node .github/scripts/che_live_probes.mjs rea

      - name: Fish measurement key
        id: fishkey
        if: env.FISH_API_KEY != '' && env.CHE_FISH_VOICE_ID != ''
        run: |
          node -e '
            const { createHash } = require("crypto");
            // CHE_FISH_PREFERRED=0 is the owner switch-off: no Fish call at all,
            // not even this measurement.
            if (!["1", "true", "yes"].includes(String(process.env.CHE_FISH_PREFERRED || "").toLowerCase())) {
              console.log("Fish is switched off by CHE_FISH_PREFERRED; no measurement.");
              process.exit(0);
            }
            // Same voice, models and sample text → same measurement, reused
            // from the cache instead of paying for it again on every deploy.
            const key = createHash("sha256").update(JSON.stringify(["v3", process.env.CHE_FISH_VOICE_ID, process.env.CHE_FISH_MODEL || "s2.1-pro-free", process.env.CHE_FISH_EXPRESSIVE_MODEL || "drama-3", process.env.CHE_FISH_SPEED || ""])).digest("hex").slice(0, 24);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `key=che-fish-probe-${key}\n`);
          '

      - name: Reuse an earlier Fish measurement
        if: steps.fishkey.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: che-fish-samples
          key: ${{ steps.fishkey.outputs.key }}

      - name: Measure Fish Audio voice (real call, short and long)
        id: fishmeasure
        if: steps.fishkey.outputs.key != ''
        run: |
          node --input-type=module <<'JS'
          // A real synthesis of one short reply (everyday model) and one longer
          // narration (expressive model), built by the Worker's own request code
          // (MessagePack, like Fish's SDKs). It measures latency and checks the
          // audio, prints Fish's reason for a refusal with the key and voice
          // removed, and never fails the deploy: Fish falls back to CHE's other
          // voices on its own. The clips are kept as a private artifact so the
          // owner can listen to them.
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const lib = (file) => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/server/cloudflare/${file}`).href);
          const { encodeMsgpack } = await lib('msgpack_encode.js');
          const { fishRequestBody, fishRefusalReason } = await lib('fish_audio_voice.js');
          const env = { FISH_API_KEY: process.env.FISH_API_KEY, CHE_FISH_VOICE_ID: process.env.CHE_FISH_VOICE_ID };
          // In the workspace (the artifact upload does not expand "~"), and not
          // a hidden folder (upload-artifact v4 skips those).
          const dir = `${process.env.GITHUB_WORKSPACE}/che-fish-samples`;
          const reportFile = `${dir}/report.json`;
          if (existsSync(reportFile)) {
            console.log(`Fish measurement reused from cache (no new Fish charge): ${readFileSync(reportFile, 'utf8')}`);
            process.exit(0);
          }
          mkdirSync(dir, { recursive: true });
          const call = async ({ model, text, bitrate, expressive, voice = env.CHE_FISH_VOICE_ID, timeoutMs = 90000 }) => {
            const started = Date.now();
            const row = { model, chars: text.length, voice: voice ? 'CHE voice' : 'none' };
            try {
              const body = fishRequestBody({ text, voice, bitrate, expressive });
              if (!voice) delete body.reference_id;
              const response = await fetch('https://api.fish.audio/v1/tts', {
                method: 'POST',
                headers: { Authorization: `Bearer ${env.FISH_API_KEY}`, 'Content-Type': 'application/msgpack', model },
                body: encodeMsgpack(body),
                signal: AbortSignal.timeout(timeoutMs),
              });
              const bytes = new Uint8Array(await response.arrayBuffer());
              row.http = response.status;
              row.ms = Date.now() - started;
              if (response.ok) {
                row.bytes = bytes.length;
                row.valid_mp3 = (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) || (bytes[0] === 0xff && (bytes[1] & 0xe0) === 0xe0);
                row.approx_seconds = Math.round((bytes.length * 8) / (bitrate * 1000) * 10) / 10;
                // Seconds of work per second of audio; below 1 keeps ahead of playback.
                row.rtf = row.approx_seconds > 0 ? Math.round(row.ms / (row.approx_seconds * 1000) * 100) / 100 : null;
                row.audio = bytes;
              } else {
                row.reason = fishRefusalReason(new TextDecoder().decode(bytes), env);
              }
            } catch (error) {
              row.ms = Date.now() - started;
              row.reason = error?.name === 'TimeoutError' ? 'timed out' : 'network error';
            }
            return row;
          };
          const show = ({ audio, ...row }) => JSON.stringify(row);
          const everyday = process.env.CHE_FISH_MODEL || 's2.1-pro-free';
          const expressive = process.env.CHE_FISH_EXPRESSIVE_MODEL || 'drama-3';
          const samples = [
            { name: 'conversation', model: everyday, bitrate: 64, expressive: false,
              text: "Morning, sir. Chay here. Your ten o'clock moved to Thursday, and I've already let everyone know." },
            { name: 'narration', model: expressive, bitrate: 128, expressive: true,
              text: 'Three hundred miles off the coast, the lighthouse keeper heard a knock at the door. Nobody had visited the island in eleven years. She set down her tea, picked up the lantern, and listened. The knock came again, slower this time, as if whoever stood outside had all the time in the world.' },
          ];
          const report = [];
          for (const sample of samples) {
            const row = await call(sample);
            if (row.valid_mp3) writeFileSync(`${dir}/${sample.name}.mp3`, row.audio);
            report.push({ name: sample.name, ...JSON.parse(show(row)) });
            console.log(`Fish ${sample.name}: ${show(row)}`);
            if (!row.valid_mp3) console.log(`::warning::Fish ${sample.name} (${sample.model}) gave no playable audio: HTTP ${row.http ?? '-'} ${row.reason || 'not an MP3'}. CHE keeps her other voices for this.`);
          }
          if (report.every((row) => row.valid_mp3)) {
            writeFileSync(reportFile, JSON.stringify(report));
            writeFileSync(process.env.GITHUB_OUTPUT, 'save=1\n', { flag: 'a' });
            process.exit(0);
          }
          // Something was refused. A few short calls show which part: the model
          // name, the voice ID, or the request itself. About 16 characters each.
          // Only when Fish answered at all: an unreachable Fish is not diagnosed
          // here, and each check is bounded so the deploy job keeps its time.
          if (!report.some((row) => Number.isInteger(row.http))) {
            console.log('Fish did not answer; no further checks this deploy.');
            process.exit(0);
          }
          const probe = "Hello, I'm Chay.";
          const variants = [
            { model: everyday }, { model: 's2-pro' }, { model: 's1' }, { model: 's1', voice: '' },
            { model: expressive }, { model: 'drama-3-preview' },
          ].filter((v, i, all) => all.findIndex((o) => o.model === v.model && o.voice === v.voice) === i);
          for (const variant of variants) {
            const row = await call({ text: probe, bitrate: 64, expressive: false, timeoutMs: 15000, ...variant });
            console.log(`Fish check ${variant.model}${variant.voice === '' ? ' without the CHE voice' : ''}: ${show(row)}`);
            if (!Number.isInteger(row.http)) break;
          }
          JS

      - name: Save the Fish measurement
        if: steps.fishmeasure.outputs.save == '1'
        uses: actions/cache/save@v4
        with:
          path: che-fish-samples
          key: ${{ steps.fishkey.outputs.key }}

      - name: Keep the Fish sample clips for the owner
        if: steps.fishkey.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: che-fish-voice-samples
          path: che-fish-samples/*.mp3
          if-no-files-found: ignore
          retention-days: 14

  # The owner reads acceptance samples from git (Actions artifacts are not reachable from every client): this job has
  # write access only to push the files to the che-character-samples branch, never to main or any other branch.
  publish-character-samples:
    needs: deploy
    if: always() && inputs.character_accept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: che-character-accept
          path: accept
      - name: Push the samples to che-character-samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q samples && cd samples
          git config user.name "github-actions[bot]"; git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin che-character-samples; then git checkout -q -B che-character-samples FETCH_HEAD; else git checkout -q --orphan che-character-samples; fi
          dir="runs/${GITHUB_RUN_ID}"; mkdir -p "$dir"; cp -r ../accept/. "$dir/"
          echo "${GITHUB_RUN_ID} ${GITHUB_SHA} $(date -u +%FT%TZ)" >> runs/index.txt
          git add -A && git commit -qm "Character acceptance samples, run ${GITHUB_RUN_ID} (${GITHUB_SHA::12})" && git push -q origin HEAD:che-character-samples
          echo "::notice title=Character samples::branch che-character-samples, folder $dir"
