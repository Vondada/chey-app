name: CHE strategy backtest

# Backtests every written intraday strategy on the same real (public, delayed) bars and posts the comparison
# in the job summary. Informational: it never gates a merge, never trades and never changes stored records.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/cloudflare/trading_evidence.js
      - server/cloudflare/trading_research.js
      - tools/che_strategy_backtest.mjs
      - tools/che_quality_replay.mjs
      - tools/che_volatility_replay.mjs
      - server/cloudflare/strategy_governor.js
      - server/cloudflare/crypto_markets.js

permissions:
  contents: read

jobs:
  backtest:
    name: Strategy backtest (real bars, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      matrix:
        market: [MNQ, NQ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/che_strategy_backtest.mjs --market "${{ matrix.market }}" --tf 5m --json "backtest-${{ matrix.market }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.market }}
          path: backtest-${{ matrix.market }}.json

  quality-replay:
    # Before/after replay of the forward paper desks with the trade-quality rules (MNQ, BTC, ETH), on the same real bars.
    name: Trade-quality replay (real bars, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/che_quality_replay.mjs --json quality-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-replay
          path: quality-replay.json

  volatility-replay:
    name: Volatility-stop replay (real bars, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/che_volatility_replay.mjs
