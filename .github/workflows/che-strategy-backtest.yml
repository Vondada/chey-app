name: CHE strategy backtest

# Backtests every written intraday strategy on the same real (public, delayed) bars and posts the comparison
# in the job summary. Informational: it never gates a merge, never trades and never changes stored records.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/cloudflare/trading_evidence.js
      - server/cloudflare/trading_research.js
      - tools/che_strategy_backtest.mjs

permissions:
  contents: read

jobs:
  backtest:
    name: Strategy backtest (real bars, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      matrix:
        market: [MNQ, NQ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/che_strategy_backtest.mjs --market "${{ matrix.market }}" --tf 5m --json "backtest-${{ matrix.market }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.market }}
          path: backtest-${{ matrix.market }}.json
