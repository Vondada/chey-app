name: Check CHE Flutter client

on:
  push:
    branches: [main, che/realtime-conversation-rebuild, che-core-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
      - name: flutter analyze
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > analyze.txt 2>&1
          code=$?
          # Surface each issue as a GitHub annotation so the exact file/line is
          # readable from the PR (and by CHE/autopilot) without raw log access.
          grep -E '^(ERROR|WARNING|INFO)\|' analyze.txt | while IFS='|' read -r sev type rule file line col len msg; do
            lvl=error; [ "$sev" = INFO ] && lvl=notice; [ "$sev" = WARNING ] && lvl=warning
            echo "::$lvl file=${file#"$PWD/"},line=$line,col=$col,title=$rule::$msg"
          done
          cat analyze.txt
          exit $code
      - name: flutter test
        run: |
          set +e
          # Command Center end-to-end: CHE's real Worker code on a local port
          # (offline, in-memory, fake model) for test/che_command_center_e2e_test.dart.
          node tool/command_center_e2e_server.mjs --out "$RUNNER_TEMP/che_e2e.json" > "$RUNNER_TEMP/che_e2e.log" 2>&1 &
          e2e_pid=$!
          for i in $(seq 1 100); do [ -s "$RUNNER_TEMP/che_e2e.json" ] && break; sleep 0.2; done
          export CHE_E2E_URL="$(node -p "require(process.argv[1]).url" "$RUNNER_TEMP/che_e2e.json" 2>/dev/null)"
          export CHE_E2E_TOKEN="$(node -p "require(process.argv[1]).token" "$RUNNER_TEMP/che_e2e.json" 2>/dev/null)"
          export CHE_E2E_REQUIRED=1
          flutter test --reporter json > test-results.jsonl
          code=$?
          kill "$e2e_pid" 2>/dev/null
          [ "$code" = 0 ] || tail -20 "$RUNNER_TEMP/che_e2e.log"
          node -e '
            const lines=require("fs").readFileSync("test-results.jsonl","utf8").split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
            const names={},errs={},logs={};
            for(const e of lines){ if(e.type==="testStart") names[e.test.id]=e.test.name+" ("+(e.test.url||e.test.root_url||"").split("/").pop()+")";
              if(e.type==="print") (logs[e.testID]??=[]).push(String(e.message));
              if(e.type==="error") (errs[e.testID]??=[]).push(String(e.error).slice(0,300)); }
            for(const [id,m] of Object.entries(errs)) console.log("::error title="+(names[id]||id).replace(/[\n:,]/g," ").slice(0,200)+"::"+((logs[id]||[]).join("\n").match(/EXCEPTION CAUGHT[\s\S]{0,900}/)||[m.join(" | ")])[0].replace(/%/g,"%25").replace(/\r?\n/g,"%0A"));
          '
          exit $code
      - name: iPhone version-ordering regression tests
        run: python3 -m unittest discover -s tool -p 'test_mobile_version.py'
      - name: iPhone audio session regression tests
        run: python3 -m unittest discover -s tool -p 'test_ios_audio_session.py'

  worker-unit:
    name: Worker syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: for f in server/cloudflare/*.js; do node --check "$f" || exit 1; done
      - name: Run Worker unit tests
        run: node --test server/cloudflare/*.test.mjs
      - name: Video narration tests (Fish Drama 3, cache, Piper fallback)
        run: python3 -m unittest discover -s tools -p 'test_che_video_render.py'
      - name: Claude Code project skills (.claude/skills) tests
        run: node --test .claude/skills/tests/*.test.mjs

