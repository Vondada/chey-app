name: Check CHE Flutter client
# The Cloud Computer (server/cloudflare/cloud_computer.js TESTS_RUN_TITLE_PREFIX) finds the run its own dispatch
# created by this title. Without che_dispatch_id (push, pull_request, a manual run) the expression is empty, so
# GitHub keeps its usual title. An expression in run-name is display text only: it never reaches a shell.
run-name: ${{ inputs.che_dispatch_id && format('CHE cloud tests {0}', inputs.che_dispatch_id) || '' }}

on:
  push:
    branches: [main, che/realtime-conversation-rebuild, che-core-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      che_dispatch_id:
        description: Correlation id the Cloud Computer sets so it can find this run (optional)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
      - name: flutter analyze
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > analyze.txt 2>&1
          code=$?
          # Surface each issue as a GitHub annotation so the exact file/line is
          # readable from the PR (and by CHE/autopilot) without raw log access.
          grep -E '^(ERROR|WARNING|INFO)\|' analyze.txt | while IFS='|' read -r sev type rule file line col len msg; do
            lvl=error; [ "$sev" = INFO ] && lvl=notice; [ "$sev" = WARNING ] && lvl=warning
            echo "::$lvl file=${file#"$PWD/"},line=$line,col=$col,title=$rule::$msg"
          done
          cat analyze.txt
          exit $code
      - name: flutter test
        run: |
          set +e
          # Command Center end-to-end: CHE's real Worker code on a local port
          # (offline, in-memory, fake model) for test/che_command_center_e2e_test.dart.
          node tool/command_center_e2e_server.mjs --out "$RUNNER_TEMP/che_e2e.json" > "$RUNNER_TEMP/che_e2e.log" 2>&1 &
          e2e_pid=$!
          for i in $(seq 1 100); do [ -s "$RUNNER_TEMP/che_e2e.json" ] && break; sleep 0.2; done
          export CHE_E2E_URL="$(node -p "require(process.argv[1]).url" "$RUNNER_TEMP/che_e2e.json" 2>/dev/null)"
          export CHE_E2E_TOKEN="$(node -p "require(process.argv[1]).token" "$RUNNER_TEMP/che_e2e.json" 2>/dev/null)"
          export CHE_E2E_REQUIRED=1
          flutter test --reporter json > test-results.jsonl
          code=$?
          kill "$e2e_pid" 2>/dev/null
          [ "$code" = 0 ] || tail -20 "$RUNNER_TEMP/che_e2e.log"
          node -e '
            const lines=require("fs").readFileSync("test-results.jsonl","utf8").split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
            const names={},errs={},logs={};
            for(const e of lines){ if(e.type==="testStart") names[e.test.id]=e.test.name+" ("+(e.test.url||e.test.root_url||"").split("/").pop()+")";
              if(e.type==="print") (logs[e.testID]??=[]).push(String(e.message));
              if(e.type==="error") (errs[e.testID]??=[]).push(String(e.error).slice(0,300)); }
            for(const [id,m] of Object.entries(errs)) console.log("::error title="+(names[id]||id).replace(/[\n:,]/g," ").slice(0,200)+"::"+((logs[id]||[]).join("\n").match(/EXCEPTION CAUGHT[\s\S]{0,900}/)||[m.join(" | ")])[0].replace(/%/g,"%25").replace(/\r?\n/g,"%0A"));
          '
          exit $code
      - name: iPhone version-ordering regression tests
        run: python3 -m unittest discover -s tool -p 'test_mobile_version.py'
      - name: iPhone audio session regression tests
        run: python3 -m unittest discover -s tool -p 'test_ios_audio_session.py'
      - name: Validate bundled offline 3D characters
        run: node --test tools/character_pipeline/assets.test.mjs

  visual-studio-renders:
    # Own job so a slow ffmpeg install never eats the Worker job's budget.
    name: Visual Studio renders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg (man-db trigger off; it stalls apt on hosted runners)
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # A static build from GitHub releases (one ~100 MB download); apt mirrors have taken over 10 minutes.
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            if curl -fsSL --retry 3 --max-time 240 "$url" -o /tmp/ffmpeg.tar.xz && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
              sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
            else
              echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null || true
              sudo rm -f /var/lib/man-db/auto-update
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ffmpeg
            fi
          fi
          ffmpeg -hide_banner -version | head -1
          python3 -m pip install --quiet pillow
      - name: Visual Studio renders (real ffmpeg; verified MP4 and PNG)
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 -m unittest discover -s tools -p 'test_che_edit_render.py' -v
  worker-unit:
    name: Worker syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: for f in server/cloudflare/*.js server/cloudflare/security_core/*.js; do node --check "$f" || exit 1; done
      - name: Run Worker unit tests
        run: node --test server/cloudflare/*.test.mjs
      # The unit run above skips the website observer's browser tests; this installs the
      # pinned Playwright and its headless Chromium and runs them against the local fixture page.
      - name: REA website observer in a real browser (local fixture, no internet)
        env:
          CHE_REA_WEB_E2E: required
        run: |
          npm ci --prefix tools/rea/web --ignore-scripts --no-audit --no-fund
          node tools/rea/web/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
          node --test server/cloudflare/rea_web_workflow.test.mjs
      - name: Video narration tests (Fish Drama 3, cache, Piper fallback)
        run: python3 -m unittest discover -s tools -p 'test_che_video_render.py'
      - name: Creation Engine render profiles, benchmark measures and Roblox R15 rules
        run: |
          python3 -c "import numpy" 2>/dev/null || python3 -m pip install --quiet numpy
          python3 -m unittest discover -s tools -p 'test_creation_benchmark.py'
          python3 -m unittest discover -s tools -p 'test_roblox_rig.py'
          python3 -m unittest discover -s tools -p 'test_creation_params.py'
          python3 -m unittest discover -s tools -p 'test_cc0_textures.py'
          # The creation worker's own scripts (job runner, worker loop, receipts, GLB verifier) had no CI step.
          python3 -m unittest discover -s tools -p 'test_che_creation_job.py'
          python3 -m unittest discover -s tools -p 'test_che_gpu_worker.py'
          python3 -m unittest discover -s tools -p 'test_che_gpu_face_preview.py'
          python3 -m unittest discover -s tools -p 'test_che_gpu_push_results.py'
          # CHE's Modal app: allowlisted arguments, idempotency and pins (no Modal SDK needed).
          python3 -m unittest discover -s tools -p 'test_che_modal_app.py'
          python3 -m unittest discover -s tools -p 'test_avatar_body_verify.py'
          # Reference photo fit on synthetic fixtures (mediapipe Apache-2.0; the model is pinned by SHA-256 in photo_fit.py),
          # the person job's reference stage, GLB measurements and body macros.
          sudo apt-get -qq install -y libegl1 libgles2 > /dev/null   # mediapipe's native library links libEGL
          python3 -m pip install --quiet mediapipe==1.1.1 pillow
          python3 -m unittest discover -s tools -p 'test_photo_fit.py' -v
          python3 -m unittest discover -s tools -p 'test_photo_reference_job.py'
          python3 -m unittest discover -s tools -p 'test_worker_reference.py'
          python3 -m unittest discover -s tools -p 'test_glb_inspect.py'
          python3 -m unittest discover -s tools -p 'test_body_macros.py'
          python3 -m unittest discover -s tools -p 'test_character_style.py'
      - name: Claude Code project skills (.claude/skills) tests
        run: node --test .claude/skills/tests/*.test.mjs
      - name: CHE free-first coding and paid cap regression tests
        run: node --test tools/che_coding_paid_gate.test.mjs tools/che_coding_workflow_policy.test.mjs
      - name: CHE coding failover, checkpoint and resume tests
        run: node --test tools/che_coding_checkpoint.test.mjs tools/che_coding_failover_loop.test.mjs
      # A network policy defined only in YAML text is not enough: prove on the real Linux
      # runner that egress.sh blocks the observer user from loopback and link-local addresses
      # while the runner's own traffic still works (rules matching only that user).
      - name: REA observer kernel egress guard (user-scoped)
        run: |
          set -euo pipefail
          bash tools/rea/web/egress.sh rea-observer
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          server=$!
          sleep 1
          curl -sf -m 5 http://127.0.0.1:8765/ >/dev/null || { echo "the runner itself lost loopback"; exit 1; }
          if sudo -u rea-observer curl -s -m 5 http://127.0.0.1:8765/ >/dev/null; then echo "the observer reached loopback"; exit 1; fi
          if sudo -u rea-observer curl -s -m 5 http://169.254.169.254/ >/dev/null; then echo "the observer reached the metadata address"; exit 1; fi
          kill "$server"
          echo "observer user: loopback and link-local refused; runner unaffected"

