name: Check CHE Flutter client

on:
  push:
    branches: [main, che/realtime-conversation-rebuild, che-core-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
      - run: flutter analyze
      - run: flutter test
      - run: for f in server/cloudflare/*.js; do node --check "$f"; done
      - run: node --test server/cloudflare/*.test.mjs

