name: CHE Chat render (temporary)

# Temporary, for the Chat cleanup PR only: renders the real Chat tab at the owner's iPhone size and prints the PNG as
# base64 so it can be inspected from a machine without Flutter. The test file is written here, not committed.
# Removed before merge.
on:
  push:
    branches: [claude/che-chat-cleanup]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
      - name: render Chat
        run: |
          set +e
          mkdir -p test/render
          cat > test/render/chat_render_test.dart <<'DART'
          import 'dart:io';
          import 'package:chey/che_ui/che_phone_shell.dart';
          import 'package:chey/main.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          Future<void> font(String family, String path) async {
            final f = File(path);
            if (!f.existsSync()) return;
            await (FontLoader(family)..addFont(Future.value(ByteData.view(f.readAsBytesSync().buffer)))).load();
          }

          void main() {
            testWidgets('render Chat', (tester) async {
              final dir = '${Platform.environment['FLUTTER_ROOT']}/bin/cache/artifacts/material_fonts';
              await font('Roboto', '$dir/Roboto-Regular.ttf');
              await font('Roboto', '$dir/Roboto-Bold.ttf');
              await font('MaterialIcons', '$dir/MaterialIcons-Regular.otf');
              tester.view.physicalSize = const Size(1320, 2868);
              tester.view.devicePixelRatio = 3;
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const CHEApp());
              for (var i = 0; i < 15; i++) { await tester.pump(const Duration(milliseconds: 200)); }
              await tester.tap(find.descendant(of: find.byType(ChePhoneBottomNav), matching: find.text('Chat')));
              for (var i = 0; i < 5; i++) { await tester.pump(const Duration(milliseconds: 200)); }
              await expectLater(find.byType(MaterialApp).first, matchesGoldenFile('chat_render.png'));
              await tester.pumpWidget(const SizedBox());
              await tester.pump(const Duration(seconds: 1));
            });
          }
          DART
          sed -i 's/^          //' test/render/chat_render_test.dart
          flutter test --update-goldens test/render/chat_render_test.dart
          echo "exit $?"
      - name: print render
        run: |
          f=test/render/chat_render.png
          [ -f "$f" ] || { echo "no render"; exit 0; }
          echo "GOLDEN-BEGIN $f $(sha256sum "$f" | cut -c1-64)"
          base64 -w 3000 "$f"
          echo "GOLDEN-END $f"
