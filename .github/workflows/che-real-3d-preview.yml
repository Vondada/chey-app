name: CHE Real 3D Character Preview
on:
  workflow_dispatch:
    inputs:
      character:
        description: Existing CHE crew character
        required: true
        type: choice
        options: [che, atlas, knox, lyra, mira, nova, sage, iris]
        default: che
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and ffmpeg
        timeout-minutes: 7
        run: |
          set -euo pipefail
          timeout 360s sudo apt-get update -qq
          timeout 180s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender ffmpeg
          # Ubuntu's Blender package uses the system Python; its glTF importer needs numpy.
          timeout 120s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy
          /usr/bin/python3 -c 'import numpy; print("System NumPy", numpy.__version__)'
          blender --version | head -2
          # Blender may use an isolated Python search path. Probe Blender itself, not only /usr/bin/python3.
          if ! blender -b --python-exit-code 1 --python-use-system-env --python-expr 'import numpy; print("BLENDER_NUMPY_OK", numpy.__version__)'; then
            echo 'Blender cannot import distro NumPy; retrying with the distro package directory.'
            echo "PYTHONPATH=/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
            PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" blender -b --python-exit-code 1 --python-use-system-env --python-expr 'import numpy; print("BLENDER_NUMPY_OK", numpy.__version__)'
          fi
      - name: Verify the existing character is a real 3D asset
        run: |
          set -euo pipefail
          test -s "assets/characters/crew/${{ inputs.character }}.glb"
          python3 - <<'PY'
          import json, pathlib, struct
          p=pathlib.Path('assets/characters/crew/${{ inputs.character }}.glb')
          with p.open('rb') as f:
              header=f.read(12)
          magic,version,length=struct.unpack('<4sII',header)
          assert magic==b'glTF' and version==2 and length==p.stat().st_size
          print('CHE_CHARACTER_GLB_VERIFIED',p.name,length)
          PY
      - name: Render actual GLB frames
        timeout-minutes: 10
        run: |
          set -euo pipefail
          blender -b -t 2 --python-use-system-env --python tools/che_character_video_preview.py -- --model "assets/characters/crew/${{ inputs.character }}.glb" --out rendered --frames 36
          test "$(find rendered -name 'frame_*.png' | wc -l)" -eq 36
      - name: Encode and independently probe MP4
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -i rendered/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart rendered/video.mp4
          cp rendered/frame_0012.png rendered/thumbnail.png
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json rendered/video.mp4 | tee rendered/probe.json
          test -s rendered/video.mp4
          test -s rendered/thumbnail.png
          python3 - <<'PY'
          import json
          d=json.load(open('rendered/probe.json'))
          v=next(s for s in d['streams'] if s.get('codec_name')=='h264')
          assert v['width']==360 and v['height']==640
          assert float(d['format']['duration'])>=2.9
          print('CHE_REAL_3D_VIDEO_VERIFIED', d['format']['duration'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: che-real-3d-${{ inputs.character }}-${{ github.run_id }}
          path: |
            rendered/video.mp4
            rendered/thumbnail.png
            rendered/scene_manifest.json
            rendered/probe.json
            assets/characters/crew/${{ inputs.character }}.glb
          if-no-files-found: error
          retention-days: 30
