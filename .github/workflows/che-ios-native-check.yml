name: CHE iOS native build check

# Compiles the generated iPhone project (the Swift AppDelegate written by
# tool/bootstrap.sh and tool/patch_local_runtime.py) for the simulator, with no
# signing and nothing published, whenever that native code changes. Without
# it a Swift error would surface only after merge, in the IPA and Shorebird
# builds. It also prints which app lifecycle the generated project uses.

on:
  pull_request:
    branches: [main]
    paths:
      - "tool/bootstrap.sh"
      - "tool/patch_local_runtime.py"
      - ".github/workflows/che-ios-native-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap native projects
        run: bash ./tool/bootstrap.sh

      - name: Enable local AI + voice tuning bridge
        run: python3 ./tool/patch_local_runtime.py

      - name: Show the iPhone app lifecycle
        run: |
          flutter --version
          ls ios/Runner/*.swift
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' ios/Runner/Info.plist >/dev/null 2>&1; then
            echo "Info.plist uses the UIScene lifecycle: window is nil in didFinishLaunching, so CHE's channels must come from the plugin registrar."
          else
            echo "Info.plist uses the app delegate lifecycle."
          fi
          grep -n 'registrar(forPlugin: "CHENativeBridge")' ios/Runner/AppDelegate.swift

      - name: Compile for the simulator (no signing)
        run: flutter build ios --simulator --debug
