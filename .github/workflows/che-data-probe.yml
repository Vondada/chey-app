name: CHE historical data source probe

# Run by hand. Checks which free historical market-data sources a GitHub runner can
# reach and downloads a small sample from each reachable one, so the data work starts
# from verified access. Read-only; nothing is stored in the repo or in CHE.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe each source and sample real candles
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          python3 -m pip install --quiet yfinance
          python3 - <<'PY'
          import json, os, urllib.request, time
          out = os.path.join(os.environ["RUNNER_TEMP"], "data")
          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "CHE-data-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  return None, str(e)[:200]
          sources = {
              "kraken_ohlc_btc_1m": "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1",
              "coinbase_candles_btc_1m": "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60",
              "binance_vision_btc_1m_month": "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2026-09.zip",
              "binance_api_btc_1m": "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=5",
          }
          for name, url in sources.items():
              status, body = get(url)
              size = len(body) if isinstance(body, bytes) else 0
              print(f"{name}: HTTP {status}, {size} bytes" if status else f"{name}: error {body}")
              if status == 200 and isinstance(body, bytes):
                  open(os.path.join(out, name + ".sample"), "wb").write(body[:200000])
          try:
              import yfinance as yf
              for sym, interval, period in [("NQ=F", "1m", "7d"), ("NQ=F", "5m", "60d"), ("ES=F", "5m", "60d"), ("BTC-USD", "5m", "60d")]:
                  df = yf.download(sym, interval=interval, period=period, progress=False, auto_adjust=False)
                  print(f"yfinance {sym} {interval} {period}: {len(df)} rows" + (f", {df.index.min()} to {df.index.max()}" if len(df) else ""))
                  if len(df):
                      df.to_csv(os.path.join(out, f"yf_{sym.replace('=','').replace('-','')}_{interval}.csv"))
          except Exception as e:
              print("yfinance error:", str(e)[:200])
          PY
          ls -la "$RUNNER_TEMP/data"

      - name: Keep the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: che-data-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/data
          if-no-files-found: warn
          retention-days: 14
