name: Wake CHE for Flagstaff mail

on:
  push:
    branches:
      - che-mailbox

permissions:
  contents: read

concurrency:
  group: flagstaff-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read mailbox commit
        uses: actions/checkout@v4
        with:
          ref: che-mailbox
          fetch-depth: 2

      - name: Find new peer messages
        id: message
        shell: bash
        run: |
          set -euo pipefail
          # Every peer message this push added (not only the last line), so a
          # batch of questions is answered in one run. CHE's own replies are skipped.
          ids="$(git show -U0 --format= "$GITHUB_SHA" -- 'mailbox/*.jsonl' | grep '^+{' | sed 's/^+//' | python3 -c '
          import json, sys
          ids = []
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except ValueError:
                  continue
              if str(message.get("from", "")).lower() != "che" and message.get("id"):
                  ids.append(str(message["id"]))
          print(json.dumps(ids))
          ')"
          if [ "$ids" = "[]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "message_ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Wake CHE
        if: steps.message.outputs.skip != 'true'
        env:
          MESSAGE_IDS: ${{ steps.message.outputs.message_ids }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          ids = json.loads(os.environ["MESSAGE_IDS"])
          # message_id is kept for a Worker that predates message_ids.
          print(json.dumps({
              "head_sha": os.environ["HEAD_SHA"],
              "message_id": ids[0],
              "message_ids": ids,
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 1 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$body" \
            https://chey-app.henryjavoni.workers.dev/api/flagstaff/wake
