# Deploys CHE's Modal app (tools/modal/che_modal_app.py) and connects CHE's Worker to it, with no token handled by a
# person. Manual only. Needs the repository Actions secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (a Modal API token)
# and the existing CLOUDFLARE_API_TOKEN. GitHub Actions cannot read Cloudflare Worker secrets (Cloudflare never returns
# a secret's value once stored), so the Modal API token must also be saved here.
#
# The steps live in tools/modal/connect_modal.sh, which the regression test tools/test_connect_modal.py runs end to end
# with stubs. A missing secret, a failed deploy or a failed check fails this job and says why; "connected" is printed
# only after the Worker secret is written. With gpu_test, it also calls the deployed function gpu_check once: one
# 256x256 Cycles render of the default cube on a T4, about a minute of GPU time inside Modal's included credit.
# Nothing else starts a GPU. No secret is printed. Spec: docs/CHE_MODAL_FREE_FIRST_USAGE_PRIVACY.md
name: CHE Modal deploy

on:
  workflow_dispatch:
    inputs:
      che_base:
        description: The CHE Worker URL GPU calls may work for (allowlist)
        type: string
        default: https://chey-app.henryjavoni.workers.dev
      gpu_test:
        description: After deploying, run one short GPU test render (about a minute of T4 time, inside the included credit)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: che-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
      CHE_ALLOWED_BASES: ${{ inputs.che_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the app logic and the connect script (no Modal needed)
        run: python3 -m unittest discover -s tools -p 'test_*modal*.py'
      - name: Install the Modal CLI
        run: python3 -m pip install --quiet 'modal>=1.0,<2'
      - name: Deploy, verify and connect the Worker
        run: bash tools/modal/connect_modal.sh
      - name: GPU test (one short Cycles render on the T4)
        if: inputs.gpu_test
        run: |
          python3 - <<'PY' | tee /tmp/gpu.json
          import json, time, modal
          f = modal.Function.from_name("che-gpu", "gpu_check")
          t = time.time()
          r = f.remote()
          r["wall_seconds"] = round(time.time() - t, 1)
          print(json.dumps(r))
          PY
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/gpu.json"))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("### GPU test\n```\n" + json.dumps(r, indent=1) + "\n```\n")
          assert r.get("ok"), "the GPU test did not render on a GPU"
          PY
