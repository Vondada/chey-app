name: CHE iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-build]')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CHE_AGENT_URL: ${{ secrets.CHE_AGENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple's on-device model (FoundationModels) needs the iOS 26 SDK.
      # Without it the keyless on-device fallback compiles out.
      - name: Use newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap native projects
        run: bash ./tool/bootstrap.sh

      - name: Enable local AI + voice tuning bridge
        run: python3 ./tool/patch_local_runtime.py

      - name: Flutter analyze
        run: flutter analyze

      - name: Preinstall CocoaPods dependencies
        working-directory: ios
        run: |
          pod repo update
          pod install --repo-update --verbose

      # A Shorebird release is what lets CHE upgrade herself later: Dart-only
      # changes then arrive as patches, with no new IPA. Without Shorebird set
      # up, this falls back to a plain build that can never receive patches.
      - name: Check Shorebird is configured
        id: shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [[ -n "${SHOREBIRD_TOKEN}" && -f shorebird.yaml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Shorebird is not set up (need shorebird.yaml and the SHOREBIRD_TOKEN secret). This IPA CANNOT receive CHE self-updates; every change will need another IPA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Shorebird
        if: steps.shorebird.outputs.ready == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      - name: Build unsigned iPhone app (Shorebird release, patchable)
        if: steps.shorebird.outputs.ready == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          build_number="$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))"
          build_name="$(python3 tool/mobile_version.py)"
          echo "Shorebird iOS version: $build_name, build: $build_number"
          shorebird release ios --no-codesign --build-name="$build_name" -- \
            --build-number="$build_number" \
            --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-https://chey-app.henryjavoni.workers.dev}"

      - name: Build unsigned iPhone app (plain, not patchable)
        if: steps.shorebird.outputs.ready != 'true'
        run: |
          build_number="$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))"
          build_name="$(python3 tool/mobile_version.py)"
          flutter build ios --release --no-codesign \
            --build-name="$build_name" --build-number="$build_number" \
            --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-https://chey-app.henryjavoni.workers.dev}"

      - name: Package unsigned IPA
        run: |
          set -eu
          app="build/ios/iphoneos/Runner.app"
          if [[ "${{ steps.shorebird.outputs.ready }}" == "true" ]]; then
            app="$(find build/ios/archive -maxdepth 5 -type d -path '*Products/Applications/Runner.app' | head -1)"
          fi
          test -d "$app" || { echo "::error::Runner.app not found"; exit 1; }
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$app" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry CHE-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload CHE IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shorebird.outputs.ready == 'true' && 'CHE-unsigned-ipa-self-updating' || 'CHE-unsigned-ipa-NOT-self-updating' }}
          path: build/ios/ipa/CHE-unsigned.ipa
          retention-days: 7
