name: CHE OpenCode coding runtime

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Stable CHE coding-session id
        required: true
        type: string
      request_b64:
        description: UTF-8 owner request encoded as base64
        required: true
        type: string
      base_sha:
        description: Exact repository commit CHE inspected
        required: true
        type: string
      target_branch:
        description: Review branch the orchestrator will reconcile into
        required: true
        type: string
      model:
        description: OpenCode model in provider/model form
        required: true
        type: string

# The coding process itself only receives read access. A separate publisher job
# gets contents:write solely to place compact status JSON on che-mailbox.
permissions:
  contents: read

concurrency:
  group: che-opencode-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decode and guard task
        id: guard
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const fail = (kind, message) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `failure=${kind}\n`);
            console.error(`::error::${message}`);
            process.exit(2);
          };
          const jobId = String(process.env.JOB_ID || '').trim();
          const baseSha = String(process.env.BASE_SHA || '').trim().toLowerCase();
          const targetBranch = String(process.env.TARGET_BRANCH || '').trim();
          const model = String(process.env.MODEL || '').trim();
          if (!/^ocr-[0-9a-f]{8}$/.test(jobId)) fail('invalid_job_id', 'CHE runtime job id failed validation.');
          if (!/^[0-9a-f]{40}$/.test(baseSha)) fail('invalid_base_sha', 'CHE runtime base SHA must be the exact 40-character commit id.');
          if (!targetBranch || targetBranch.length > 160 || targetBranch.includes('..') || targetBranch.startsWith('/') || targetBranch.endsWith('/') || !/^[A-Za-z0-9._\/-]+$/.test(targetBranch)) fail('invalid_target_branch', 'CHE runtime target branch failed validation.');
          if (model !== 'auto' && !/^[A-Za-z0-9._-]+\/[A-Za-z0-9._:@\/-]+$/.test(model)) fail('invalid_model', 'CHE runtime model must be provider/model.');
          const checkedOut = cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
          if (checkedOut !== baseSha) fail('stale_base_sha', 'CHE runtime refused stale source: main changed after inspection.');
          const encoded = String(process.env.REQUEST_B64 || '');
          let request = '';
          try { request = Buffer.from(encoded, 'base64').toString('utf8').trim(); } catch (_) { fail('invalid_request_encoding', 'CHE runtime request is not valid base64.'); }
          if (request.length < 8 || request.length > 16000) fail('invalid_request_length', 'CHE runtime request failed length validation.');
          const secretLike = [
            /BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY/i,
            /(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}/,
            /(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}/,
            /sk-[A-Za-z0-9_-]{20,}/,
            /AIza[0-9A-Za-z_-]{20,}/,
            /xai-[A-Za-z0-9]{20,}/,
          ];
          if (secretLike.some((re) => re.test(request))) fail('secret_like_request', 'CHE runtime request looks like it contains a secret; refusing to send it to OpenCode.');
          const preamble = [
            'You are a coding worker inside CHE. Work only in this isolated checkout.',
            'Inspect real source before editing. Make the smallest complete change that satisfies the owner request.',
            'Do not push, open or merge pull requests, deploy, alter workflows, signing files, secrets, dependency manifests, or production credentials.',
            'Leave any source edits only in the working tree. Do not print secrets. If no safe change is needed, leave the tree unchanged.',
            '',
            'OWNER REQUEST:',
            request,
          ].join('\n');
          fs.writeFileSync('/tmp/che-runtime-prompt.txt', preamble, { mode: 0o600 });
          // Defense in depth: deny outbound helper tools and git push inside the
          // coding agent. This is not treated as a sandbox; the hosted runner is
          // still the isolation boundary and receives no writable Git credential.
          fs.writeFileSync('/tmp/che-opencode-config.json', JSON.stringify({
            $schema: 'https://opencode.ai/config.json',
            permission: {
              webfetch: 'deny',
              bash: {
                '*': 'allow',
                'git push*': 'deny',
                'gh *': 'deny',
                'curl *': 'deny',
                'wget *': 'deny',
              },
            },
          }), { mode: 0o600 });
          NODE

      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.18.34
      - name: Build code context (graphify code map, opensrc)
        if: hashFiles('.github/actions/che-code-context/action.yml') != ''
        uses: ./.github/actions/che-code-context
        continue-on-error: true
      - name: Resolve model
        id: model
        shell: bash
        env:
          REQUESTED: ${{ inputs.model }}
          HAS_GOOGLE: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_MISTRAL: ${{ secrets.MISTRAL_API_KEY != '' }}
          HAS_CEREBRAS: ${{ secrets.CEREBRAS_API_KEY != '' }}
        run: |
          # "auto": first provider with a configured key, strongest coding
          # model OpenCode lists for it. Only that provider's key is exposed.
          model="$REQUESTED"
          if [ "$model" = auto ]; then
            model=""
            for p in google:HAS_GOOGLE anthropic:HAS_ANTHROPIC openai:HAS_OPENAI openrouter:HAS_OPENROUTER groq:HAS_GROQ mistral:HAS_MISTRAL cerebras:HAS_CEREBRAS; do
              prov=${p%%:*}; flag=${p##*:}
              [ "${!flag}" = true ] || continue
              list=$(opencode models "$prov" 2>/dev/null | grep -E "^$prov/" | grep -viE "tts|image|audio|embed|vision|guard|lite|nano|mini|8b" || true)
              cand=$(echo "$list" | grep -iE "pro|sonnet|opus|gpt-5|coder|qwen3|large|70b" | sort -rV | head -1 || true)
              [ -n "$cand" ] || cand=$(echo "$list" | head -1)
              if [ -n "$cand" ]; then model="$cand"; break; fi
            done
          fi
          if [ -z "$model" ]; then echo "::error::No AI provider key is configured for the OpenCode runner."; exit 1; fi
          echo "Using model $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode in the isolated checkout
        id: opencode
        shell: bash
        env:
          OPENCODE_CONFIG: /tmp/che-opencode-config.json
          OPENCODE_MODEL: ${{ steps.model.outputs.model }}
          # Expose only the credential for the selected provider, not every key
          # configured in the repository.
          OPENAI_API_KEY: ${{ startsWith(steps.model.outputs.model, 'openai/') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ startsWith(steps.model.outputs.model, 'anthropic/') && secrets.ANTHROPIC_API_KEY || '' }}
          GROQ_API_KEY: ${{ startsWith(steps.model.outputs.model, 'groq/') && secrets.GROQ_API_KEY || '' }}
          GEMINI_API_KEY: ${{ (startsWith(steps.model.outputs.model, 'google/') || startsWith(steps.model.outputs.model, 'gemini/')) && secrets.GEMINI_API_KEY || '' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ (startsWith(steps.model.outputs.model, 'google/') || startsWith(steps.model.outputs.model, 'gemini/')) && secrets.GEMINI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ startsWith(steps.model.outputs.model, 'openrouter/') && secrets.OPENROUTER_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ startsWith(steps.model.outputs.model, 'cerebras/') && secrets.CEREBRAS_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ startsWith(steps.model.outputs.model, 'mistral/') && secrets.MISTRAL_API_KEY || '' }}
          HF_TOKEN: ${{ startsWith(steps.model.outputs.model, 'huggingface/') && secrets.HF_TOKEN || '' }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 720s \
            opencode run --format json --auto --model "$OPENCODE_MODEL" "$(cat /tmp/che-runtime-prompt.txt)" \
            >/tmp/opencode-events.jsonl 2>/tmp/opencode-stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          rm -f /tmp/che-runtime-prompt.txt /tmp/che-opencode-config.json

      - name: Build compact result and patch
        id: result
        if: always()
        env:
          EXIT_CODE: ${{ steps.opencode.outputs.exit_code }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
          PREFLIGHT_FAILURE: ${{ steps.guard.outputs.failure }}
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ steps.model.outputs.model || inputs.model }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const git = (...args) => cp.execFileSync('git', args, { encoding: 'utf8' });
          // Intent-to-add makes untracked source files visible to git diff without
          // staging their contents or committing anything.
          try { git('add', '-N', '--', '.'); } catch (_) { /* diff still reports tracked edits */ }
          const files = git('diff', '--name-only', '--diff-filter=ACMRD').trim().split('\n').filter(Boolean);
          const unsafe = files.filter((path) =>
            /^(?:\.github\/|\.git\/)/i.test(path)
            || /(?:^|\/)(?:\.env(?:\.|$)|secrets?\b|credentials?\b)/i.test(path)
            || /\.(?:pem|p12|mobileprovision|key|keystore|jks)$/i.test(path)
            || /^(?:pubspec\.ya?ml|pubspec\.lock|server\/cloudflare\/(?:package(?:-lock)?\.json|wrangler\.jsonc))$/i.test(path)
            || /^ios\/.*\.(?:plist|pbxproj|xcconfig|entitlements)$/i.test(path)
            || /^android\/.*\.(?:gradle|kts|properties)$/i.test(path)
          );
          const rawExit = String(process.env.EXIT_CODE || '').trim();
          const exitCode = /^\d+$/.test(rawExit) ? Number(rawExit) : 1;
          const patch = unsafe.length ? '' : git('diff', '--binary');
          const numstat = git('diff', '--numstat').trim().split('\n').filter(Boolean);
          let additions = 0;
          let deletions = 0;
          for (const row of numstat) {
            const [a, d] = row.split('\t');
            if (/^\d+$/.test(a)) additions += Number(a);
            if (/^\d+$/.test(d)) deletions += Number(d);
          }
          const state = unsafe.length || exitCode !== 0 || process.env.OPENCODE_OUTCOME !== 'success'
            ? 'blocked'
            : files.length ? 'implemented' : 'no_change';
          const artifactName = `che-opencode-${process.env.JOB_ID}`;
          const result = {
            session_id: process.env.JOB_ID,
            runtime: 'opencode',
            runtime_version: 'opencode-ai@1.18.34',
            state,
            run_id: Number(process.env.RUN_ID),
            base_sha: process.env.BASE_SHA,
            target_branch: process.env.TARGET_BRANCH,
            model: process.env.MODEL,
            changed_files: files.length,
            additions,
            deletions,
            files: files.slice(0, 40),
            unsafe_files: unsafe.slice(0, 20),
            opencode_exit_code: exitCode,
            patch_artifact: patch ? artifactName : null,
            failure: unsafe.length ? 'unsafe_files' : (process.env.PREFLIGHT_FAILURE || (exitCode !== 0 ? 'opencode_failed' : null)),
          };
          fs.writeFileSync('/tmp/che-runtime-result.json', JSON.stringify(result));
          if (patch) fs.writeFileSync('/tmp/che-runtime.patch', patch);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `safe=${unsafe.length ? 'false' : 'true'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_patch=${patch ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `CHE OpenCode runtime: ${state}; ${files.length} file(s) changed; +${additions}/-${deletions}.\n`);
          NODE
          rm -f /tmp/opencode-events.jsonl /tmp/opencode-stderr.log

      - name: Upload compact runtime result
        if: always() && steps.result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: che-opencode-result-${{ inputs.job_id }}
          path: /tmp/che-runtime-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload patch handoff
        if: steps.result.outputs.safe == 'true' && steps.result.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: che-opencode-${{ inputs.job_id }}
          path: /tmp/che-runtime.patch
          if-no-files-found: error
          retention-days: 3

  deliver:
    # Turns a safe patch into a reviewable PR. Uses CHE_GITHUB_TOKEN (not the
    # default token) so the PR's CI runs and che-autopilot can review/merge it.
    needs: runtime
    if: needs.runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Download patch
        id: patch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: che-opencode-${{ inputs.job_id }}
          path: /tmp/che-patch
      - name: Checkout exact base
        if: steps.patch.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          token: ${{ secrets.CHE_GITHUB_TOKEN }}
      - name: Commit, push and open PR
        id: pr
        if: steps.patch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUEST_B64: ${{ inputs.request_b64 }}
        run: |
          git apply --index /tmp/che-patch/che-runtime.patch
          git -c user.name="CHE" -c user.email="che-autopilot@users.noreply.github.com" commit -qm "che-auto: ${JOB_ID}" -m "Automated change by CHE's OpenCode runner. [che-auto]"
          git push -q origin "HEAD:refs/heads/${TARGET_BRANCH}"
          title="CHE: $(echo "$REQUEST_B64" | base64 -d | head -c 90 | tr '\n' ' ')"
          url=$(gh pr create --base main --head "$TARGET_BRANCH" --title "$title" --body "Automated change by CHE's OpenCode runner (session ${JOB_ID}). che-autopilot reviews and merges it when CI passes." --label che-auto 2>/dev/null || gh pr create --base main --head "$TARGET_BRANCH" --title "$title" --body "Automated change by CHE's OpenCode runner (session ${JOB_ID}).")
          echo "pr_number=${url##*/}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [runtime, deliver]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download compact result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: che-opencode-result-${{ inputs.job_id }}
          path: /tmp/che-runtime-result

      - name: Ensure a compact terminal result exists
        env:
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
          RUN_ID: ${{ github.run_id }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          mkdir -p /tmp/che-runtime-result
          if [[ ! -s /tmp/che-runtime-result/che-runtime-result.json ]]; then
            node <<'NODE'
            const fs = require('fs');
            fs.writeFileSync('/tmp/che-runtime-result/che-runtime-result.json', JSON.stringify({
              session_id: process.env.JOB_ID,
              runtime: 'opencode',
              runtime_version: 'opencode-ai@1.18.34',
              state: 'blocked',
              run_id: Number(process.env.RUN_ID),
              base_sha: process.env.BASE_SHA,
              target_branch: process.env.TARGET_BRANCH,
              model: process.env.MODEL,
              changed_files: 0,
              files: [],
              unsafe_files: [],
              opencode_exit_code: null,
              patch_artifact: null,
              failure: `runtime_job_${process.env.RUNTIME_RESULT || 'unknown'}`,
            }));
          NODE
          fi

      - name: Post compact result to CHE mailbox branch
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.job_id }}
          PR_NUMBER: ${{ needs.deliver.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const branch = 'che-mailbox';
            const path = `mailbox/runtime/${process.env.JOB_ID}.json`;
            const result = JSON.parse(fs.readFileSync('/tmp/che-runtime-result/che-runtime-result.json', 'utf8'));
            const pr = Number(process.env.PR_NUMBER || 0);
            if (pr && result.state === 'implemented') Object.assign(result, { state: 'pr_open', pr_number: pr });
            const content = JSON.stringify(result);
            let sha;
            try {
              const current = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              message: `runtime: ${process.env.JOB_ID}`,
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
