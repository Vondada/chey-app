name: CHE OpenCode coding runtime
# The Worker matches a run to its session by this title (coding_runtime.js
# RUNTIME_RUN_TITLE_PREFIX). An expression in run-name is display text only:
# it never reaches a shell, and the claim job still validates job_id.
run-name: CHE OpenCode runtime ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Stable CHE coding-session id
        required: true
        type: string
      request_b64:
        description: UTF-8 owner request encoded as base64
        required: true
        type: string
      base_sha:
        description: Exact repository commit CHE inspected
        required: true
        type: string
      target_branch:
        description: Review branch the orchestrator will reconcile into
        required: true
        type: string
      model:
        description: OpenCode model in provider/model form
        required: true
        type: string
      merge_authorized:
        description: "'true' only when the owner's own words authorized the merge; otherwise the PR waits for his yes"
        required: false
        default: 'false'
        type: string

# The coding process itself only receives read access. A separate publisher job
# gets contents:write solely to place compact status JSON on che-mailbox.
permissions:
  contents: read

concurrency:
  group: che-opencode-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  # Claim the stable session before any model is started. This job receives no
  # provider credentials or source checkout; it only uses the mailbox branch as
  # a compare-and-set idempotency record so duplicate dispatches spend no tokens.
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      resume_count: ${{ steps.claim.outputs.resume_count }}
    steps:
      - name: Claim stable coding session
        id: claim
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
        with:
          github-token: ${{ github.token }}
          script: |
            const jobId = String(process.env.JOB_ID || '').trim();
            const baseSha = String(process.env.BASE_SHA || '').trim().toLowerCase();
            const targetBranch = String(process.env.TARGET_BRANCH || '').trim();
            const model = String(process.env.MODEL || '').trim();
            if (!/^ocr-[0-9a-f]{8}$/.test(jobId)) throw new Error('Invalid CHE runtime job id.');
            if (!/^[0-9a-f]{40}$/.test(baseSha)) throw new Error('Invalid CHE runtime base SHA.');
            if (!targetBranch || targetBranch.length > 160 || targetBranch.includes('..') || targetBranch.startsWith('/') || targetBranch.endsWith('/') || !/^[A-Za-z0-9._\/-]+$/.test(targetBranch)) throw new Error('Invalid CHE runtime target branch.');
            if (model !== 'auto' && !/^[A-Za-z0-9._-]+\/[A-Za-z0-9._:@\/-]+$/.test(model)) throw new Error('Invalid CHE runtime model.');
            const branch = 'che-mailbox';
            const path = `mailbox/runtime/${jobId}.json`;
            let sha;
            let prior = null;
            try {
              const current = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
              sha = current.data.sha;
              prior = JSON.parse(Buffer.from(String(current.data.content || '').replace(/\\s+/g, ''), 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // A capacity failure that left its verified checkpoint may resume, at most MAX_RESUMES times.
            const MAX_RESUMES = 3;
            const resumable = prior?.state === 'blocked' && prior?.resumable === true && Number(prior.resume_count || 0) < MAX_RESUMES;
            const claimable = !prior || ['queued', 'dispatching'].includes(String(prior.state || '')) || resumable;
            if (!claimable) {
              core.setOutput('claimed', 'false');
              core.info(`CHE runtime session already has state ${prior?.state || 'unknown'}; duplicate dispatch will not run.`);
              return;
            }
            const marker = {
              session_id: process.env.JOB_ID,
              runtime: 'opencode',
              runtime_version: 'opencode-ai@1.18.34',
              state: 'running',
              claimed_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
              run_id: Number(context.runId),
              base_sha: process.env.BASE_SHA,
              target_branch: process.env.TARGET_BRANCH,
              model: process.env.MODEL,
              // che-autopilot merges only a session whose record says the owner authorized it.
              merge_authorized: process.env.MERGE_AUTHORIZED === 'true',
              changed_files: 0,
              files: [],
              unsafe_files: [],
              resume_count: resumable ? Number(prior.resume_count || 0) + 1 : 0,
              patch_artifact: null,
            };
            try {
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,
                path,
                branch,
                message: `runtime claim: ${process.env.JOB_ID}`,
                content: Buffer.from(JSON.stringify(marker)).toString('base64'),
                ...(sha ? { sha } : {}),
              });
              core.setOutput('claimed', 'true');
              core.setOutput('resume_count', String(marker.resume_count));
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                core.setOutput('claimed', 'false');
                core.info('Another run claimed this CHE runtime session first.');
                return;
              }
              throw error;
            }

  runtime:
    needs: claim
    if: needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout the exact base this session was dispatched for
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stage trusted coding tools
        shell: bash
        run: |
          # The attempts edit the working tree, so the gate that decides paid use and the
          # checkpoint verifier are copied from the exact base before any attempt runs.
          trust="$RUNNER_TEMP/che-trusted"
          mkdir -p "$trust/tools" "$trust/server/cloudflare"
          cp tools/che_coding_paid_gate.mjs tools/che_coding_checkpoint.mjs "$trust/tools/"
          cp server/cloudflare/coding_failover.mjs "$trust/server/cloudflare/"
          # The zero-cost router (owner, 2026-10-27: $0 authorized AI spend) decides which models may run.
          # A base from before it existed runs no model at all rather than an unchecked one.
          cp tools/che_coding_zero_cost.mjs "$trust/tools/" && cp server/cloudflare/model_router.mjs "$trust/server/cloudflare/" \
            || echo "::warning::This base has no zero-cost router, so no model will run."
          echo "CHE_TRUSTED_TOOLS=$trust" >> "$GITHUB_ENV"

      - name: Decode and guard task
        id: guard
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const fail = (kind, message) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `failure=${kind}\n`);
            console.error(`::error::${message}`);
            process.exit(2);
          };
          const jobId = String(process.env.JOB_ID || '').trim();
          const baseSha = String(process.env.BASE_SHA || '').trim().toLowerCase();
          const targetBranch = String(process.env.TARGET_BRANCH || '').trim();
          const model = String(process.env.MODEL || '').trim();
          if (!/^ocr-[0-9a-f]{8}$/.test(jobId)) fail('invalid_job_id', 'CHE runtime job id failed validation.');
          if (!/^[0-9a-f]{40}$/.test(baseSha)) fail('invalid_base_sha', 'CHE runtime base SHA must be the exact 40-character commit id.');
          if (!targetBranch || targetBranch.length > 160 || targetBranch.includes('..') || targetBranch.startsWith('/') || targetBranch.endsWith('/') || !/^[A-Za-z0-9._\/-]+$/.test(targetBranch)) fail('invalid_target_branch', 'CHE runtime target branch failed validation.');
          if (model !== 'auto' && !/^[A-Za-z0-9._-]+\/[A-Za-z0-9._:@\/-]+$/.test(model)) fail('invalid_model', 'CHE runtime model must be provider/model.');
          const checkedOut = cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
          if (checkedOut !== baseSha) fail('stale_base_sha', 'CHE runtime refused stale source: main changed after inspection.');
          const encoded = String(process.env.REQUEST_B64 || '');
          let request = '';
          try { request = Buffer.from(encoded, 'base64').toString('utf8').trim(); } catch (_) { fail('invalid_request_encoding', 'CHE runtime request is not valid base64.'); }
          if (request.length < 8 || request.length > 16000) fail('invalid_request_length', 'CHE runtime request failed length validation.');
          const secretLike = [
            /BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY/i,
            /(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}/,
            /(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}/,
            /sk-[A-Za-z0-9_-]{20,}/,
            /AIza[0-9A-Za-z_-]{20,}/,
            /xai-[A-Za-z0-9]{20,}/,
          ];
          if (secretLike.some((re) => re.test(request))) fail('secret_like_request', 'CHE runtime request looks like it contains a secret; refusing to send it to OpenCode.');
          const preamble = [
            'You are a coding worker inside CHE. Work only in this isolated checkout.',
            'Inspect real source before editing. Make the smallest complete change that satisfies the owner request.',
            'Use the ponytail skill (.opencode/skills/ponytail): understand the real flow first, then stop at the first rung that holds: not needed, already in the codebase, standard library, native platform feature, installed dependency, one line, then the minimum that works. Never cut validation, security, data-loss handling or accessibility.',
            'For a bug, follow .claude/skills/che-debug/SKILL.md: reproduce first (scripts/replay_chat.mjs replays chat turns through the real /api/chat offline), fix in the module that owns the behavior, then run scripts/run_checks.sh. For anything about what CHE claims is true, read .claude/skills/che-fact-check/SKILL.md.',
            'Do not push, open or merge pull requests, deploy, alter workflows, signing files, secrets, dependency manifests, or production credentials.',
            'Leave any source edits only in the working tree. Do not print secrets. If no safe change is needed, leave the tree unchanged.',
            '',
            'OWNER REQUEST:',
            request,
          ].join('\n');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/che-runtime-prompt.txt`, preamble, { mode: 0o600 });
          // Defense in depth: deny outbound helper tools and git push inside the
          // coding agent. This is not treated as a sandbox; the hosted runner is
          // still the isolation boundary and receives no writable Git credential.
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/che-opencode-config.json`, JSON.stringify({
            $schema: 'https://opencode.ai/config.json',
            permission: {
              webfetch: 'deny',
              bash: {
                '*': 'allow',
                'git push*': 'deny',
                'gh *': 'deny',
                'curl *': 'deny',
                'wget *': 'deny',
              },
            },
          }), { mode: 0o600 });
          NODE

      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.18.34
      - name: Build code context (graphify code map, opensrc)
        if: hashFiles('.github/actions/che-code-context/action.yml') != ''
        uses: ./.github/actions/che-code-context
        continue-on-error: true
      - name: Fetch the model ledger (circuit breakers and past outcomes)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            try {
              const found = await github.rest.repos.getContent({ ...context.repo, path: 'mailbox/runtime/model-ledger.json', ref: 'che-mailbox' });
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/che-model-ledger.json`, Buffer.from(String(found.data.content || '').replace(/\s+/g, ''), 'base64'));
            } catch (error) {
              if (error.status !== 404) core.warning(`Model ledger unreadable (${error.status || 'network'}); every breaker starts closed.`);
            }
      - name: Resolve model
        id: model
        shell: bash
        env:
          REQUESTED: ${{ inputs.model }}
          # Read only to be reported as ignored. The owner authorized $0 of AI spend (2026-10-27):
          # a capped paid key is a ceiling, not an approval, so no paid model is ever planned.
          CHE_CODING_PAID_FALLBACK: ${{ vars.CHE_CODING_PAID_FALLBACK }}
          # Providers the owner confirmed are on a plan where the provider itself blocks billing
          # (no payment method on file). Only providers whose terms say so are accepted.
          CHE_CODING_FREE_PROVIDERS: ${{ vars.CHE_CODING_FREE_PROVIDERS }}
          K_GOOGLE: ${{ secrets.GEMINI_API_KEY }}
          K_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          K_GROQ: ${{ secrets.GROQ_API_KEY }}
          K_MISTRAL: ${{ secrets.MISTRAL_API_KEY }}
          K_CEREBRAS: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          route="$RUNNER_TEMP/che-route"; mkdir -p "$route"
          zc="$CHE_TRUSTED_TOOLS/tools/che_coding_zero_cost.mjs"
          # OpenCode lists a provider's models only when that provider's key is
          # visible, so expose exactly one key for exactly one listing call.
          list_models() {
            local p=$1 var key
            case $p in google) var=GEMINI_API_KEY; key=$K_GOOGLE;; groq) var=GROQ_API_KEY; key=$K_GROQ;; mistral) var=MISTRAL_API_KEY; key=$K_MISTRAL;; cerebras) var=CEREBRAS_API_KEY; key=$K_CEREBRAS;; *) return 0;; esac
            if [ "$p" = google ]; then env -u K_GOOGLE "$var=$key" "GOOGLE_GENERATIVE_AI_API_KEY=$key" opencode models "$p" 2>/dev/null || true
            else env "$var=$key" opencode models "$p" 2>/dev/null || true; fi
          }
          keyed=""
          for p in GOOGLE OPENROUTER GROQ MISTRAL CEREBRAS; do v=K_$p; [ -n "${!v}" ] && keyed="$keyed ${p,,}"; done
          echo "Providers with a GitHub Actions key:${keyed:- none}"
          if [ ! -f "$zc" ]; then
            echo "::error::The zero-cost router is missing from this base, so no model runs and nothing is spent."
            printf 'free_candidates=\npaid_candidates=\nmodel=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # OpenRouter is read live (key status and today's prices). Owner-attested providers use
          # the model ids OpenCode lists for their key. No other provider is called.
          for p in $(node "$zc" attested); do list_models "$p" > "$route/listing-$p.txt"; done
          node "$zc" plan --out-dir "$route" --ledger "$RUNNER_TEMP/che-model-ledger.json" --request-file "$RUNNER_TEMP/che-runtime-prompt.txt"

      - name: Fetch the verified checkpoint of a resumed session
        if: fromJSON(needs.claim.outputs.resume_count || '0') > 0
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.job_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = `mailbox/runtime/checkpoints/${process.env.JOB_ID}.json`;
            const dir = `${process.env.RUNNER_TEMP}/che-checkpoint`;
            fs.mkdirSync(dir, { recursive: true });
            try {
              const found = await github.rest.repos.getContent({ ...context.repo, path, ref: 'che-mailbox' });
              const saved = JSON.parse(Buffer.from(String(found.data.content || '').replace(/\s+/g, ''), 'base64').toString('utf8'));
              fs.writeFileSync(`${dir}/checkpoint.patch`, Buffer.from(String(saved.patch_b64 || ''), 'base64'));
              fs.writeFileSync(`${dir}/checkpoint.json`, JSON.stringify(saved.meta || {}));
              core.info(`Resuming from verified checkpoint ${saved.meta?.seq || '?'} (${(saved.meta?.files || []).length} files).`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No verified checkpoint was saved; the resumed session starts from the base.');
            }

      - name: Run OpenCode in the isolated checkout
        id: opencode
        shell: bash
        env:
          OPENCODE_CONFIG: ${{ runner.temp }}/che-opencode-config.json
          FREE_CANDIDATES: ${{ steps.model.outputs.free_candidates }}
          PAID_CANDIDATES: ${{ steps.model.outputs.paid_candidates }}
          CHE_CODING_PAID_FALLBACK: ${{ vars.CHE_CODING_PAID_FALLBACK }}
          # Keys are held under private names; each attempt exposes only the
          # selected provider's key under the name OpenCode reads.
          K_GOOGLE: ${{ secrets.GEMINI_API_KEY }}
          K_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          K_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          K_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          K_GROQ: ${{ secrets.GROQ_API_KEY }}
          K_MISTRAL: ${{ secrets.MISTRAL_API_KEY }}
          K_CEREBRAS: ${{ secrets.CEREBRAS_API_KEY }}
          K_HF: ${{ secrets.HF_TOKEN }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set +e
          # Every error or log text below goes through the shared redactor (coding_failover.mjs
          # redactSecrets) via the trusted copy, before it reaches the log or the job record.
          # A log window is cut only after redaction, so a key split by the cut leaves no fragment.
          redact_raw() { node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" redact; }
          redact() { node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" redact | tr '\n"' '  ' | cut -c1-350; }
          # This free-coding step never receives the capped paid key.
          prompt=$(cat ${RUNNER_TEMP}/che-runtime-prompt.txt)
          code=1; used=""; tried=""
          start=$(date +%s)
          # Checkpoint tool: untracked files that exist before any attempt are never deleted.
          # A checkpoint saved by an earlier run of this session is restored first.
          ckpt="$RUNNER_TEMP/che-checkpoint"
          baseline_failed=""
          if ! node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" snapshot --dir "$ckpt" >/dev/null; then
            echo "::error::Could not record the source baseline, so no attempt will run."
            baseline_failed=1
          fi
          if [ -f "$ckpt/checkpoint.patch" ]; then
            if node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" restore --dir "$ckpt" >${RUNNER_TEMP}/checkpoint-restore.json; then
              echo "Restored verified checkpoint: $(redact < ${RUNNER_TEMP}/checkpoint-restore.json)"
            else
              echo "::warning::The saved checkpoint no longer applies to this base; starting from the base."
              rm -f "$ckpt/checkpoint.patch" "$ckpt/checkpoint.json"
            fi
          fi
          attempt=1; failure_kind=""; failure_resumable=false
          # The zero-cost plan (Resolve model): per-model coverage, OpenCode model metadata, why none.
          route="$RUNNER_TEMP/che-route"; zc="$CHE_TRUSTED_TOOLS/tools/che_coding_zero_cost.mjs"
          # Providers stopped for the rest of this run (auth failure, allowance used up, billing risk).
          skip_providers=""
          # One receipt per model attempt (coding_failover.mjs attemptReceipt), read by the job record.
          attempts_file="$RUNNER_TEMP/che-attempts.jsonl"; : > "$attempts_file"
          record_attempt() { # model exit seconds cap progress failure-text-file
            local cov; cov=$(awk -F '\t' -v m="$1" '$1==m{print $2}' "$route/coverage.tsv" 2>/dev/null)
            node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" receipt --model "$1" --exit "$2" --seconds "$3" --cap "$4" --progress "$5" --coverage "$cov" --started "$attempt_started_at" <"$6" >>"$attempts_file" \
              || echo "::warning::Could not write the receipt for $1."
          }
          last_receipt() { node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" last --attempts "$attempts_file" --field "$1"; }
          # Free requests leave the OpenRouter key's usage unchanged; it is read before and after.
          [ -f "$zc" ] && node "$zc" usage --phase before --dir "$route" >/dev/null
          if [ -z "${FREE_CANDIDATES// /}" ]; then
            # A verified free model in cooldown is capacity recovery, not missing authorization.
            capacity_at=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).capacity_resume_at || "")}catch{}' "$route/routing.json")
            if [ -n "$capacity_at" ]; then
              failure_kind=quota; failure_resumable=true
              echo "::warning::Free model capacity is paused until $capacity_at; the same session keeps its checkpoint."
            else
              failure_kind=no_eligible_model
              echo "::error::No zero-cost model can run: $(redact < "$route/summary.txt" 2>/dev/null)"
            fi
          fi
          # OpenCode keeps retrying errors that cannot succeed (no quota, no access to the model,
          # a request too large for the key's token limit) until the time budget runs out. An
          # error event naming one of them stops that model at once, so the next one gets the
          # time. Only error events count: file text the agent reads never stops it.
          FATAL='ContextOverflowError|exceeded your current quota|RESOURCE_EXHAUSTED|insufficient_quota|rate.?limit|too many requests|does not exist or you do not have access|Request too large for model|"statusCode": ?(401|403|404|429)'
          fatal_seen() {
            { grep -E '"type": ?"error"' ${RUNNER_TEMP}/opencode-events.jsonl 2>/dev/null; grep -iE 'error' ${RUNNER_TEMP}/opencode-stderr.log 2>/dev/null; } | grep -qE "$FATAL"
          }
          for m in $FREE_CANDIDATES; do
            [ -z "$baseline_failed" ] || break
            case " $skip_providers " in *" ${m%%/*} "*) echo "Skipping $m: ${m%%/*} was stopped earlier in this run."; continue;; esac
            # Leave time for a dedicated capped paid step only when enabled.
            remaining=$(( 840 - ($(date +%s) - start) ))
            if [ -n "$PAID_CANDIDATES" ]; then
              left=$((remaining - 180))
              [ "$left" -ge 60 ] || { echo "::notice::Free time exhausted; paid fallback stays isolated."; break; }
            else
              left=$remaining
              [ "$left" -ge 60 ] || { echo "::warning::Free coding session time exhausted."; failure_kind=timeout; failure_resumable=true; break; }
            fi
            # A real coding task needs minutes, not seconds; the next model gets what is left.
            [ "$left" -le 420 ] || left=420
            case ${m%%/*} in
              google) kv=("GEMINI_API_KEY=$K_GOOGLE" "GOOGLE_GENERATIVE_AI_API_KEY=$K_GOOGLE");;
              groq) kv=("GROQ_API_KEY=$K_GROQ");;
              cerebras) kv=("CEREBRAS_API_KEY=$K_CEREBRAS");;
              mistral) kv=("MISTRAL_API_KEY=$K_MISTRAL");;
              openrouter) kv=("OPENROUTER_API_KEY=$K_OPENROUTER");;
              *) echo "::error::Non-free provider blocked in free phase."; continue;;
            esac
            used=$m; tried="$tried $m"
            echo "Trying $m"
            : >${RUNNER_TEMP}/opencode-events.jsonl; : >${RUNNER_TEMP}/opencode-stderr.log
            attempt_started=$(date +%s); attempt_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Main and small model pinned to $m, so OpenCode never picks another (possibly paid) model.
            attempt_config="$OPENCODE_CONFIG"
            if [ -f "$zc" ] && [ -f "$route/models.json" ] && node "$zc" config --base "$OPENCODE_CONFIG" --model "$m" --models "$route/models.json" --out "$RUNNER_TEMP/che-opencode-attempt.json"; then
              attempt_config="$RUNNER_TEMP/che-opencode-attempt.json"
            fi
            # --print-logs puts OpenCode's own error log on stderr, which is redacted before it is kept:
            # without it a failure reads only "Unexpected server error" (2026-10-26, ocr-49bea5b4).
            env -u K_GOOGLE -u K_ANTHROPIC -u K_OPENAI -u K_OPENROUTER -u K_GROQ -u K_MISTRAL -u K_CEREBRAS -u K_HF -u K_PAID_OPENROUTER "OPENCODE_CONFIG=$attempt_config" "${kv[@]}" \
              timeout --signal=TERM --kill-after=15s "${left}s" \
              opencode run --print-logs --log-level ERROR --format json --auto --model "$m" "$prompt" \
              >${RUNNER_TEMP}/opencode-events.jsonl 2>${RUNNER_TEMP}/opencode-stderr.log &
            pid=$!
            stopped=""
            while kill -0 "$pid" 2>/dev/null; do
              if fatal_seen; then stopped=yes; kill -TERM "$pid" 2>/dev/null; break; fi
              sleep 2
            done
            wait "$pid"
            code=$?
            [ -n "$stopped" ] && code=75
            seconds=$(( $(date +%s) - attempt_started ))
            if [ "$code" = 0 ]; then
              progress=none; [ -n "$(git status --porcelain)" ] && progress=delivered
              record_attempt "$m" "$code" "$seconds" "$left" "$progress" /dev/null
              break
            fi
            # The kind decides whether this session may resume later from its checkpoint.
            { grep -E '"type": ?"error"' ${RUNNER_TEMP}/opencode-events.jsonl 2>/dev/null; cat ${RUNNER_TEMP}/opencode-stderr.log 2>/dev/null; } >${RUNNER_TEMP}/opencode-failure.txt
            failure_kind=$(node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" classify --exit "$code" --field kind <${RUNNER_TEMP}/opencode-failure.txt)
            failure_resumable=$(node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" classify --exit "$code" --field resumable <${RUNNER_TEMP}/opencode-failure.txt)
            why=$( { redact_raw < ${RUNNER_TEMP}/opencode-stderr.log | tail -c 4000; grep -iE 'error|quota|rate|denied|invalid|not found' ${RUNNER_TEMP}/opencode-events.jsonl | redact_raw | tail -2; } 2>/dev/null | redact)
            [ "$code" = 124 ] && why="timed out after ${left}s. $why"
            [ "$code" = 75 ] && why="stopped after $(( $(date +%s) - start ))s of the run: this model cannot do the request with this key. $why"
            echo "::warning::$m failed (exit $code): ${why:-no error text}"
            # Unverified edits never reach the next model. A verified change stays as the
            # checkpoint the next model continues from; anything else is reverted.
            progress=none
            if [ -n "$(git status --porcelain)" ]; then
              attempt=$((attempt + 1))
              if node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" advance --dir "$ckpt" --base "$BASE_SHA" --prompt-file ${RUNNER_TEMP}/che-runtime-prompt.txt --attempt "$attempt" --history-file "$attempts_file" >${RUNNER_TEMP}/checkpoint-verdict.json; then
                prompt=$(cat "$ckpt/next-prompt.txt")
                progress=verified
                echo "::notice::$m left verified progress; the next model continues from it."
              else
                verdict_rc=$?
                if [ "$verdict_rc" = 2 ]; then
                  record_attempt "$m" "$code" "$seconds" "$left" unverifiable ${RUNNER_TEMP}/opencode-failure.txt
                  echo "::error::Could not revert unverified edits; no further attempts run."; break
                fi
                progress=reverted
                echo "::warning::$m left changes that did not verify; reverted to the last checkpoint: $(redact < ${RUNNER_TEMP}/checkpoint-verdict.json)"
              fi
            fi
            record_attempt "$m" "$code" "$seconds" "$left" "$progress" ${RUNNER_TEMP}/opencode-failure.txt
            # The router's class decides the next move: a provider-wide failure skips that provider.
            cls=$(last_receipt error_class)
            if [ "$(last_receipt scope)" = provider ]; then
              skip_providers="$skip_providers ${m%%/*}"
              echo "::warning::${m%%/*} is stopped for the rest of this run (${cls})."
            fi
            [ "$cls" = billing_risk ] && echo "::error::$m signalled a possible charge (billing_risk). Its provider is stopped; no paid model runs."
            [ "$(last_receipt resumable)" = true ] && failure_resumable=true || failure_resumable=false
          done
          # A verified charge on the free key stops OpenRouter in the ledger and is reported, never hidden.
          billing_alert=false
          if [ -f "$zc" ]; then node "$zc" usage --phase after --dir "$route"; [ $? = 3 ] && billing_alert=true; fi
          echo "billing_alert=$billing_alert" >> "$GITHUB_OUTPUT"
          # Short, key-free error for CHE's status record.
          err=$( { redact_raw < ${RUNNER_TEMP}/opencode-stderr.log | tail -c 4000; grep -iE 'error|quota|rate|denied|invalid|not found' ${RUNNER_TEMP}/opencode-events.jsonl | redact_raw | tail -2; } 2>/dev/null | redact)
          echo "failure_kind=${failure_kind:-unknown}" >> "$GITHUB_OUTPUT"
          echo "resumable=${failure_resumable:-false}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "model=$used" >> "$GITHUB_OUTPUT"
          echo "tried=$tried" >> "$GITHUB_OUTPUT"
          [ -n "$err" ] || err=$(redact < "$route/summary.txt" 2>/dev/null)
          [ "$code" = 0 ] || echo "error=$err" >> "$GITHUB_OUTPUT"

      # Disabled (owner, 2026-10-27): authorized AI spend is $0, and no cap is an approval. The step
      # stays so its guards and tests stay visible; the plan never lists a paid model, the gate never
      # opens, and the body below refuses before any model unless the code-level authorization is raised.
      - name: Run capped paid OpenRouter only after free attempts
        id: paid
        if: steps.guard.outcome == 'success' && steps.model.outcome == 'success' && steps.opencode.outcome == 'success' && steps.opencode.outputs.exit_code != '0' && vars.CHE_CODING_PAID_FALLBACK == 'true'
        shell: bash
        env:
          OPENCODE_CONFIG: ${{ runner.temp }}/che-opencode-config.json
          PAID_CANDIDATES: ${{ steps.model.outputs.paid_candidates }}
          CHE_CODING_PAID_FALLBACK: ${{ vars.CHE_CODING_PAID_FALLBACK }}
          CHE_CODING_OPENROUTER_NO_BYOK: ${{ vars.CHE_CODING_OPENROUTER_NO_BYOK }}
          K_PAID_OPENROUTER: ${{ secrets.CHE_CODING_OPENROUTER_PAID_KEY }}
          BASE_SHA: ${{ inputs.base_sha }}
          FREE_FAILURE_KIND: ${{ steps.opencode.outputs.failure_kind }}
          FREE_RESUMABLE: ${{ steps.opencode.outputs.resumable }}
        run: |
          set +e
          # The paid step's error text goes through the same shared redactor as the free step,
          # and its log window is cut only after redaction.
          redact_raw() { node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" redact; }
          redact() { node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" redact | tr '\n"' '  ' | cut -c1-350; }
          code=1; used=""; tried=""; failure_kind="${FREE_FAILURE_KIND:-unknown}"; failure_resumable="${FREE_RESUMABLE:-false}"; err=""
          paid_key="$K_PAID_OPENROUTER"; unset K_PAID_OPENROUTER
          # Fails closed: only a trusted gate that itself says spend is authorized lets this step go on.
          spend=$(node --input-type=module -e "const m = await import(process.argv[1]); process.stdout.write(Number(m.AUTHORIZED_CODING_SPEND_USD) > 0 ? 'authorized' : 'zero');" "$CHE_TRUSTED_TOOLS/tools/che_coding_paid_gate.mjs" 2>/dev/null)
          if [ "$spend" != authorized ]; then
            echo "::notice::Paid coding fallback is disabled: the owner authorized \$0 of AI spend. No paid model runs."
          elif [ -z "$PAID_CANDIDATES" ]; then
            echo "::notice::No eligible capped paid coding model."
          elif ! CHE_CODING_OPENROUTER_PAID_KEY="$paid_key" node "$CHE_TRUSTED_TOOLS/tools/che_coding_paid_gate.mjs"; then
            echo "::warning::Paid coding withheld: $15 monthly cap could not be verified."
          else
            ckpt="$RUNNER_TEMP/che-checkpoint"
            if [ -f "$ckpt/next-prompt.txt" ]; then
              prompt=$(cat "$ckpt/next-prompt.txt")
            else
              prompt=$(cat ${RUNNER_TEMP}/che-runtime-prompt.txt)
            fi
            # Both selected models are on the paid allowlist. Each attempt has a
            # bounded clock; the provider-enforced $15/month cap is checked first.
            for m in $PAID_CANDIDATES; do
              used=$m; tried="$tried $m"
              echo "Capped paid LAST fallback: $m"
              : > ${RUNNER_TEMP}/opencode-events.jsonl; : > ${RUNNER_TEMP}/opencode-stderr.log
              env -u K_GOOGLE -u K_ANTHROPIC -u K_OPENAI -u K_OPENROUTER -u K_GROQ -u K_MISTRAL -u K_CEREBRAS -u K_HF -u K_PAID_OPENROUTER "OPENROUTER_API_KEY=$paid_key" \
                timeout --signal=TERM --kill-after=15s 180s opencode run --format json --auto --model "$m" "$prompt" \
                > ${RUNNER_TEMP}/opencode-events.jsonl 2> ${RUNNER_TEMP}/opencode-stderr.log
              code=$?
              { tail -c 4000 ${RUNNER_TEMP}/opencode-stderr.log; grep -iE 'error|quota|rate|denied|invalid|not found' ${RUNNER_TEMP}/opencode-events.jsonl | tail -2; } > ${RUNNER_TEMP}/opencode-failure.txt
              failure_kind=$(node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" classify --exit "$code" --field kind < ${RUNNER_TEMP}/opencode-failure.txt)
              failure_resumable=$(node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" classify --exit "$code" --field resumable < ${RUNNER_TEMP}/opencode-failure.txt)
              err=$(redact_raw < ${RUNNER_TEMP}/opencode-stderr.log | tail -c 400 | redact)
              if [ "$code" = 0 ]; then break; fi
              echo "::warning::$m failed; checking the next capped model if time remains."
              if [ -n "$(git status --porcelain)" ]; then
                if node "$CHE_TRUSTED_TOOLS/tools/che_coding_checkpoint.mjs" advance --dir "$ckpt" --base "$BASE_SHA" --prompt-file ${RUNNER_TEMP}/che-runtime-prompt.txt --attempt 7 > ${RUNNER_TEMP}/checkpoint-verdict.json; then
                  prompt=$(cat "$ckpt/next-prompt.txt")
                else
                  rc=$?
                  if [ "$rc" = 2 ]; then echo "::error::Could not revert unsafe paid-attempt edits."; break; fi
                fi
              fi
            done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "model=$used" >> "$GITHUB_OUTPUT"
          echo "tried=$tried" >> "$GITHUB_OUTPUT"
          echo "failure_kind=$failure_kind" >> "$GITHUB_OUTPUT"
          echo "resumable=$failure_resumable" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || echo "error=$err" >> "$GITHUB_OUTPUT"

      - name: Build compact result and patch
        id: result
        if: always()
        env:
          EXIT_CODE: ${{ steps.paid.outputs.exit_code || steps.opencode.outputs.exit_code }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
          PREFLIGHT_FAILURE: ${{ steps.guard.outputs.failure }}
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ steps.paid.outputs.model || steps.opencode.outputs.model || inputs.model }}
          TRIED: ${{ steps.opencode.outputs.tried }} ${{ steps.paid.outputs.tried }}
          OPENCODE_ERROR: ${{ steps.paid.outputs.error || steps.opencode.outputs.error }}
          FAILURE_KIND: ${{ steps.paid.outputs.failure_kind || steps.opencode.outputs.failure_kind }}
          RESUMABLE: ${{ steps.paid.outputs.resumable || steps.opencode.outputs.resumable }}
          RESUME_COUNT: ${{ needs.claim.outputs.resume_count }}
          BILLING_ALERT: ${{ steps.opencode.outputs.billing_alert }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const git = (...args) => cp.execFileSync('git', args, { encoding: 'utf8' });
          // Intent-to-add makes untracked source files visible to git diff without
          // staging their contents or committing anything.
          try { git('add', '-N', '--', '.'); } catch (_) { /* diff still reports tracked edits */ }
          // NUL-separated and without rename pairing: a renamed file shows its old path (a deletion) too.
          const files = git('diff', '--no-renames', '-z', '--name-only', '--diff-filter=ACMRD').split('\0').filter(Boolean);
          // The same path rules the checkpoint verifier uses, from the trusted copy taken at the base.
          const unsafe = files.length ? JSON.parse(cp.execFileSync('node', [`${process.env.CHE_TRUSTED_TOOLS}/tools/che_coding_checkpoint.mjs`, 'unsafe', ...files], { encoding: 'utf8' })) : [];
          const rawExit = String(process.env.EXIT_CODE || '').trim();
          const exitCode = /^\d+$/.test(rawExit) ? Number(rawExit) : 1;
          const state = unsafe.length || exitCode !== 0 || process.env.OPENCODE_OUTCOME !== 'success'
            ? 'blocked'
            : files.length ? 'implemented' : 'no_change';
          // Only an implemented session becomes a patch (and so a PR). A blocked session keeps its
          // verified checkpoint in the result for a bounded resume, and is never delivered as a change.
          const patch = state === 'implemented' ? git('diff', '--no-renames', '--binary') : '';
          const numstat = git('diff', '--no-renames', '--numstat').trim().split('\n').filter(Boolean);
          let additions = 0;
          let deletions = 0;
          for (const row of numstat) {
            const [a, d] = row.split('\t');
            if (/^\d+$/.test(a)) additions += Number(a);
            if (/^\d+$/.test(d)) deletions += Number(d);
          }
          const artifactName = `che-opencode-${process.env.JOB_ID}`;
          // One receipt per model attempt (written by the free loop). The last error alone hides the earlier models.
          const attemptsFile = `${process.env.RUNNER_TEMP}/che-attempts.jsonl`;
          const attempts = fs.existsSync(attemptsFile)
            ? fs.readFileSync(attemptsFile, 'utf8').split('\n').filter(Boolean).slice(0, 12).flatMap((line) => { try { return [JSON.parse(line)]; } catch (_) { return []; } })
            : [];
          // The router's plan and the measured cost (tools/che_coding_zero_cost.mjs). No secrets: only
          // verdicts, model ids, classes and numbers.
          const readJson = (path) => { try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch (_) { return null; } };
          const route = readJson(`${process.env.RUNNER_TEMP}/che-route/routing.json`);
          const billing = readJson(`${process.env.RUNNER_TEMP}/che-route/billing.json`);
          const winner = exitCode === 0 ? attempts.filter((a) => Number(a.exit_code) === 0).pop() : null;
          const result = {
            session_id: process.env.JOB_ID,
            runtime: 'opencode',
            runtime_version: 'opencode-ai@1.18.34',
            state,
            finished_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
            run_id: Number(process.env.RUN_ID),
            base_sha: process.env.BASE_SHA,
            target_branch: process.env.TARGET_BRANCH,
            model: process.env.MODEL,
            changed_files: files.length,
            additions,
            deletions,
            files: files.slice(0, 40),
            unsafe_files: unsafe.slice(0, 20),
            opencode_exit_code: exitCode,
            patch_artifact: patch ? artifactName : null,
            // no_eligible_model: nothing is verified at zero cost, so the job stops and says so (owner,
            // 2026-10-27) instead of being handed to engines whose billing is not verified.
            failure: unsafe.length ? 'unsafe_files' : (process.env.PREFLIGHT_FAILURE || (exitCode !== 0 ? (process.env.FAILURE_KIND === 'no_eligible_model' ? 'no_eligible_model' : 'opencode_failed') : null)),
            models_tried: String(process.env.TRIED || '').trim().split(/\s+/).filter(Boolean).slice(0, 8),
            attempts,
            error: exitCode !== 0 ? String(process.env.OPENCODE_ERROR || '').slice(0, 400) : null,
            // The model that actually finished the job, and every class that came before it.
            completed_by_model: winner ? winner.model : null,
            completed_by_provider: winner ? (winner.provider || String(winner.model).split('/')[0]) : null,
            error_history: attempts.filter((a) => a.error_class).map((a) => ({ model: a.model, error_class: a.error_class, decision: a.decision })),
            routing: route ? {
              authorized_spend_usd: route.authorized_spend_usd, paid_fallback: route.paid_fallback, task_kind: route.task_kind,
              candidates: (route.candidates || []).slice(0, 8), excluded: (route.excluded || []).slice(0, 12),
              verdicts: route.verdicts || {}, ignored_settings: route.ignored_settings || [], notes: route.notes || [],
            } : null,
            capacity_resume_at: route?.capacity_resume_at || null,
            billing: billing || null,
            billing_alert: process.env.BILLING_ALERT === 'true',
          };
          // Only a blocked session that kept a verified checkpoint can resume, and only for capacity failures.
          const resumable = state === 'blocked' && !unsafe.length && process.env.RESUMABLE === 'true';
          Object.assign(result, { failure_kind: process.env.FAILURE_KIND || null, resumable, resume_count: Number(process.env.RESUME_COUNT || 0) });
          const checkpointDir = `${process.env.RUNNER_TEMP}/che-checkpoint`;
          if (state === 'blocked' && !unsafe.length && fs.existsSync(`${checkpointDir}/checkpoint.patch`)) {
            const patch = fs.readFileSync(`${checkpointDir}/checkpoint.patch`);
            if (patch.length <= 300000) {
              result.checkpoint = { meta: JSON.parse(fs.readFileSync(`${checkpointDir}/checkpoint.json`, 'utf8')), patch_b64: patch.toString('base64') };
            }
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/che-runtime-result.json`, JSON.stringify(result));
          if (patch) fs.writeFileSync(`${process.env.RUNNER_TEMP}/che-runtime.patch`, patch);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `safe=${unsafe.length ? 'false' : 'true'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_patch=${patch ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `CHE OpenCode runtime: ${state}; ${files.length} file(s) changed; +${additions}/-${deletions}.\n`);
          NODE
          rm -f ${RUNNER_TEMP}/opencode-events.jsonl ${RUNNER_TEMP}/opencode-stderr.log

      - name: Upload compact runtime result
        if: always() && steps.result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: che-opencode-result-${{ inputs.job_id }}
          path: ${{ runner.temp }}/che-runtime-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload patch handoff
        if: steps.result.outputs.safe == 'true' && steps.result.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: che-opencode-${{ inputs.job_id }}
          path: ${{ runner.temp }}/che-runtime.patch
          if-no-files-found: error
          retention-days: 3

  deliver:
    # Turns a safe patch into a reviewable PR. Uses CHE_GITHUB_TOKEN (not the
    # default token) so the PR's CI runs and che-autopilot can review/merge it.
    needs: runtime
    if: needs.runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Download patch
        id: patch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: che-opencode-${{ inputs.job_id }}
          path: /tmp/che-patch
      - name: Require CHE_GITHUB_TOKEN
        if: steps.patch.outcome == 'success'
        env:
          HAS_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::CHE_GITHUB_TOKEN is not set as a GitHub Actions secret, so CHE cannot push her branch or open the PR."
            exit 1
          fi
      - name: Checkout exact base
        if: steps.patch.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          token: ${{ secrets.CHE_GITHUB_TOKEN }}
      - name: Commit, push and open PR
        id: pr
        if: steps.patch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CHE_GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUEST_B64: ${{ inputs.request_b64 }}
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
        run: |
          # The redactor is copied from the checked-out base before the patch is applied, so the
          # patch can never change the code that redacts the PR error below.
          trust="$RUNNER_TEMP/che-trusted"; mkdir -p "$trust/tools" "$trust/server/cloudflare"
          # Without the redactor the PR error text is withheld (fails closed); the PR step itself still runs.
          { cp tools/che_coding_checkpoint.mjs "$trust/tools/" && cp server/cloudflare/coding_failover.mjs "$trust/server/cloudflare/"; } \
            || echo "::warning::The shared redactor is not in this base, so GitHub's PR error text is withheld."
          redact() { node "$trust/tools/che_coding_checkpoint.mjs" redact | tr '\n"' '  ' | cut -c1-350; }
          git apply --index /tmp/che-patch/che-runtime.patch
          git -c user.name="CHE" -c user.email="che-autopilot@users.noreply.github.com" commit -qm "che-auto: ${JOB_ID}" -m "Automated change by CHE's OpenCode runner. [che-auto]"
          git push -q origin "HEAD:refs/heads/${TARGET_BRANCH}"
          title="CHE: $(echo "$REQUEST_B64" | base64 -d | head -c 90 | tr '\n' ' ')"
          if [ "$MERGE_AUTHORIZED" = true ]; then
            body="Automated change by CHE's OpenCode runner (session ${JOB_ID}). The owner authorized the merge in his request, so che-autopilot merges it after CI and an independent review pass."
          else
            body="Automated change by CHE's OpenCode runner (session ${JOB_ID}). CI and an independent review run; it is NOT merged until the owner says yes (\"merge it\")."
          fi
          # A PR already open for this branch is reused, so a re-delivery never opens a second one.
          existing=$(gh pr list --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "Branch ${TARGET_BRANCH} already has open PR #${existing}; updated it instead of opening another."
            echo "pr_number=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! url=$(gh pr create --base main --head "$TARGET_BRANCH" --title "$title" --body "$body" --label che-auto 2>/tmp/pr-err.txt) \
             && ! url=$(gh pr create --base main --head "$TARGET_BRANCH" --title "$title" --body "$body" 2>/tmp/pr-err.txt); then
            echo "::error::Branch ${TARGET_BRANCH} was pushed but GitHub refused to open the PR: $(redact </tmp/pr-err.txt). CHE_GITHUB_TOKEN needs Pull requests: Read and write."
            exit 1
          fi
          echo "pr_number=${url##*/}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [claim, runtime, deliver]
    if: always() && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download compact result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: che-opencode-result-${{ inputs.job_id }}
          path: /tmp/che-runtime-result

      - name: Ensure a compact terminal result exists
        env:
          JOB_ID: ${{ inputs.job_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          MODEL: ${{ inputs.model }}
          RUN_ID: ${{ github.run_id }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          mkdir -p /tmp/che-runtime-result
          if [[ ! -s /tmp/che-runtime-result/che-runtime-result.json ]]; then
            node <<'NODE'
            const fs = require('fs');
            fs.writeFileSync('/tmp/che-runtime-result/che-runtime-result.json', JSON.stringify({
              session_id: process.env.JOB_ID,
              runtime: 'opencode',
              runtime_version: 'opencode-ai@1.18.34',
              state: 'blocked',
              finished_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
              run_id: Number(process.env.RUN_ID),
              base_sha: process.env.BASE_SHA,
              target_branch: process.env.TARGET_BRANCH,
              model: process.env.MODEL,
              changed_files: 0,
              files: [],
              unsafe_files: [],
              opencode_exit_code: null,
              patch_artifact: null,
              failure: `runtime_job_${process.env.RUNTIME_RESULT || 'unknown'}`,
            }));
          NODE
          fi

      - name: Post compact result to CHE mailbox branch
        id: post
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.job_id }}
          PR_NUMBER: ${{ needs.deliver.outputs.pr_number }}
          DELIVER_RESULT: ${{ needs.deliver.result }}
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const branch = 'che-mailbox';
            const path = `mailbox/runtime/${process.env.JOB_ID}.json`;
            const result = JSON.parse(fs.readFileSync('/tmp/che-runtime-result/che-runtime-result.json', 'utf8'));
            if (result.checkpoint) {
              const cpPath = `mailbox/runtime/checkpoints/${process.env.JOB_ID}.json`;
              let cpSha;
              try { cpSha = (await github.rest.repos.getContent({ ...context.repo, path: cpPath, ref: branch })).data.sha; } catch (error) { if (error.status !== 404) throw error; }
              const saved = result.checkpoint;
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path: cpPath, branch,
                message: `runtime checkpoint: ${process.env.JOB_ID}`,
                content: Buffer.from(JSON.stringify(saved)).toString('base64'),
                ...(cpSha ? { sha: cpSha } : {}),
              });
              result.checkpoint = { seq: saved.meta.seq, files: saved.meta.files, additions: saved.meta.additions, deletions: saved.meta.deletions, path: cpPath };
            }
            // The final record keeps the owner's merge decision; without it the PR waits for his yes.
            result.merge_authorized = process.env.MERGE_AUTHORIZED === 'true';
            const pr = Number(process.env.PR_NUMBER || 0);
            if (pr && result.state === 'implemented') Object.assign(result, { state: 'pr_open', pr_number: pr });
            if (!pr && result.state === 'implemented' && process.env.DELIVER_RESULT === 'failure') {
              // The code change exists but no PR could be opened; never leave
              // CHE reporting progress that is not happening.
              Object.assign(result, { state: 'blocked', failure: 'deliver_failed', error: 'Code change was made but the PR could not be opened. Check the CHE_GITHUB_TOKEN GitHub Actions secret (needs contents, pull requests and workflows write on this repo).' });
            }
            const content = JSON.stringify(result);
            fs.writeFileSync('/tmp/che-runtime-result/final.json', content);
            let sha;
            try {
              const current = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              message: `runtime: ${process.env.JOB_ID}`,
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
            core.setOutput('state', String(result.state || ''));
            core.setOutput('failure', String(result.failure || ''));

      - name: Checkout the router policy from the session's base
        id: router
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            server/cloudflare/model_router.mjs
            server/cloudflare/coding_failover.mjs
          sparse-checkout-cone-mode: false

      # One ledger for the app's AI Model Status and the next run's circuit breakers: attempts
      # completed and failed per model and provider, error classes, verdicts and measured cost.
      - name: Update the model ledger
        if: steps.router.outcome == 'success' && steps.post.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.job_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { mergeLedger } = await import(`${process.env.GITHUB_WORKSPACE}/server/cloudflare/model_router.mjs`);
            const record = JSON.parse(fs.readFileSync('/tmp/che-runtime-result/final.json', 'utf8'));
            const path = 'mailbox/runtime/model-ledger.json';
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              let sha; let ledger = null;
              try {
                const found = await github.rest.repos.getContent({ ...context.repo, path, ref: 'che-mailbox' });
                sha = found.data.sha;
                ledger = JSON.parse(Buffer.from(String(found.data.content || '').replace(/\s+/g, ''), 'base64').toString('utf8'));
              } catch (error) { if (error.status !== 404) throw error; }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo, path, branch: 'che-mailbox',
                  message: `model ledger: ${process.env.JOB_ID}`,
                  content: Buffer.from(JSON.stringify(mergeLedger(ledger, record))).toString('base64'),
                  ...(sha ? { sha } : {}),
                });
                return;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 3) throw error;
              }
            }

      # The run's own status says what the coding session did: a session that every model failed
      # (or that could not deliver) is a red run, never a green wrapper around a blocked job.
      - name: Fail the run when the coding session was blocked
        if: steps.post.outputs.state == 'blocked' || steps.post.outputs.state == 'failed'
        env:
          JOB_ID: ${{ inputs.job_id }}
          STATE: ${{ steps.post.outputs.state }}
          FAILURE: ${{ steps.post.outputs.failure }}
        run: |
          echo "::error::CHE coding session $JOB_ID ended $STATE (${FAILURE:-no reason given}). Its record is on che-mailbox; no change was delivered."
          exit 1
