name: CHE forward paper trading probe

# Run by hand. Makes a new random probe token, stores it as the production
# Worker's CHE_VOICE_PROBE_TOKEN secret, then runs one paper-only forward pass
# on the live Worker and prints what it recorded. Paper only: the probe arms
# the owner's minute alarm and never places a live order. The next deploy
# replaces this token, as it does today.
on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the production deploy's group: the deploy writes CHE_VOICE_PROBE_TOKEN too,
# so a probe must never run while a deploy is writing it.
concurrency:
  group: che-worker-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c49b395e8f1138b5fae36ab88222542c
      CHE_LIVE_BASE: https://chey-app.henryjavoni.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make a new probe token and store it on the production Worker
        working-directory: server/cloudflare
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx --yes wrangler@4 secret put CHE_VOICE_PROBE_TOKEN
          echo "CHE_VOICE_PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          sleep 20

      - name: Run one forward paper pass on the live Worker
        env:
          GH_SUMMARY: ${{ github.step_summary }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const summary = (line) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          let report = null;
          let lastError = '';
          for (let attempt = 0; attempt < 5 && !report; attempt++) {
            try {
              const response = await fetch(`${process.env.CHE_LIVE_BASE}/api/trading/probe`, {
                method: 'POST', headers: { Authorization: `Bearer ${process.env.CHE_VOICE_PROBE_TOKEN}` }, signal: AbortSignal.timeout(60000),
              });
              if (response.ok) report = await response.json(); else lastError = `HTTP ${response.status}`;
            } catch (error) { lastError = error?.name === 'TimeoutError' ? 'no answer within 60 s' : 'network error'; }
            if (!report) await new Promise((resolve) => setTimeout(resolve, 6000));
          }
          if (!report) { console.log(`::error title=Trading probe did not run::${lastError}`); process.exit(1); }
          const f = report.feed || {};
          const line = `Paper trading ${report.state?.enabled ? 'ON' : 'OFF'} (${report.account}); feed ${f.status || 'none'} ${f.symbol || ''} ${report.contract || ''}, last bar ${f.last_bar || '-'}${f.error ? `, error: ${f.error}` : ''}; market ${report.session?.state}; signals ${report.counts?.signals ?? 0}, entries ${report.counts?.filled ?? 0}, closed ${report.totals?.trades ?? 0} (${report.totals?.wins ?? 0} won, ${report.totals?.losses ?? 0} lost, net ${report.totals?.net_pnl ?? 0}), open ${(report.positions || []).length}`;
          console.log(`::notice title=Forward paper trading (probe run)::${line}`);
          summary(`**Forward paper trading (probe run, paper only):** ${line}.`);
          JS
