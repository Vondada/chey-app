name: CHE Free Video Render
run-name: CHE free render ${{ github.event.client_payload.job_id || inputs.job_id || github.sha }}
on:
  # Uses Contents:write permission as a fallback when the existing token
  # cannot call workflow_dispatch, which requires Actions:write.
  repository_dispatch:
    types: [che_video_render]
  workflow_dispatch:
    inputs:
      job_id:
        description: Non-secret task identifier
        required: true
        type: string
      topic:
        description: Video topic
        required: true
        type: string
      seconds:
        description: Duration (5-90)
        required: false
        type: string
        default: "15"
      spec:
        description: Creator Studio storyboard JSON (optional; vertical episode)
        required: false
        type: string
        default: ""
  push:
    branches: [chatgpt/video-repository-dispatch-fallback]
    paths:
      - ".github/workflows/che-video-render.yml"
      - "tools/che_video_render.py"
permissions:
  contents: read
# One group per render job, so queued renders never cancel each other.
concurrency:
  group: free-video-${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache offline voice and pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/piper_tts
            ~/.cache/pip
          key: che-offline-voice-${{ runner.os }}-py312-v1
          restore-keys: |
            che-offline-voice-${{ runner.os }}-py312-
      - name: Install offline renderer
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Install Python rendering dependencies"
          timeout 90s python -m pip install --disable-pip-version-check --retries 2 --timeout 15 pillow piper-tts
          echo "::endgroup::"
          echo "::group::Verify or download offline narration voice"
          # Kristin is trained on public-domain LibriVox recordings.
          timeout 90s python -m piper.download_voices en_US-kristin-medium
          echo "::endgroup::"
          echo "::group::Verify system renderer dependencies"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v espeak-ng >/dev/null; then
            echo "Missing system tools; updating apt with a hard timeout"
            timeout 75s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
            timeout 75s sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg espeak-ng
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v espeak-ng
          timeout 15s python -m piper --help >/dev/null
          echo "Offline renderer dependencies verified"
          echo "::endgroup::"
      # Finished Fish narration is kept between runs, keyed by text, model and
      # voice inside the renderer, so the same narration is never paid twice.
      - name: Reuse earlier narration audio
        uses: actions/cache@v4
        with:
          path: ~/.cache/che-narration
          key: che-narration-${{ github.run_id }}
          restore-keys: che-narration-
      - name: Render and independently probe video and thumbnail
        env:
          TOPIC: ${{ github.event.client_payload.topic || inputs.topic || '3 surprising facts about space' }}
          DURATION: ${{ github.event.client_payload.seconds || inputs.seconds || '15' }}
          # Free by default: the Piper voice narrates. Fish (a paid service)
          # narrates only when the owner sets the repository variable
          # CHE_FISH_NARRATION=1; CHE_FISH_PREFERRED=0 stops every Fish call.
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          CHE_FISH_PREFERRED: ${{ secrets.CHE_FISH_PREFERRED || vars.CHE_FISH_PREFERRED || '1' }}
          CHE_FISH_VOICE_ID: ${{ secrets.CHE_FISH_VOICE_ID || vars.CHE_FISH_VOICE_ID }}
          CHE_FISH_EXPRESSIVE_MODEL: ${{ vars.CHE_FISH_EXPRESSIVE_MODEL || secrets.CHE_FISH_EXPRESSIVE_MODEL }}
          # Used when Drama 3 cannot be used (for example no Fish API credit).
          CHE_FISH_MODEL: ${{ vars.CHE_FISH_MODEL || secrets.CHE_FISH_MODEL }}
          CHE_FISH_NARRATION: ${{ vars.CHE_FISH_NARRATION }}
          # A storyboard is read from the environment by name, never pasted
          # into the command line; the renderer validates it before drawing.
          CHE_RENDER_SPEC: ${{ github.event.client_payload.spec || inputs.spec || '' }}
        run: |
          python tools/che_video_render.py --topic "$TOPIC" --seconds "$DURATION" --out rendered --spec-env CHE_RENDER_SPEC
      - name: Retain files for authenticated owner preview
        uses: actions/upload-artifact@v4
        with:
          name: che-video-${{ github.event.client_payload.job_id || inputs.job_id || github.sha }}
          path: |
            rendered/video.mp4
            rendered/thumbnail.png
            rendered/manifest.json
            rendered/captions.srt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
