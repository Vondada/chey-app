name: CHE Shorebird

# Shorebird code push for Dart-only CHE updates.
#   release: builds a Shorebird iOS release (unsigned, for SideStore). Phones
#            must run a Shorebird release before patches can apply.
#   patch:   ships Dart changes merged to main to phones on that release.
# One-time setup: create a Shorebird API key at https://console.shorebird.dev,
# save it as the SHOREBIRD_TOKEN repository secret, and the "CHE Shorebird
# setup" workflow runs `shorebird init` and commits shorebird.yaml.
# Merged "che/update-*" pull requests patch automatically once configured.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: release or patch
        required: true
        default: patch
        type: choice
        options: [patch, release]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shorebird:
    # Any approved merge that changes eligible Dart code may need an OTA patch.
    # The lane check below prevents Worker/docs/test/native-only changes from
    # consuming a macOS runner or publishing an unnecessary patch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      CHE_AGENT_URL: ${{ secrets.CHE_AGENT_URL }}
      MODE: ${{ github.event.inputs.mode || 'patch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide whether this push needs Shorebird
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          files="$(git diff --name-only "$before" "$after" 2>/dev/null || git diff-tree --no-commit-id --name-only -r "$after")"
          echo "$files"
          run=false
          while IFS= read -r path; do
            case "$path" in
              lib/*.dart|lib/**/*.dart) run=true ;;
              ios/*|assets/*|pubspec.yaml|pubspec.lock|shorebird.yaml|codemagic.yaml|tool/bootstrap.sh|tool/patch_local_runtime.py)
                echo "::notice::Full iPhone release lane required by $path"
                run=false
                break
                ;;
            esac
          done <<<"$files"
          echo "run=$run" >> "$GITHUB_OUTPUT"


      - name: Check Shorebird is configured
        id: configured
        run: |
          if [[ "${{ steps.lane.outputs.run }}" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${SHOREBIRD_TOKEN}" || ! -f shorebird.yaml ]]; then
            echo "::error::A Dart OTA update is required, but Shorebird is not configured. Add SHOREBIRD_TOKEN and keep shorebird.yaml committed; otherwise run the full IPA lane."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Same toolchain as the CHE iPhone IPA build, so patches match releases.
      - name: Use newest Xcode
        if: steps.configured.outputs.ready == 'true'
        run: |
          latest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        if: steps.configured.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Install Shorebird
        if: steps.configured.outputs.ready == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      - name: Bootstrap native projects
        if: steps.configured.outputs.ready == 'true'
        run: bash ./tool/bootstrap.sh

      - name: Enable local AI + voice tuning bridge
        if: steps.configured.outputs.ready == 'true'
        run: python3 ./tool/patch_local_runtime.py

      - name: Shorebird release (unsigned)
        if: steps.configured.outputs.ready == 'true' && env.MODE == 'release'
        run: shorebird release ios --no-codesign -- --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"

      - name: Shorebird patch
        if: steps.configured.outputs.ready == 'true' && env.MODE == 'patch'
        run: shorebird patch ios --no-codesign --release-version=latest --allow-native-diffs --allow-asset-diffs -- --dart-define=CHE_AGENT_URL="${CHE_AGENT_URL:-}"

      - name: Package unsigned IPA (release only)
        if: steps.configured.outputs.ready == 'true' && env.MODE == 'release'
        run: |
          set -eu
          app="$(find build/ios/archive -maxdepth 5 -type d -path '*Products/Applications/Runner.app' | head -1)"
          test -d "$app" || { echo "::error::Runner.app not found"; exit 1; }
          mkdir -p build/ios/ipa/Payload
          cp -R "$app" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry CHE-unsigned.ipa Payload && rm -rf Payload

      - name: Upload CHE IPA (release only)
        if: steps.configured.outputs.ready == 'true' && env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CHE-unsigned-ipa-self-updating
          path: build/ios/ipa/CHE-unsigned.ipa
          retention-days: 7
