# TEMPORARY (removed before the PR): returns flutter analyze / flutter test
# output as check-run annotations so a cloud session without a Flutter SDK
# can read real failures.
name: CHE 3D feedback
on:
  push:
    branches: ['che/3d-world*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1; echo "exit=$?" >> analyze.txt
          grep -E "^\s*(error|warning|info) •" analyze.txt | head -45 | while IFS= read -r line; do echo "::warning title=analyze::$line"; done
          tail -3 analyze.txt | tr '\n' ' ' | sed 's/^/::notice title=analyze-summary::/'; echo
      - name: test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1; echo "exit=$?" >> test.txt
          python3 - <<'PY'
          import re
          t = open('test.txt', encoding='utf-8', errors='replace').read()
          blocks = re.split(r'\n(?=\d\d:\d\d \+\d+)', t)
          fails = [b for b in blocks if '[E]' in b.splitlines()[0]] if blocks else []
          for b in fails[:12]:
              msg = b[:3500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::warning title=test-failure::' + msg)
          tail = t[-1500:].replace('%', '%25').replace('\n', '%0A')
          print('::notice title=test-summary::' + tail)
          PY
