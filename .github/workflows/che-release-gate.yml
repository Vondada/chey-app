name: CHE release gate

# Offline checks every CHE pull request must pass before it merges (owner, 2026-10-26):
#   worker    the Worker's full test suite (syntax and unit tests)
#   flutter   flutter analyze and the full Flutter test suite
#   coding    CHE's own coding reliability: her coding tests, run as a named job so a failure is visible
# The LIVE gate is che-worker-staging.yml, job "live (staging)": the PR deployed to the staging Worker
# and probed live (owner, 2026-10-27: "always do live tests ... before merging").
#
#   screens   the iOS simulator: every main tab has content and no error text, the Office sections swipe
#             smoothly, and each screen is saved as a screenshot for the owner to review. NOT a merge gate
#             (owner, 2026-10-27: live tests are the requirement, not the iOS simulator). It runs only by
#             hand (Actions -> CHE release gate -> Run workflow); a red screens job never blocks a merge.
# Nothing here publishes or deploys.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: che-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker syntax and unit tests
        # Offline by design: tests must not reach the runner's network (test_offline_guard.mjs). The same guard
        # as che-worker-staging.yml, so this gate and the live gate run the same tests.
        env:
          NODE_OPTIONS: --import ./server/cloudflare/test_offline_guard.mjs
        run: |
          for f in server/cloudflare/*.js; do node --check "$f"; done
          # Output kept so that, when a test fails, the failing test names and errors are printed LAST.
          set +e
          node --test server/cloudflare/*.test.mjs > worker-tests.tap 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat worker-tests.tap
            echo "::group::Failing Worker tests (names and errors)"
            awk '/^ *not ok /{p=1} /^ *ok /{p=0} p' worker-tests.tap | head -400
            grep -E '^# (tests|pass|fail)' worker-tests.tap
            echo "::endgroup::"
          fi
          exit "$code"

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --fatal-infos
      - name: Flutter tests
        run: flutter test --file-reporter json:flutter-test.json
      - name: List failing Flutter tests
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          names = {}
          failed = []
          for line in open('flutter-test.json'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'error':
                  failed.append((names.get(e.get('testID'), e.get('testID')), e.get('error', '')[:600]))
          prints = {}
          for line in open('flutter-test.json'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'print':
                  prints.setdefault(e.get('testID'), []).append(str(e.get('message', '')))
          for name, error in failed:
              print('FAILED TEST: ' + str(name))
              print(error)
              print('--- console output of this test (last 6000 characters) ---')
              print(''.join(prints.get(next((k for k, v in names.items() if v == name), None), []))[-6000:])
              print('---')
          print('FAILED TESTS LISTED: %d' % len(failed))
          PY
      # Golden failures write the approved image, the new render and the difference here, so the owner can compare
      # them before deciding whether to approve a visual change. Goldens are never regenerated by this job.
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: che-golden-failures-${{ github.sha }}
          path: test/failures/
          if-no-files-found: ignore

  coding:
    # CHE's coding reliability: her own coding team's tests (search, planning, the engineering budget, the
    # index of her own code). Offline and deterministic: no model calls, no GitHub access.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coding team tests
        run: node --test server/cloudflare/code_index.test.mjs server/cloudflare/self_development.test.mjs

  screens:
    # Informational only: never on a pull request, only when run by hand (macOS minutes are not spent
    # automatically).
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap native projects
        run: bash ./tool/bootstrap.sh
      - name: Enable local AI + voice tuning bridge
        run: python3 ./tool/patch_local_runtime.py
      - name: Boot an iPhone simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-6]' | grep -oE '[0-9A-F-]{36}')"
          test -n "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Screen and swipe gate on the simulator
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screens_gate_test.dart -d "${{ steps.sim.outputs.udid }}"
      - name: Trading order flow (paper, never sends)
        if: always()
        run: flutter test integration_test/trading_order_flow_test.dart -d "${{ steps.sim.outputs.udid }}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: che-screens-${{ github.sha }}
          path: screens/
          if-no-files-found: warn
