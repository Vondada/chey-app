<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d171b}canvas{display:block}#code{position:absolute;inset:8%;display:none;background:#081014f7;color:#dffdf6;border:1px solid #34e0b8;border-radius:18px;padding:14px;overflow:auto;white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;z-index:5}#hint{position:absolute;left:10px;bottom:9px;color:#b7d8d1;font:11px -apple-system;background:#101d20cc;padding:5px 8px;border-radius:9px}</style></head><body><div id="code"></div><div id="hint">Pinch a selected code orb to read its code</div><script src="three.min.js"></script><script src="che3d-agents.js"></script><script>
(()=>{const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x0d171b);scene.fog=new T.Fog(0x0d171b,18,38);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,10,16);camera.lookAt(0,2,0);const renderer=Che3D.tuneRenderer(new T.WebGLRenderer({antialias:true}),{maxDpr:1.25,shadows:false});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xdffdf6,0x173039,2.1));const key=new T.DirectionalLight(0xffffff,2.2);key.position.set(5,11,7);scene.add(key);const floor=new T.Mesh(new T.CylinderGeometry(10.5,10.5,.25,48),new T.MeshStandardMaterial({color:0x18282d,roughness:.88}));floor.position.y=-.15;scene.add(floor);const grid=new T.GridHelper(19,18,0x2fafa6,0x294147);grid.position.y=.01;scene.add(grid);
const crowd=new Che3D.AgentCrowd({scene,room:"office",homes:[new T.Vector3(-6,.3,2),new T.Vector3(-4,.3,-3),new T.Vector3(4,.3,-3),new T.Vector3(6,.3,2),new T.Vector3(0,.3,5)],waypoints:[new T.Vector3(-5,.3,4),new T.Vector3(0,.3,4),new T.Vector3(5,.3,4),new T.Vector3(-5,.3,-4),new T.Vector3(5,.3,-4)]});let dynamic=[],staticHits=[],data={},selected=null;const code=document.getElementById("code");
function label(text,color=0xffffff){const c=document.createElement("canvas");c.width=520;c.height=100;const x=c.getContext("2d");x.fillStyle="#0a171bdd";x.fillRect(0,0,520,100);x.fillStyle="#"+new T.Color(color).getHexString();x.font="700 27px -apple-system";x.fillText(String(text).slice(0,31),18,42);x.fillStyle="#a8c8c1";x.font="20px -apple-system";x.fillText(String(text).slice(31,66),18,75);const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;const s=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true}));s.scale.set(4.8,.92,1);return s}
function add(root,id,isStatic=false){root.userData.tapId=id;root.traverse(x=>x.userData.tapRoot=root);scene.add(root);(isStatic?staticHits:dynamic).push(root);return root}
function clear(){for(const o of dynamic){scene.remove(o);o.traverse(x=>{x.geometry?.dispose();x.material?.dispose?.()})}dynamic=[]}
function orb(p,i){const g=new T.Group(),m=p.metrics||{},known=(+m.files_changed||0)+(+m.tests_passing||0)+Math.min(50,(+m.lines_written||0)/20),fact=p.progress==null?0:+p.progress,scale=1+Math.min(.75,known/80)+(fact?fact/250:0),mat=new T.MeshStandardMaterial({color:0x34e0b8,emissive:0x159d91,emissiveIntensity:.7+Math.min(1,known/35),roughness:.18,metalness:.3});g.add(new T.Mesh(new T.IcosahedronGeometry(.65*scale,3),mat));const r=new T.Mesh(new T.TorusGeometry(.9*scale,.025,8,36),new T.MeshBasicMaterial({color:0x8fffe6,transparent:true,opacity:.65}));r.rotation.x=Math.PI/2;g.add(r);const l=label((p.who||"Crew")+" · "+(p.title||"work"),0x8fffe6);l.position.y=1.45*scale;g.add(l);g.position.set(-5+(i%4)*3.4,1.1,2.8-Math.floor(i/4)*3.3);g.userData.piece=p;return add(g,"work:"+p.id)}
function trophy(p,i){const g=new T.Group();let m;if(p.type==="website")m=new T.Mesh(new T.BoxGeometry(1.5,1,.08),new T.MeshStandardMaterial({color:0x4bd4c5}));else if(p.type==="app")m=new T.Mesh(new T.BoxGeometry(.72,1.35,.12),new T.MeshStandardMaterial({color:0x202d35,metalness:.5}));else if(p.type==="video")m=new T.Mesh(new T.BoxGeometry(1.45,.82,.09),new T.MeshStandardMaterial({color:0xa45470}));else m=new T.Mesh(new T.OctahedronGeometry(.72),new T.MeshStandardMaterial({color:0x86f7e2,emissive:0x176e67,emissiveIntensity:.7}));g.add(m);const l=label((p.who||"Crew")+" · "+(p.title||"finished"),0xffd477);l.position.y=1.25;g.add(l);g.position.set(-5.6+i*2.8,1.2,-6.2);g.userData.piece=p;return add(g,"work:"+p.id)}
function door(name,id,x){const g=new T.Group(),d=new T.Mesh(new T.BoxGeometry(2.3,3.6,.22),new T.MeshStandardMaterial({color:0x233940,emissive:0x0e3131}));d.position.y=1.8;g.add(d);const l=label(name);l.position.y=3.8;l.scale.multiplyScalar(.65);g.add(l);g.position.set(x,0,-8.3);add(g,"door:"+id,true)}door("THEATER","theater",-5);door("MUSIC","music",0);door("ART","art",5);
function rebuild(){clear();const avatars=data.avatars||{};crowd.upsert((data.agents||[]).map(a=>({...a,appearance:avatars[a.id]||a.appearance||null})));(data.active||[]).slice(0,12).forEach(orb);(data.trophies||[]).slice(0,5).forEach(trophy)}window.updateWorkshop=next=>{data=next||{};rebuild();if(data.focus_agent){const f=String(data.focus_agent).toLowerCase(),p=(data.pieces||[]).find(x=>String(x.who||"").toLowerCase().includes(f)&&(x.code||x.diff));if(p){selected=p;show(p)}}};
function show(p){const raw=String(p.diff||p.code||"").trim();if(raw){code.textContent=(p.who||"Crew")+" · "+(p.title||"Code")+"\n\n"+raw;code.style.display="block"}}code.onclick=()=>code.style.display="none";const ray=new T.Raycaster(),pt=new T.Vector2();function hit(x,y){const r=renderer.domElement.getBoundingClientRect();pt.x=((x-r.left)/r.width)*2-1;pt.y=-((y-r.top)/r.height)*2+1;ray.setFromCamera(pt,camera);const targets=[];[...dynamic,...staticHits,...crowd.clickRoots].forEach(o=>o.traverse(x=>{if(x.isMesh||x.isSprite)targets.push(x)}));const h=ray.intersectObjects(targets,false)[0];return h?(h.object.userData.tapRoot||h.object.userData.agentRoot):null}
renderer.domElement.addEventListener("click",e=>{const h=hit(e.clientX,e.clientY);if(!h)return;if(h.userData.agentId){OfficeBridge.postMessage(JSON.stringify({type:"tap",id:"agent:"+h.userData.agentId}));return}const id=h.userData.tapId;if(!id)return;OfficeBridge.postMessage(JSON.stringify({type:"tap",id}));if(id.startsWith("work:")){selected=h.userData.piece;if(selected&&(selected.code||selected.diff))show(selected)}});let pinch=0;renderer.domElement.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});renderer.domElement.addEventListener("touchmove",e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(d>pinch*1.14&&selected)show(selected);camera.position.z=Math.max(9,Math.min(25,camera.position.z*(pinch/d)));pinch=d}},{passive:true});addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});Che3D.frameLoop((t,dt)=>{crowd.tick(t,dt);for(const o of dynamic)if(o.userData.piece&&!o.userData.piece.finished)o.rotation.y+=dt*.35;renderer.render(scene,camera)},{fps:60})})();
</script></body></html>
