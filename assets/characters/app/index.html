<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHE Office Crew</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#04090b;--panel:rgba(8,22,25,.9);--line:#1b5558;--fg:#e8fbfa;--muted:#93bdbb;--accent:#2ee6d6;--accent-ink:#03201e}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(var(--bg),transparent);font-size:20px;font-weight:600}
#status small{display:block;margin-top:2px;font-size:14px;font-weight:400;color:var(--muted)}
#dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
#clips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;min-height:44px;min-width:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#pad{position:fixed;left:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:rgba(8,22,25,.55);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(46,230,214,.6);pointer-events:none}
#crew{position:fixed;right:16px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;max-width:44vw}
#crew button{min-height:44px;padding:6px 10px;font-size:14px;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite">CHE loading…<small id="sub">Rigged 3D prototype</small></div>
<div id="pad" role="application" aria-label="Movement joystick. Drag to walk; push further to run. Keyboard: arrow keys." tabindex="0"><div id="knob"></div></div>
<div id="crew" role="group" aria-label="Office crew. Choose an agent to follow and hear their role."></div>
<div id="dock">
  <div id="clips" role="group" aria-label="CHE animations"></div>
</div>
<script src="characters-vendor.js"></script>
<script>
const THREE = window.THREE;
const GLTFLoader = window.THREE.GLTFLoader;
// Models arrive from the app as base64 (the WebView cannot read the bundle).
const glbHandlers = {};
const pendingStates = {};
function loadGlb(id, cb) { glbHandlers[id] = cb; }
// Messages to the app (Flutter JavaScriptChannel 'CheBridge'); silent when the page is opened on its own.
function tellApp(msg) { try { if (window.CheBridge) window.CheBridge.postMessage(JSON.stringify(msg)); } catch (_) {} }
const loadedIds = new Set();
const TOTAL_MODELS = 8;
function markLoaded(id) {
  loadedIds.add(id);
  if (loadedIds.size === TOTAL_MODELS) tellApp({ type: 'ready', loaded: loadedIds.size });
}
window.CHE = window.CHE || {};
window.CHE.supplyGlb = (id, b64) => {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  new GLTFLoader().parse(bytes.buffer, '', (gltf) => { if (glbHandlers[id]) glbHandlers[id](gltf); }, (err) => { console.error(err); tellApp({ type: 'error', id, message: String(err && err.message || err) }); });
};

const CLIPS = [
  ['idle', 'Idle'], ['walk', 'Walk'], ['run', 'Run'], ['wave', 'Wave'], ['talk', 'Talk'],
  ['think', 'Think'], ['celebrate', 'Celebrate'], ['nod', 'Nod'], ['shake', 'Shake head'],
  ['sit', 'Sit'], ['type', 'Type at desk'], ['stand', 'Stand'],
];
const ONE_SHOT = new Set(['sit', 'stand']);
const SEATED = new Set(['sit', 'type']);
const ROOM = 5.5;
const DESK = { x: 2.2, z: -2.5, hx: 0.8, hz: 0.35 };
// CHE's office agents: a standing spot, a facing direction (radians, 0 = toward +Z), and a chair at their desk.
// The app sets each clip from the agent's real runtime status (CHE.setStates); everyone starts idle.
const CREW = [
  { id: 'nova', name: 'Nova', role: 'Product and listings', at: [-2.2, -2.2], clip: 'idle', face: 0.6 },
  { id: 'atlas', name: 'Atlas', role: 'Research and sourcing', at: [-0.9, -3.0], clip: 'idle', face: 0.2 },
  { id: 'mira', name: 'Mira', role: 'Support copy and translation', at: [0.6, -3.2], clip: 'idle', face: 0 },
  { id: 'knox', name: 'Knox', role: 'Engineering', at: [2.2, -1.6], clip: 'idle', face: -0.6 },
  { id: 'sage', name: 'Sage', role: 'Finance reports, read only', at: [3.0, 0.2], clip: 'idle', face: -1.2 },
  { id: 'lyra', name: 'Lyra', role: 'Content and social', at: [-3.0, 0.0], clip: 'idle', face: 1.2 },
  { id: 'iris', name: 'Iris', role: 'Ad Studio', at: [-2.4, 1.6], clip: 'idle', face: 2.2 },
];

const $status = document.getElementById('status');
const $sub = document.getElementById('sub');
const $clips = document.getElementById('clips');
const say = (main, sub = '') => { $status.firstChild.textContent = main; $sub.textContent = sub; };

// ---------- renderer, camera, room
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04090b);
scene.fog = new THREE.Fog(0x04090b, 12, 26);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 60);

// Image-based light from a small generated studio, so skin, hair and cloth read as physical materials.
const pmrem = new THREE.PMREMGenerator(renderer);
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x0b1517);
function softbox(w, h, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(3), side: THREE.DoubleSide }));
  m.position.set(x, y, z);
  m.lookAt(0, 1, 0);
  studio.add(m);
}
softbox(5, 3, 0xcff8f2, 0, 4, -3);
softbox(3, 4, 0xffe2c2, -5, 2, 2);
softbox(3, 4, 0x9ff5ee, 5, 2, 2);
scene.environment = pmrem.fromScene(studio, 0.03).texture;

scene.add(new THREE.HemisphereLight(0x9ff5ee, 0x05080a, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 16 });
key.shadow.bias = -0.0008;
scene.add(key);
const rim = new THREE.PointLight(0x2ee6d6, 9, 9, 1.6);
rim.position.set(-2.5, 2.2, -2.5);
scene.add(rim);

const floorMat = new THREE.MeshStandardMaterial({ color: 0x0b1d20, roughness: 0.85, metalness: 0.05 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(ROOM * 2, 22, 0x1b5558, 0x123a3d);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, 4), new THREE.MeshStandardMaterial({ color: 0x08171a, roughness: 1 }));
wall.position.set(0, 2, -ROOM);
wall.receiveShadow = true;
scene.add(wall);

// Furniture: a desk with a screen and a chair for CHE and for each agent. Screens are the only emissive surfaces.
const deskMat = new THREE.MeshStandardMaterial({ color: 0x0f2a2e, roughness: 0.5, metalness: 0.2 });
const chairMat = new THREE.MeshStandardMaterial({ color: 0x143c40, roughness: 0.7, metalness: 0.05 });
const screenMat = new THREE.MeshStandardMaterial({ color: 0x06302f, emissive: 0x2ee6d6, emissiveIntensity: 0.35 });
function makeDesk(x, z, face) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.46), deskMat);
  top.position.y = 0.46;
  top.castShadow = top.receiveShadow = true;
  g.add(top);
  for (const [lx, lz] of [[-0.4, -0.2], [0.4, -0.2], [-0.4, 0.2], [0.4, 0.2]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.44, 0.04), deskMat);
    leg.position.set(lx, 0.22, lz);
    leg.castShadow = true;
    g.add(leg);
  }
  const screen = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.02), screenMat);
  screen.position.set(0, 0.64, -0.14);
  g.add(screen);
  g.position.set(x, 0, z);
  g.rotation.y = face + Math.PI;               // the screen faces the agent sitting at the chair
  scene.add(g);
  return g;
}
function makeChair(x, z, face) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.06, 0.42), chairMat);
  seat.position.y = 0.3;
  seat.castShadow = seat.receiveShadow = true;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.05), chairMat);
  back.position.set(0, 0.56, -0.2);
  back.castShadow = true;
  g.add(back);
  g.position.set(x, 0, z);
  g.rotation.y = face;
  scene.add(g);
  return g;
}
// CHE's own desk (the existing position) and one desk per crew member, in front of their standing spot.
const desk = makeDesk(DESK.x, DESK.z, 0);
desk.scale.set(1, 1, 1);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.26, 0.31, 48), new THREE.MeshBasicMaterial({ color: 0x2ee6d6, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2;
ring.visible = false;
scene.add(ring);

// ---------- character
const hero = new THREE.Group();
scene.add(hero);
let mixer = null;
const actions = {};
let current = null;
let selected = false;
let sitting = false;
let heading = 0;
const pos = new THREE.Vector3(0, 0, 1.2);
let heroFace = null;

// Shape keys (blink, mouth) and bones (head, neck, eyes) for one character.
function faceRigOf(root, seed) {
  const f = { root, morph: [], bones: {}, blink: 0, blinkT: -1, nextBlink: 1.5 + Math.random() * 3, mouth: 0, yaw: 0, pitch: 0, seed };
  root.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton && !f.bones.head) {
      for (const n of ['head', 'neck', 'eye.L', 'eye.R']) { const b = o.skeleton.getBoneByName(n); if (b) f.bones[n] = b; }
    }
    if (o.isMesh && o.morphTargetDictionary && o.morphTargetDictionary.blink !== undefined) f.morph.push(o);
  });
  return f;
}
const _v = new THREE.Vector3();
const _d = new THREE.Vector3();
const _inv = new THREE.Quaternion();
const _delta = new THREE.Quaternion();
const _e = new THREE.Euler();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
// Blink every few seconds, open the mouth while the character talks, and turn head and eyes toward a target.
function updateFace(f, dt, now, talking, target) {
  f.nextBlink -= dt;
  if (f.nextBlink <= 0) { f.blinkT = 0; f.nextBlink = 2.5 + Math.random() * 3.5; }
  if (f.blinkT >= 0) {
    f.blinkT += dt;
    const k = f.blinkT / 0.16;
    f.blink = k < 0.5 ? k * 2 : Math.max(0, 2 - k * 2);
    if (k >= 1) { f.blinkT = -1; f.blink = 0; }
  }
  const open = talking ? 0.22 + 0.42 * Math.abs(Math.sin(now * 0.017 + f.seed)) * (0.65 + 0.35 * Math.sin(now * 0.0047 + f.seed * 2)) : 0;
  f.mouth += (open - f.mouth) * Math.min(1, dt * 14);
  for (const m of f.morph) {
    const d = m.morphTargetDictionary;
    m.morphTargetInfluences[d.blink] = f.blink;
    m.morphTargetInfluences[d.mouth_open] = f.mouth;
    if (d.mouth_wide !== undefined) m.morphTargetInfluences[d.mouth_wide] = talking ? 0.12 * f.mouth : 0;
  }
  const head = f.bones.head;
  if (!head || !target) return;
  // Direction to the target in the character's own frame (the root only turns around Y).
  f.root.updateMatrixWorld(true);
  head.getWorldPosition(_v);
  _d.copy(target).sub(_v).applyQuaternion(_inv.copy(f.root.quaternion).invert());
  const yaw = clamp(Math.atan2(_d.x, _d.z), -0.9, 0.9);
  const pitch = clamp(Math.atan2(_d.y, Math.hypot(_d.x, _d.z)), -0.35, 0.35);
  const k = Math.min(1, dt * 5);
  f.yaw += (yaw - f.yaw) * k;
  f.pitch += (pitch - f.pitch) * k;
  head.quaternion.multiply(_delta.setFromEuler(_e.set(-f.pitch * 0.55, f.yaw * 0.6, 0)));
  if (f.bones['neck']) f.bones['neck'].quaternion.multiply(_delta.setFromEuler(_e.set(-f.pitch * 0.2, f.yaw * 0.25, 0)));
  for (const n of ['eye.L', 'eye.R']) if (f.bones[n]) f.bones[n].quaternion.multiply(_delta.setFromEuler(_e.set(-f.pitch * 0.8, f.yaw * 0.8, 0)));
}
let heroFaceState = null;

loadGlb('che', (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
    }
  });
  hero.add(root);
  mixer = new THREE.AnimationMixer(root);
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  heroFaceState = faceRigOf(root, 1.7);
  buildButtons();
  play(pendingStates.che ? pendingStates.che.clip : 'idle');
  markLoaded('che');
  say('CHE is ready', 'Drag the pad to walk. Tap CHE to select her. Use the buttons to play an animation.');
}, undefined, (err) => say('Could not load CHE', String(err && err.message || err)));

function play(name, { fade = 0.25 } = {}) {
  const next = actions[name];
  if (!next) return;
  if (current === next) return;
  next.reset();
  next.setLoop(ONE_SHOT.has(name) ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  next.clampWhenFinished = ONE_SHOT.has(name);
  next.enabled = true;
  if (current) current.fadeOut(fade);
  next.fadeIn(fade).play();
  current = next;
  for (const b of $clips.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.clip === name));
}

function buildButtons() {
  for (const [name, label] of CLIPS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.clip = name;
    b.textContent = label;
    b.setAttribute('aria-label', `Play ${label} animation`);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => choose(name));
    $clips.appendChild(b);
  }
}

function choose(name) {
  if (name === 'sit') { sitting = true; play('sit'); say('CHE is sitting down', 'Say or tap Stand to get up.'); return; }
  if (name === 'type') { sitting = true; play('type'); say('CHE is typing at her desk', 'Tap Stand to get up.'); return; }
  if (name === 'stand') { sitting = false; play('stand'); setTimeout(() => { if (!sitting) play('idle'); }, 1200); say('CHE is standing up'); return; }
  sitting = false;
  play(name);
  say(`CHE: ${name}`, '');
}

// ---------- the office crew: each agent has a standing spot and a desk; status moves them between the two
const $crew = document.getElementById('crew');
const crew = [];
for (const a of CREW) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = a.name;
  b.setAttribute('aria-label', `${a.name}, ${a.role}`);
  b.addEventListener('click', () => { greet(a.id); focusAgent(a.id); });
  $crew.appendChild(b);
  const fx = Math.sin(a.face), fz = Math.cos(a.face);
  const seat = { x: a.at[0] + fx * 0.55, z: a.at[1] + fz * 0.55 };
  makeDesk(a.at[0] + fx * 0.98, a.at[1] + fz * 0.98, a.face);
  makeChair(seat.x, seat.z, a.face);
  loadGlb(a.id, (gltf) => {
    const root = gltf.scene;
    root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
    root.position.set(a.at[0], 0, a.at[1]);
    root.rotation.y = a.face;
    scene.add(root);
    const m = new THREE.AnimationMixer(root);
    const acts = Object.fromEntries(gltf.animations.map((c) => [c.name, m.clipAction(c)]));
    acts[a.clip].play();
    const member = { ...a, root, mixer: m, acts, cur: acts[a.clip], still: false, seated: false, stand: { x: a.at[0], z: a.at[1] }, seat, rig: faceRigOf(root, a.at[0] * 3 + a.at[1]) };
    crew.push(member);
    if (pendingStates[a.id]) setCrewState(member, pendingStates[a.id]);
    markLoaded(a.id);
  });
}
function greet(id) {
  const c = crew.find((x) => x.id === id);
  const a = CREW.find((x) => x.id === id);
  say(`${a.name}: ${a.role}`, c ? `${a.name} waves at you.` : `${a.name} is still loading.`);
  if (!c) return;
  const w = c.acts.wave;
  c.cur.fadeOut(0.25);
  w.reset().fadeIn(0.25).play();
  setTimeout(() => { w.fadeOut(0.3); c.cur.reset().fadeIn(0.3).play(); }, 2600);
}

// ---------- camera: CHE (behind her), one agent (follow), overview, free, and first person
function focusAgent(id) {
  const c = crew.find((x) => x.id === id);
  if (!c) { say('Still loading', 'That teammate is not in the room yet.'); return false; }
  focusId = id;
  camMode = 'follow';
  zoom = 1;
  say(`Following ${c.name}`, 'Drag to orbit. Use Reset to return to CHE.');
  tellApp({ type: 'focus', id, mode: camMode });
  return true;
}
function setCameraMode(mode) {
  if (mode === 'che') return resetCamera();
  if (!['overview', 'free', 'follow'].includes(mode)) return false;
  if (mode === 'follow') return Boolean(focusId) && focusAgent(focusId);
  camMode = mode;
  focusId = null;
  say(mode === 'overview' ? 'Overview of the office' : 'Free camera', 'Drag to orbit. Use Reset to return to CHE.');
  tellApp({ type: 'camera', mode });
  return true;
}
function setViewStyle(style) {
  if (!['third', 'first'].includes(style)) return false;
  viewStyle = style;
  say(style === 'first' ? 'First-person view' : 'Third-person view', style === 'first' ? 'Looking where the character looks.' : 'Behind the character.');
  tellApp({ type: 'view', style });
  return true;
}
function resetCamera() {
  camMode = 'che';
  focusId = null;
  zoom = 1;
  camYaw = 0;
  say('Camera on CHE', 'Drag the pad to walk her around the room.');
  tellApp({ type: 'camera', mode: 'che' });
  return true;
}
function zoomBy(factor) {
  zoom = Math.max(0.5, Math.min(2.5, zoom * factor));
  return zoom;
}

// ---------- joystick (pointer + keyboard)
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
const stick = { x: 0, y: 0 };
let dragging = false;
function setStick(x, y) {
  const len = Math.hypot(x, y);
  const k = len > 1 ? 1 / len : 1;
  stick.x = x * k;
  stick.y = y * k;
  knob.style.transform = `translate(${stick.x * 40}px, ${stick.y * 40}px)`;
}
function fromPointer(e) {
  const r = pad.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * 2 - 1;
  const y = ((e.clientY - r.top) / r.height) * 2 - 1;
  setStick(x, y);
}
pad.addEventListener('pointerdown', (e) => { dragging = true; pad.setPointerCapture(e.pointerId); fromPointer(e); });
pad.addEventListener('pointermove', (e) => { if (dragging) fromPointer(e); });
const endDrag = () => { dragging = false; setStick(0, 0); };
pad.addEventListener('pointerup', endDrag);
pad.addEventListener('pointercancel', endDrag);
const keys = new Set();
window.addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } });
window.addEventListener('keyup', (e) => keys.delete(e.key));

// ---------- tap an agent to follow them, or CHE to select her (keeps the ring and status in sync)
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!mixer) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hitAgent = crew.find((c) => ray.intersectObject(c.root, true).length);
  if (hitAgent) { greet(hitAgent.id); focusAgent(hitAgent.id); return; }
  if (ray.intersectObject(hero, true).length) {
    selected = !selected;
    ring.visible = selected;
    say(selected ? 'CHE selected' : 'CHE deselected', selected ? 'Drag the pad to walk her around the room.' : '');
  }
});

// ---------- movement, collision, camera
const MOVE = { walk: 0.75, run: 1.8 };
let camYaw = 0;
let camMode = 'che';
let focusId = null;
let zoom = 1;
let viewStyle = 'third';
const ROOM_CENTER = new THREE.Vector3(0, 0.6, -0.5);
const _fwd = new THREE.Vector3();
const _eye = new THREE.Vector3();
const _lookAt = new THREE.Vector3();
function blocked(x, z) {
  if (crew.some((c) => Math.hypot(x - c.stand.x, z - c.stand.z) < 0.45)) return true;
  if (crew.some((c) => Math.hypot(x - c.seat.x, z - c.seat.z) < 0.3)) return true;
  return Math.abs(x - DESK.x) < DESK.hx + 0.25 && Math.abs(z - DESK.z) < DESK.hz + 0.25;
}
function update(dt, now) {
  let sx = stick.x, sy = stick.y;
  if (keys.has('ArrowLeft')) sx -= 1;
  if (keys.has('ArrowRight')) sx += 1;
  if (keys.has('ArrowUp')) sy -= 1;
  if (keys.has('ArrowDown')) sy += 1;
  const mag = Math.min(1, Math.hypot(sx, sy));
  if (mag > 0.12 && !sitting) {
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
    const rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    const dx = rx * sx + fx * -sy;
    const dz = rz * sx + fz * -sy;
    const len = Math.hypot(dx, dz) || 1;
    const running = mag > 0.8;
    const speed = running ? MOVE.run : MOVE.walk * Math.min(1, (mag - 0.12) / 0.5 + 0.4);
    const nx = pos.x + (dx / len) * speed * dt;
    const nz = pos.z + (dz / len) * speed * dt;
    if (!blocked(nx, nz)) { pos.x = nx; pos.z = nz; }
    pos.x = Math.max(-ROOM + 0.5, Math.min(ROOM - 0.5, pos.x));
    pos.z = Math.max(-ROOM + 0.5, Math.min(ROOM - 0.5, pos.z));
    heading = Math.atan2(dx, dz);
    const want = running ? 'run' : 'walk';
    if (mixer && current !== actions[want]) { play(want, { fade: 0.2 }); say(running ? 'CHE is running' : 'CHE is walking', 'Push the pad further to run.'); }
  } else if (mixer && !sitting && current && (current === actions.walk || current === actions.run)) {
    play('idle', { fade: 0.2 });
    say('CHE is standing still', '');
  }
  hero.position.copy(pos);
  hero.rotation.y = heading;
  ring.position.set(pos.x, 0.01, pos.z);
  if (mixer) mixer.update(dt);
  // Crew: move to the chair when seated, back to the standing spot otherwise; then update their mixers.
  for (const c of crew) {
    if (!c.still) c.mixer.update(dt);
    const goal = c.seated ? c.seat : c.stand;
    const k = 1 - Math.pow(0.001, dt);
    c.root.position.x += (goal.x - c.root.position.x) * k;
    c.root.position.z += (goal.z - c.root.position.z) * k;
  }
  // Faces: blink, mouth while talking, and head and eyes toward the camera (or a followed agent's target).
  if (heroFaceState) updateFace(heroFaceState, dt, now, current === actions.talk, camera.position);
  for (const c of crew) updateFace(c.rig, dt, now, c.cur === c.acts.talk, camera.position);

  let subject = null;
  if (camMode === 'follow' && focusId) subject = crew.find((x) => x.id === focusId) || null;
  if (camMode === 'che' || (camMode === 'follow' && !subject)) subject = null;

  if (viewStyle === 'first' && (camMode === 'che' || subject)) {
    // First person: the camera sits at eye level and looks where the character faces.
    const headBone = (subject ? subject.rig : heroFaceState) && (subject ? subject.rig : heroFaceState).bones.head;
    if (headBone) {
      headBone.getWorldPosition(_eye);
      _fwd.set(0, 0, 1).applyQuaternion((subject ? subject.root : hero).quaternion);
      _eye.addScaledVector(_fwd, 0.12);
      _lookAt.copy(_eye).addScaledVector(_fwd, 3);
      camera.position.lerp(_eye, 1 - Math.pow(0.0005, dt));
      camera.lookAt(_lookAt);
      return;
    }
  }

  // Third person: CHE (default), one agent (follow), or the whole room (overview, free).
  let target = null;
  let want = null;
  if (subject) {
    const d = 1.6 * zoom;
    target = new THREE.Vector3(subject.root.position.x, 0.8, subject.root.position.z);
    want = new THREE.Vector3(target.x + Math.sin(camYaw) * d, 1.25 * zoom, target.z + Math.cos(camYaw) * d);
  }
  if (!target && (camMode === 'overview' || camMode === 'free')) {
    const far = camMode === 'overview' ? 1 : 0.55;
    target = ROOM_CENTER.clone();
    want = new THREE.Vector3(ROOM_CENTER.x + Math.sin(camYaw) * 8.5 * far * zoom, (camMode === 'overview' ? 9.5 : 4.5) * zoom, ROOM_CENTER.z + Math.cos(camYaw) * 8.5 * far * zoom);
  }
  if (!target) {
    target = new THREE.Vector3(pos.x, 0.8, pos.z);
    want = new THREE.Vector3(target.x + Math.sin(camYaw) * 1.9 * zoom, 1.3 * zoom, target.z + Math.cos(camYaw) * 1.9 * zoom);
  }
  camera.position.lerp(want, 1 - Math.pow(0.02, dt));
  camera.lookAt(target);
}

renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY > 0 ? 1.1 : 0.9); }, { passive: false });

// Orbit the camera by dragging anywhere that is not the pad or a button.
let orbit = null;
renderer.domElement.addEventListener('pointerdown', (e) => { if (!selected) orbit = e.clientX; });
window.addEventListener('pointermove', (e) => { if (orbit !== null) { camYaw -= (e.clientX - orbit) * 0.008; orbit = e.clientX; } });
window.addEventListener('pointerup', () => { orbit = null; });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- real states from the app: one clip per character, from its runtime status
function setCrewState(member, st) {
  const next = member.acts[st.clip] || member.acts.idle;
  member.still = Boolean(st.still);
  member.seated = SEATED.has(st.clip) && Boolean(member.acts[st.clip]);
  if (next !== member.cur) {
    member.cur.fadeOut(0.35);
    next.reset().fadeIn(0.35).play();
    member.cur = next;
  }
}
function setStates(states) {
  for (const [id, st] of Object.entries(states || {})) {
    pendingStates[id] = st;
    if (id === 'che') { if (mixer) { sitting = SEATED.has(st.clip); play(st.clip in actions ? st.clip : 'idle'); } continue; }
    const member = crew.find((c) => c.id === id);
    if (member) setCrewState(member, st);
  }
}

// ---------- the render loop stops while the page is hidden or the app pauses it (no GPU work off screen)
let last = performance.now();
let paused = false;
let running = false;
function frame(now) {
  if (paused || document.hidden) { running = false; return; }
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt, now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function resume() {
  if (running || paused || document.hidden) return;
  running = true;
  last = performance.now();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', resume);
resume();

// Small hook for tests and for later voice or touch wiring.
window.CHE = {
  supplyGlb: window.CHE.supplyGlb,
  play: (name) => choose(name),
  stick: (x, y) => setStick(x, y),
  greet: (id) => greet(id),
  focus: (id) => focusAgent(id),
  mode: (name) => setCameraMode(name),
  view: (style) => setViewStyle(style),
  blink: () => { if (heroFaceState) heroFaceState.blinkT = 0; return true; },
  zoom: (factor) => zoomBy(factor),
  reset: () => resetCamera(),
  setStates: (states) => setStates(states),
  pause: (p) => { paused = Boolean(p); resume(); },
  get paused() { return paused || !running; },
  get crewLoaded() { return crew.length; },
  get camera() { return { mode: camMode, focus: focusId, zoom, view: viewStyle }; },
  get face() {
    const f = heroFaceState;
    return f ? { blink: f.blink, mouth: f.mouth, morphs: f.morph.length, head: Boolean(f.bones.head) } : null;
  },
  get state() { return { clip: current && Object.keys(actions).find((k) => actions[k] === current), pos: pos.toArray(), sitting, selected }; },
};
</script>
</body>
